<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt Ứng Dụng</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #0d0e12;
            color: #fff;
        }
        #btn-install {
            background: #1AAFFF;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        #btn-install:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        #status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #a0a5b5;
        }
    </style>
</head>
<body>

    <button id="btn-install" disabled>Đang kiểm tra...</button>
    <div id="status"></div>

<script>
    let deferredPrompt = null;
    const btnInstall = document.getElementById("btn-install");
    const statusDiv = document.getElementById("status");

    // 1. Tự động tạo File Web App Manifest động
    const manifest = {
        name: "Ứng Dụng Của Tôi",
        short_name: "App",
        start_url: location.href,
        display: "standalone",
        background_color: "#0d0e12",
        theme_color: "#1AAFFF",
        icons: [{
            src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231AAFFF'/><text x='50%' y='65%' font-size='50' text-anchor='middle' fill='white'>A</text></svg>",
            sizes: "192x192 512x512",
            type: "image/svg+xml"
        }]
    };
    const manifestLink = document.createElement("link");
    manifestLink.rel = "manifest";
    manifestLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: "application/json"}));
    document.head.appendChild(manifestLink);

    // 2. Đăng ký Service Worker động
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], {type: "application/javascript"})))
            .catch(() => {});
    }

    // 3. Kiểm tra xem ứng dụng đã cài đặt chưa
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

    if (isStandalone) {
        btnInstall.textContent = "Đã cài đặt";
        statusDiv.textContent = "Bạn đang chạy ứng dụng ở chế độ PWA.";
    } else {
        btnInstall.textContent = "Cài đặt Ứng dụng";
    }

    // 4. Lắng nghe sự kiện đủ điều kiện cài đặt từ Trình duyệt
    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btnInstall.disabled = false;
        statusDiv.textContent = "Sẵn sàng để cài đặt.";
    });

    // 5. Xử lý khi nhấn nút Cài đặt
    btnInstall.onclick = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            btnInstall.textContent = "Đã cài đặt";
            btnInstall.disabled = true;
            statusDiv.textContent = "Cài đặt thành công!";
        }
        deferredPrompt = null;
    };

    // Phản hồi môi trường chạy
    if (!isStandalone && !location.protocol.startsWith('https') && location.hostname !== 'localhost') {
        statusDiv.textContent = "Lưu ý: PWA yêu cầu chạy trên HTTPS hoặc Localhost.";
    }
</script>
</body>
</html>
