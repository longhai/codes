<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo nghe nhạc từ Google Drive</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --bg-body: #14161c;
    --bg-card: #1e222c;
    --bg-input: #14161c;
    --bg-tab: #14161c;
    --bg-tab-active: #2a2f3d;
    --bg-menu: #2a2f3b;
    --bg-playing: #25324a;
    --text: #eee;
    --text-dim: #99a;
    --text-faint: #667;
    --border: #2a2f3b;
    --border-input: #333a48;
    --border-menu: #3a4152;
    --accent: #4c8dff;
    --accent-text: #8ab4ff;
    --danger: #ff7b7b;
    --seek-bg: #3a4152;
    --ok-bg: #0f2a1a;
    --ok-text: #4ade80;
    --warn-bg: #2a1a0f;
    --warn-text: #fbbf24;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-body: #f2f3f5;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --bg-tab: #e8eaed;
      --bg-tab-active: #ffffff;
      --bg-menu: #ffffff;
      --bg-playing: #e3edff;
      --text: #16181d;
      --text-dim: #5b6472;
      --text-faint: #8a93a3;
      --border: #e2e5ea;
      --border-input: #c9ced6;
      --border-menu: #d5d9e0;
      --accent: #2563eb;
      --accent-text: #1d4ed8;
      --danger: #dc2626;
      --seek-bg: #c9ced6;
      --ok-bg: #dcfce7;
      --ok-text: #166534;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
    }
  }
  html, body { overflow-x: hidden; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-body); color: var(--text); margin: 0; padding: 58px 0 148px; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
  .topbar-text { flex: 1; min-width: 0; }
  .app-title { font-size: 16px; font-weight: 700; }
  #settingsBtn, #searchBtn { background: none; border: none; cursor: pointer; padding: 4px 6px; color: var(--text); flex: 0 0 auto; display: flex; align-items: center; }
  #settingsBtn .material-icons, #searchBtn .material-icons { font-size: 24px; }
  #searchbar { display: none; position: fixed; top: 58px; left: 0; right: 0; z-index: 19; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 8px 12px; }
  #searchbar.open { display: flex; gap: 8px; }
  #searchbar input { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid var(--border-input); background: var(--bg-body); color: var(--text); font-size: 16px; }
  #searchClear { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px 8px; flex: 0 0 auto; display: flex; align-items: center; }
  body.search-open { padding-top: 116px; }
  #status { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  #status.err { color: var(--danger); }
  ul { list-style: none; padding: 6px 10px; margin: 0; }
  li { background: var(--bg-card); border-radius: 8px; padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; cursor: pointer; min-width: 0; margin-bottom: 6px; }
  li.playing { background: var(--bg-playing); border: 1px solid var(--accent); }
  li.playing .name { color: var(--accent-text); font-weight: 700; }
  li.resume-hint { border: 1px dashed var(--accent); }
  li .name { font-size: 14px; word-break: break-all; }
  li .track-main { flex: 1; min-width: 0; }
  li .folder { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  li .size { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .album-head { display: flex; align-items: center; gap: 8px; background: var(--bg-body); border-radius: 0; padding: 10px; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; min-width: 0; margin-bottom: 2px; }
  .album-head .arrow { color: var(--accent); flex: 0 0 auto; display: flex; align-items: center; }
  .album-head .album-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #empty { text-align: center; color: var(--text-dim); padding: 48px 24px; font-size: 14px; line-height: 1.6; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg-card); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  #nowRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #now { flex: 1; min-width: 0; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gotoBtn { background: none; border: none; color: var(--accent); font-size: 18px; cursor: pointer; padding: 2px 6px; flex: 0 0 auto; }
  #progressRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #timeCur, #timeTotal { font-size: 11px; color: var(--text-dim); flex: 0 0 auto; min-width: 38px; }
  #timeTotal { text-align: right; }
  #seekBar { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--border-menu); outline: none; }
  #seekBar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  #seekBar::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  #controlsRow { display: flex; align-items: center; justify-content: center; gap: 18px; }
  #controlsRow button { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px 8px; min-width: 44px; min-height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  #controlsRow .material-icons { font-size: 26px; }
  #playBtn .material-icons { font-size: 34px; }
  #playBtn { color: var(--accent) !important; }
  #shuffleBtn.active, #repeatBtn.active { background: var(--accent); color: #fff; }
  audio { width: 100%; max-width: 100%; display: block; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow-y: auto; }
  .modal.hidden { display: none; }
  .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; width: 100%; max-width: 420px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 700; margin-bottom: 12px; }
  #closeSettings { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .src-manage-head { font-size: 14px; font-weight: 700; margin: 14px 0 8px; }
  .tab-bar { display: flex; gap: 4px; margin: 4px 0 12px; background: var(--bg-body); border-radius: 12px; padding: 4px; }
  .tab { flex: 1; background: none; border: none; color: var(--text-dim); font-size: 14px; font-weight: 600; padding: 9px; cursor: pointer; border-radius: 8px; }
  .tab.active { color: var(--text); background: var(--bg-tab-active); }
  .tab-pane { min-height: 120px; }
  .btn-primary { padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-danger { padding: 11px; border: 1px solid var(--border-input); border-radius: 10px; background: none; color: var(--danger); font-size: 15px; cursor: pointer; }
  .api-key-status { font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; }
  .api-key-status.ok { background: var(--ok-bg); color: var(--ok-text); }
  .api-key-status.empty { background: var(--warn-bg); color: var(--warn-text); }
  .collapse-toggle { width: 100%; text-align: left; background: none; border: none; color: var(--text); font-size: 14px; font-weight: 700; padding: 10px 2px; cursor: pointer; display: flex; align-items: center; gap: 2px; margin-top: 6px; }
  .collapse-toggle .material-icons { font-size: 20px; color: var(--text-dim); transition: transform 0.15s; }
  .collapse-toggle.open .material-icons { transform: rotate(90deg); }
  #srcList { list-style: none; padding: 0; margin: 0 0 4px; }
  #srcList li { padding: 6px 10px; cursor: pointer; margin-bottom: 2px; }
  #srcList li span:first-child { font-size: 14px; }
  #srcList li.src-active { outline: 2px solid var(--accent); }
  .src-del, .src-edit, .src-ref { background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px; }
  .src-more { background: none; border: none; cursor: pointer; padding: 2px 6px; color: var(--text-dim); display: flex; align-items: center; }
  .src-menu { position: fixed; z-index: 60; background: var(--bg-menu); border: 1px solid var(--border-menu); border-radius: 10px; padding: 4px; min-width: 170px; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  .src-menu.hidden { display: none; }
  .src-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 11px 12px; font-size: 15px; cursor: pointer; border-radius: 6px; }
  .src-menu button:active { background: var(--border-menu); }
  .src-btns { display: flex; gap: 2px; flex: 0 0 auto; }
  .src-empty { color: var(--text-faint); font-size: 13px; text-align: center; padding: 8px; }
  .modal-box label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
  .modal-box input { width: 100%; max-width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-input); background: var(--bg-body); color: var(--text); font-size: 16px; margin-top: 4px; }
  #addSrcBtn:disabled { opacity: .5; cursor: default; }
  .note { font-size: 12px; color: var(--text-faint); margin: 10px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<header id="topbar">
  <div class="topbar-text">
    <div class="app-title"><span class="material-icons" style="font-size:20px;vertical-align:-4px">music_note</span> Drive Music</div>
    <div id="status"></div>
  </div>
  <button id="searchBtn" aria-label="Tìm kiếm"><span class="material-icons">search</span></button>
  <button id="settingsBtn" aria-label="Cài đặt"><span class="material-icons">settings</span></button>
</header>
<div id="searchbar">
  <input id="searchInput" placeholder="Tìm tên bài hoặc album..." autocomplete="off" />
  <button id="searchClear" aria-label="Đóng tìm kiếm"><span class="material-icons">close</span></button>
</div>
<ul id="list"></ul>
<div id="settingsModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><span><span class="material-icons" style="vertical-align:-4px">settings</span> Cài đặt</span><button id="closeSettings"><span class="material-icons">close</span></button></div>
    <div class="tab-bar">
      <button id="tabSources" class="tab active">Nguồn nhạc</button>
      <button id="tabApiKey" class="tab">API Key</button>
    </div>
    <div id="tabPaneSources" class="tab-pane">
      <ul id="srcList"></ul>
      <button id="toggleAddSrc" class="collapse-toggle"><span class="material-icons">chevron_right</span> Thêm nguồn mới</button>
      <div id="addSrcForm" style="display:none">
        <label>Tên nguồn mới
          <input id="srcName" placeholder="vd: Nhạc Trịnh" />
        </label>
        <label>Dán link folder chia sẻ hoặc Folder ID
          <input id="newFolderId" placeholder="https://drive.google.com/drive/folders/..." />
        </label>
        <div style="display:flex;gap:8px">
          <button id="cancelEditBtn" class="btn-danger" style="display:none;flex:1"><span class="material-icons" style="vertical-align:-4px;font-size:20px">close</span> Hủy sửa</button>
          <button id="addSrcBtn" class="btn-primary" style="flex:1"><span class="material-icons" style="vertical-align:-4px;font-size:20px">add</span> Thêm nguồn</button>
        </div>
      </div>
      <p class="note">Bấm vào nguồn để nghe, bấm <span class="material-icons" style="font-size:14px;vertical-align:-2px">more_vert</span> để cập nhật/sửa/xóa.</p>
      <button id="exportBtn" class="btn-danger" style="width:100%;margin-top:8px"><span class="material-icons" style="vertical-align:-4px;font-size:20px">share</span> Xuất playlist (chia sẻ không cần key)</button>
    </div>
    <div id="tabPaneApiKey" class="tab-pane" style="display:none">
      <div class="api-key-status" id="apiKeyStatus"></div>
      <label>Key dùng để đọc Google Drive
        <input id="apiKeyInput" type="password" placeholder="Dán API key vào đây" autocomplete="off" />
      </label>
      <div style="display:flex;gap:8px">
        <button id="saveKeyBtn" class="btn-primary" style="flex:1">Lưu key</button>
        <button id="delKeyBtn" class="btn-danger" style="flex:1">Xóa key</button>
      </div>
      <p class="note">Key chỉ lưu trên máy này, không gửi đi đâu khác.</p>
    </div>
  </div>
</div>
<div id="srcMenu" class="src-menu hidden">
  <button data-act="refresh"><span class="material-icons" style="vertical-align:-4px">refresh</span> Cập nhật danh sách</button>
  <button data-act="edit"><span class="material-icons" style="vertical-align:-4px">edit</span> Sửa tên/link</button>
  <button data-act="delete"><span class="material-icons" style="vertical-align:-4px">delete</span> Xóa nguồn</button>
</div>
<div id="bar">
  <div id="nowRow">
    <div id="now">Chưa chọn bài nào</div>
    <button id="gotoBtn" aria-label="Tới bài đang phát"><span class="material-icons" style="font-size:20px">my_location</span></button>
  </div>
  <div id="progressRow">
    <span id="timeCur">0:00</span>
    <input id="seekBar" type="range" min="0" max="1000" value="0" aria-label="Tua bài hát" />
    <span id="timeTotal">0:00</span>
  </div>
  <div id="controlsRow">
    <button id="shuffleBtn" aria-label="Phát ngẫu nhiên"><span class="material-icons">shuffle</span></button>
    <button id="prevBtn" aria-label="Bài trước"><span class="material-icons">skip_previous</span></button>
    <button id="playBtn" aria-label="Phát / Tạm dừng"><span class="material-icons">play_arrow</span></button>
    <button id="nextBtn" aria-label="Bài tiếp"><span class="material-icons">skip_next</span></button>
    <button id="repeatBtn" aria-label="Lặp lại"><span class="material-icons">repeat</span></button>
  </div>
  <audio id="player" preload="none"></audio>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"),
      listEl = $("list"), player = $("player"), nowEl = $("now"),
      srcListEl = $("srcList"),
      settingsModal = $("settingsModal");
  var tracks = [], current = -1, playSeq = 0;
  // Danh sách đang phát (có thể khác với tracks đang hiển thị khi chuyển nguồn giữa chừng)
  var playTracks = [], playCurrent = -1, playFolderId = "";
  var searchQuery = "", searchOpen = false;
  var shuffleOn = false, repeatMode = 0; // 0=tắt, 1=lặp tất cả, 2=lặp 1 bài
  var pendingResume = null; // { trackId, idx, time } — vị trí cũ, chờ Hải bấm vào bài để nghe tiếp
  var pendingSeek = null; // giây — vị trí cần tua tới khi bài bắt đầu phát

  // Nhiều nguồn nhạc: { sources: [{name, folderId}], current, apiKey }
  var store = { sources: [], current: -1, apiKey: "" };
  try {
    var saved = JSON.parse(localStorage.getItem("driveMusicDemo") || "{}");
    if (saved.sources && saved.sources.length) {
      store.sources = saved.sources;
      store.current = Math.min(saved.current | 0, store.sources.length - 1);
    } else if (saved.folderId) {
      store.sources = [{ name: "Nhạc của tôi", folderId: saved.folderId }];
      store.current = 0;
    }
    if (saved.apiKey) store.apiKey = saved.apiKey;
  } catch (e) { /* bỏ qua */ }
  function saveStore() {
    try { localStorage.setItem("driveMusicDemo", JSON.stringify(store)); } catch (e) { /* bỏ qua */ }
  }

  // Nhớ vị trí đang nghe: { [folderId]: { trackId, time, updated } }
  // Mở app lại -> hiện bài cũ + vị trí cũ, bấm vào bài là nghe tiếp (không tự phát).
  var resumeMem = null;
  function loadResumeMem() {
    try { resumeMem = JSON.parse(localStorage.getItem("driveMusicDemoResume") || "{}"); }
    catch (e) { resumeMem = {}; }
  }
  function saveResumeMem() {
    try { localStorage.setItem("driveMusicDemoResume", JSON.stringify(resumeMem)); } catch (e) { /* bỏ qua */ }
  }
  function curFolderId() {
    var s = store.sources[store.current];
    return s ? s.folderId : null;
  }
  function clearResume(folderId) {
    if (!folderId) return;
    if (!resumeMem) loadResumeMem();
    if (resumeMem && resumeMem[folderId]) { delete resumeMem[folderId]; saveResumeMem(); }
  }
  function saveResumePoint() {
    // Dùng danh sách đang phát (có thể khác danh sách hiển thị)
    var fid = playFolderId || curFolderId();
    if (!fid || playCurrent < 0 || playCurrent >= playTracks.length) return;
    var p = getPosition();
    if (p.cur < 10) return; // mới nghe vài giây thì không đáng nhớ
    if (p.total > 0 && p.cur > p.total - 10) return; // gần hết bài thì bỏ
    if (!resumeMem) loadResumeMem();
    resumeMem[fid] = { trackId: playTracks[playCurrent].id, time: Math.floor(p.cur), updated: Date.now() };
    saveResumeMem();
  }

  function openSettings() {
    settingsModal.classList.remove("hidden");
    refreshApiKeyUI();
    // Chưa có key thì mở thẳng tab API Key cho tiện
    switchTab(store.apiKey ? "sources" : "apikey");
  }
  function refreshApiKeyUI() {
    var k = store.apiKey || "";
    $("apiKeyInput").value = k;
    $("apiKeyInput").placeholder = k ? "Đã lưu key (dán đè để đổi)" : "Dán API key vào đây";
    var st = $("apiKeyStatus");
    if (k) {
      st.className = "api-key-status ok";
      st.textContent = "Đã lưu key trên máy này.";
    } else {
      st.className = "api-key-status empty";
      st.textContent = "Chưa có key — dán key vào ô bên dưới rồi bấm Lưu key.";
    }
  }
  // Tab Nguồn nhạc / API Key
  function switchTab(which) {
    var isSrc = which !== "apikey";
    $("tabSources").classList.toggle("active", isSrc);
    $("tabApiKey").classList.toggle("active", !isSrc);
    $("tabPaneSources").style.display = isSrc ? "" : "none";
    $("tabPaneApiKey").style.display = isSrc ? "none" : "";
  }
  $("tabSources").addEventListener("click", function () { switchTab("sources"); });
  $("tabApiKey").addEventListener("click", function () { switchTab("apikey"); });
  // Thu gọn/mở form thêm nguồn cho gọn
  function setupCollapse(toggleId, formId) {
    var tgl = $(toggleId), frm = $(formId);
    tgl.addEventListener("click", function () {
      var open = frm.style.display === "none";
      frm.style.display = open ? "" : "none";
      tgl.classList.toggle("open", open);
    });
    return function setOpen(open) {
      frm.style.display = open ? "" : "none";
      tgl.classList.toggle("open", open);
    };
  }
  var setAddSrcOpen = setupCollapse("toggleAddSrc", "addSrcForm");
  // Lưu / xóa API key
  $("saveKeyBtn").addEventListener("click", function () {
    var k = $("apiKeyInput").value.trim();
    if (!k) { setStatus("Chưa nhập key.", true); return; }
    store.apiKey = k;
    saveStore();
    refreshApiKeyUI();
    setStatus("Đã lưu API key trên máy này.");
  });
  $("delKeyBtn").addEventListener("click", function () {
    store.apiKey = "";
    saveStore();
    refreshApiKeyUI();
    setStatus("Đã xóa API key.");
  });
  // Xuất playlist để dùng cho bản không cần key
  $("exportBtn").addEventListener("click", function () {
    if (!tracks.length) { setStatus("Chưa có bài nào để xuất. Hãy mở một nguồn trước.", true); return; }
    var arr = tracks.map(function (t) {
      return '  { id: "' + t.id + '", name: ' + JSON.stringify(t.name) + " }";
    });
    var code = "var PRESET_SONGS = [\n" + arr.join(",\n") + "\n];";
    // Copy vào clipboard
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () {
        setStatus("Đã copy " + tracks.length + " bài vào clipboard. Dán vào PRESET_SONGS trong file nokey.");
      }, function () {
        prompt("Copy đoạn code dưới đây vào PRESET_SONGS:", code);
      });
    } else {
      prompt("Copy đoạn code dưới đây vào PRESET_SONGS:", code);
    }
  });
  function closeSettings() { settingsModal.classList.add("hidden"); closeSrcMenu(); }
  $("settingsBtn").addEventListener("click", openSettings);
  $("closeSettings").addEventListener("click", closeSettings);
  settingsModal.addEventListener("click", function (e) {
    if (e.target === settingsModal) closeSettings();
  });

  // Tìm kiếm
  var searchbarEl = $("searchbar"), searchInputEl = $("searchInput");
  function setSearch(open) {
    searchOpen = open;
    searchbarEl.classList.toggle("open", open);
    document.body.classList.toggle("search-open", open);
    if (open) {
      searchInputEl.focus();
    } else {
      searchQuery = "";
      searchInputEl.value = "";
      buildList();
    }
  }
  $("searchBtn").addEventListener("click", function () { setSearch(!searchOpen); });
  $("searchClear").addEventListener("click", function () { setSearch(false); });
  searchInputEl.addEventListener("input", function () {
    searchQuery = searchInputEl.value;
    buildList();
  });

  var editingIdx = -1; // đang sửa nguồn nào (-1 = đang thêm mới)

  function renderSrcList() {
    srcListEl.innerHTML = "";
    store.sources.forEach(function (s, i) {
      var li = document.createElement("li");
      if (i === store.current) li.className = "src-active";
      var nm = document.createElement("span");
      if (i === store.current) {
        nm.innerHTML = '<span class="material-icons" style="font-size:16px;vertical-align:-3px;color:var(--accent)">play_arrow</span> ';
      }
      nm.appendChild(document.createTextNode(s.name));
      var btns = document.createElement("span");
      btns.className = "src-btns";
      var more = document.createElement("button");
      more.className = "src-more";
      more.innerHTML = '<span class="material-icons">more_vert</span>';
      more.setAttribute("aria-label", "Tùy chọn nguồn " + s.name);
      more.addEventListener("click", function (e) {
        e.stopPropagation();
        if (menuSourceIdx === i && !srcMenuEl.classList.contains("hidden")) closeSrcMenu();
        else openSrcMenu(i, more);
      });
      btns.appendChild(more);
      li.appendChild(nm);
      li.appendChild(btns);
      li.addEventListener("click", function () { loadSource(i); });
      srcListEl.appendChild(li);
    });
    if (!store.sources.length) srcListEl.innerHTML = '<div class="src-empty">Chưa có nguồn nào.</div>';
  }

  // Menu more_vert cho mỗi nguồn (gọn hơn 3 nút riêng)
  var srcMenuEl = $("srcMenu"), menuSourceIdx = -1;
  function openSrcMenu(i, anchorBtn) {
    menuSourceIdx = i;
    srcMenuEl.classList.remove("hidden");
    var r = anchorBtn.getBoundingClientRect();
    var menuH = 150;
    var top = r.bottom + 4;
    if (top + menuH > window.innerHeight) top = Math.max(8, r.top - menuH - 4);
    srcMenuEl.style.top = top + "px";
    srcMenuEl.style.left = Math.max(8, r.right - 180) + "px";
  }
  function closeSrcMenu() {
    srcMenuEl.classList.add("hidden");
    menuSourceIdx = -1;
  }
  srcMenuEl.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("button[data-act]") : null;
    if (!btn || menuSourceIdx < 0) return;
    var act = btn.getAttribute("data-act"), idx = menuSourceIdx;
    closeSrcMenu();
    if (act === "refresh") loadSource(idx, true);
    else if (act === "edit") startEdit(idx);
    else if (act === "delete") deleteSource(idx);
  });
  document.addEventListener("click", function (e) {
    if (menuSourceIdx < 0) return;
    var t = e.target;
    var insideMenu = t.closest ? t.closest("#srcMenu") : false;
    var onMore = t.closest ? t.closest(".src-more") : false;
    if (!insideMenu && !onMore) closeSrcMenu();
  });

  function startEdit(i) {
    editingIdx = i;
    var s = store.sources[i];
    $("srcName").value = s.name;
    $("newFolderId").value = "https://drive.google.com/drive/folders/" + s.folderId;
    $("addSrcBtn").innerHTML = '<span class="material-icons" style="vertical-align:-4px;font-size:20px">save</span> Lưu thay đổi';
    $("cancelEditBtn").style.display = "";
    switchTab("sources"); // về tab nguồn
    setAddSrcOpen(true); // tự bung form khi sửa
  }

  function cancelEdit() {
    editingIdx = -1;
    $("srcName").value = "";
    $("newFolderId").value = "";
    $("addSrcBtn").innerHTML = '<span class="material-icons" style="vertical-align:-4px;font-size:20px">add</span> Thêm nguồn';
    $("cancelEditBtn").style.display = "none";
  }

  $("addSrcBtn").addEventListener("click", function () {
    var folderId = extractFolderId($("newFolderId").value);
    var name = $("srcName").value.trim() || ("Nguồn " + (store.sources.length + 1));
    if (!folderId) { setStatus("Nhập link/ID folder đã nhé.", true); return; }
    if (editingIdx >= 0 && store.sources[editingIdx]) {
      var old = store.sources[editingIdx];
      if (old.folderId !== folderId) { clearCache(old.folderId); clearResume(old.folderId); } // đổi folder thì xóa cache cũ + vị trí nhớ
      old.name = name;
      old.folderId = folderId;
      var idx = editingIdx;
      cancelEdit();
      saveStore();
      renderSrcList();
      loadSource(idx, true); // quét lại folder mới
    } else {
      store.sources.push({ name: name, folderId: folderId });
      cancelEdit();
      saveStore();
      renderSrcList();
      loadSource(store.sources.length - 1);
    }
  });
  $("cancelEditBtn").addEventListener("click", cancelEdit);

  function deleteSource(i) {
    var removed = store.sources[i];
    if (removed) { clearCache(removed.folderId); clearResume(removed.folderId); }
    if (editingIdx === i) cancelEdit();
    store.sources.splice(i, 1);
    if (store.current >= store.sources.length) store.current = store.sources.length - 1;
    saveStore();
    renderSrcList();
    if (store.current >= 0) {
      loadSource(store.current);
    } else {
      tracks = []; current = -1;
      try { player.pause(); } catch (e) {}
      stopWebAudio();
      listEl.innerHTML = "";
      nowEl.textContent = "Chưa chọn bài nào";
      setStatus("Đã xóa hết nguồn. Vào Cài đặt để thêm folder nhạc.");
    }
  }

  renderSrcList();
  setupMediaSession();
  window.addEventListener("pagehide", function () { saveResumePoint(); }); // thoát tab cũng nhớ vị trí
  // Mở IndexedDB trước rồi mới tải nguồn (để đọc cache lớn được)
  openIDB().then(function () {
    if (store.sources.length && store.current >= 0) {
      loadSource(store.current);
    } else {
      openSettings();
    }
  });

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = isErr ? "err" : "";
  }

  function fmtSize(b) {
    b = +b || 0;
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }

  function extractFolderId(v) {
    v = (v || "").trim();
    var m = v.match(/folders\/([-\w]+)/);
    return m ? m[1] : v;
  }

  function streamUrl(id) {
    // Lấy bytes nhạc qua alt=media trên www.googleapis.com (cùng host với Drive API):
    // host drive.google.com / drive.usercontent.google.com có mạng chặn, fetch không tới được.
    return "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(id) +
      "?alt=media&key=" + encodeURIComponent(store.apiKey || "");
  }

  var MAX_DEPTH = 4; // quét sâu tối đa 4 cấp thư mục

  // Drive đôi khi gán mimeType lạ (vd FLAC thành application/x-flac) nên nhận theo đuôi file nữa
  var AUDIO_EXT_RE = /\.(mp3|wav|flac|m4a|m4b|aac|ogg|oga|opus|wma|aiff|aif|ape|mpc)$/i;
  function isAudioFile(f) {
    if (/^audio\//.test(f.mimeType || "")) return true;
    return AUDIO_EXT_RE.test(f.name || "");
  }

  function listFolder(folderId, key) {
    // Liệt kê hết 1 folder (phân trang), tách riêng file và folder con
    var files = [], folders = [], pageToken = "";
    function fetchPage() {
      var url = "https://www.googleapis.com/drive/v3/files" +
        "?q=" + encodeURIComponent("'" + folderId + "' in parents and trashed=false") +
        "&fields=" + encodeURIComponent("nextPageToken,files(id,name,mimeType,size)") +
        "&pageSize=100" +
        (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : "") +
        "&key=" + encodeURIComponent(key);
      return fetch(url).then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error((data && data.error && data.error.message) || ("HTTP " + r.status));
          (data.files || []).forEach(function (f) {
            if (f.mimeType === "application/vnd.google-apps.folder") folders.push(f);
            else files.push(f);
          });
          if (data.nextPageToken) { pageToken = data.nextPageToken; return fetchPage(); }
        });
      });
    }
    return fetchPage().then(function () { return { files: files, folders: folders }; });
  }

  function scanRecursive(folderId, folderName, depth, key, stats, onProgress) {
    return listFolder(folderId, key).then(function (res) {
      res.files.forEach(function (f) {
        if (isAudioFile(f)) {
          f._folder = folderName; // tên thư mục chứa file = tên album
          stats.tracks.push(f);
        }
      });
      stats.folders++;
      onProgress(stats);
      if (depth >= MAX_DEPTH || !res.folders.length) return null;
      // Quét từng đợt 6 folder để không dồn quá nhiều request cùng lúc (dễ bị giới hạn)
      var queue = res.folders.slice();
      function nextBatch() {
        if (!queue.length) return null;
        var batch = queue.splice(0, 6);
        return Promise.all(batch.map(function (sub) {
          return scanRecursive(sub.id, sub.name, depth + 1, key, stats, onProgress).catch(function () {
            stats.errors = (stats.errors || 0) + 1; // 1 folder lỗi không làm sập cả lần quét
          });
        })).then(nextBatch);
      }
      return nextBatch();
    });
  }

  function naturalCmp(a, b) {
    return (a || "").localeCompare(b || "", undefined, { numeric: true, sensitivity: "base" });
  }

  // Cache danh sách bài theo folderId để mở app không phải quét lại
  // Cache dùng IndexedDB (chứa được hàng chục MB cho folder lớn),
  // fallback localStorage cho folder nhỏ hoặc khi IDB không dùng được.
  var idb = null;
  function openIDB() {
    return new Promise(function (resolve) {
      try {
        var req = indexedDB.open("driveMusicDB", 1);
        req.onupgradeneeded = function (e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains("trackCache")) {
            db.createObjectStore("trackCache", { keyPath: "folderId" });
          }
        };
        req.onsuccess = function (e) { idb = e.target.result; resolve(true); };
        req.onerror = function () { resolve(false); };
        req.onblocked = function () { resolve(false); };
      } catch (e) { resolve(false); }
    });
  }
  function cacheKey(folderId) { return "driveMusicCache_" + folderId; }
  function unpackTracks(arr) {
    return (arr || []).map(function (a) {
      return { id: a[0], name: a[1], size: a[2], _folder: a[3] || "" };
    });
  }
  function getCache(folderId) {
    // Trả về Promise; thử IDB trước, rồi localStorage (cache cũ)
    return new Promise(function (resolve) {
      function fromLS() {
        try {
          var raw = localStorage.getItem(cacheKey(folderId));
          if (!raw) return resolve(null);
          var c = JSON.parse(raw);
          resolve({ at: c.at, tracks: unpackTracks(c.tracks) });
        } catch (e) { resolve(null); }
      }
      if (!idb) return fromLS();
      try {
        var req = idb.transaction("trackCache", "readonly").objectStore("trackCache").get(folderId);
        req.onsuccess = function () {
          var c = req.result;
          if (c && c.tracks) resolve({ at: c.at, tracks: unpackTracks(c.tracks) });
          else fromLS();
        };
        req.onerror = fromLS;
      } catch (e) { fromLS(); }
    });
  }
  function setCache(folderId, list) {
    // Trả về Promise<boolean>
    var compact = list.map(function (t) {
      return [t.id, t.name, t.size, t._folder || ""];
    });
    var data = { folderId: folderId, at: Date.now(), tracks: compact };
    return new Promise(function (resolve) {
      function toLS() {
        try {
          localStorage.setItem(cacheKey(folderId), JSON.stringify({ at: data.at, tracks: compact }));
          resolve(true);
        } catch (e) { resolve(false); }
      }
      if (!idb) return toLS();
      try {
        var req = idb.transaction("trackCache", "readwrite").objectStore("trackCache").put(data);
        req.onsuccess = function () { resolve(true); };
        req.onerror = toLS;
      } catch (e) { toLS(); }
    });
  }
  function clearCache(folderId) {
    if (idb) {
      try { idb.transaction("trackCache", "readwrite").objectStore("trackCache").delete(folderId); } catch (e) {}
    }
    try { localStorage.removeItem(cacheKey(folderId)); } catch (e) {}
  }

  function sortTracks() {
    // Sắp xếp: theo album trước, rồi tên bài (tự nhiên: 1, 2, 10)
    tracks.sort(function (a, b) {
      var c = naturalCmp(a._folder, b._folder);
      return c || naturalCmp(a.name, b.name);
    });
  }

  var expanded = {}; // tên album -> true nếu đang mở (accordion)

  function highlightCurrent() {
    var items = listEl.querySelectorAll("li[data-i]");
    for (var k = 0; k < items.length; k++) {
      items[k].classList.toggle("playing", +items[k].getAttribute("data-i") === current);
    }
  }

  function buildList() {
    listEl.innerHTML = "";
    var q = searchQuery.trim().toLowerCase();
    if (q) {
      // Chế độ tìm kiếm: liệt kê phẳng các bài khớp tên bài hoặc tên album
      var matches = [];
      tracks.forEach(function (t, i) {
        var nm = (t.name || "").toLowerCase();
        var fol = (t._folder || "").toLowerCase();
        if (nm.indexOf(q) >= 0 || fol.indexOf(q) >= 0) matches.push(i);
      });
      if (!matches.length) {
        listEl.innerHTML = '<div id="empty">Không tìm thấy bài nào khớp.</div>';
        return;
      }
      matches.forEach(function (i) {
        var t = tracks[i];
        var li = document.createElement("li");
        li.setAttribute("data-i", i);
        if (i === current) li.classList.add("playing");
        var main = document.createElement("div");
        main.className = "track-main";
        var name = document.createElement("div");
        name.className = "name";
        name.textContent = t.name;
        main.appendChild(name);
        if (t._folder) {
          var fol = document.createElement("div");
          fol.className = "folder";
          fol.textContent = t._folder;
          main.appendChild(fol);
        }
        var size = document.createElement("span");
        size.className = "size";
        size.textContent = fmtSize(t.size);
        li.appendChild(main);
        li.appendChild(size);
        li.addEventListener("click", function () { playAt(i); });
        listEl.appendChild(li);
      });
      return;
    }
    // Gom bài theo album (tracks đã sắp xếp theo album)
    var groups = {}, order = [];
    tracks.forEach(function (t, i) {
      var f = t._folder || "";
      if (!groups[f]) { groups[f] = []; order.push(f); }
      groups[f].push(i);
    });
    var showHeaders = order.length > 1;
    order.forEach(function (f) {
      var idxs = groups[f];
      if (showHeaders) {
        var h = document.createElement("li");
        h.className = "album-head" + (expanded[f] ? " open" : "");
        var arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.innerHTML = '<span class="material-icons" style="font-size:20px">' + (expanded[f] ? "expand_more" : "chevron_right") + "</span>";
        var nm = document.createElement("span");
        nm.className = "album-name";
        nm.textContent = (f || "Bài hát lẻ") + " (" + idxs.length + ")";
        h.appendChild(arrow);
        h.appendChild(nm);
        h.addEventListener("click", (function (ff) {
          return function () {
            expanded[ff] = !expanded[ff];
            buildList();
          };
        })(f));
        listEl.appendChild(h);
      }
      if (!showHeaders || expanded[f]) {
        idxs.forEach(function (i) {
          var t = tracks[i];
          var li = document.createElement("li");
          li.setAttribute("data-i", i);
          if (i === current) li.classList.add("playing");
          var main = document.createElement("div");
          main.className = "track-main";
          var name = document.createElement("div");
          name.className = "name";
          name.textContent = t.name;
          main.appendChild(name);
          var size = document.createElement("span");
          size.className = "size";
          size.textContent = fmtSize(t.size);
          li.appendChild(main);
          li.appendChild(size);
          li.addEventListener("click", function () { playAt(i); });
          listEl.appendChild(li);
        });
      }
    });
  }

  function applyResume(folderId) {
    // Mở app lại: nếu có vị trí nhớ của nguồn này thì hiện bài cũ + đánh dấu, chờ Hải bấm phát
    if (!resumeMem) loadResumeMem();
    var r = resumeMem && resumeMem[folderId];
    if (!r || !r.trackId || !(r.time > 10)) return;
    var idx = -1;
    for (var k = 0; k < tracks.length; k++) { if (tracks[k].id === r.trackId) { idx = k; break; } }
    if (idx < 0) return;
    pendingResume = { trackId: r.trackId, idx: idx, time: r.time };
    var af = tracks[idx]._folder || "";
    for (var e in expanded) { if (expanded.hasOwnProperty(e)) expanded[e] = false; }
    expanded[af] = true;
    buildList();
    var el = listEl.querySelector('li[data-i="' + idx + '"]');
    if (el) {
      el.classList.add("resume-hint");
      if (el.scrollIntoView) el.scrollIntoView({ block: "center" });
    }
    setStatus("Đã nhớ: \"" + tracks[idx].name + "\" từ " + fmtDur(r.time) + " — bấm vào bài để nghe tiếp.");
  }

  // Khôi phục vị trí bài đang phát khi quay lại nguồn cũ
  var pendingGoto = false; // bấm nút tìm bài khi đang xem nguồn khác -> load xong tự cuộn tới
  function restorePlayingPosition(folderId) {
    if (folderId !== playFolderId || playCurrent < 0 || playCurrent >= playTracks.length) return;
    var playingId = playTracks[playCurrent].id;
    for (var i = 0; i < tracks.length; i++) {
      if (tracks[i].id === playingId) {
        current = i;
        playTracks = tracks;
        playCurrent = i;
        highlightCurrent();
        if (pendingGoto) {
          pendingGoto = false;
          var el = listEl.querySelector('li[data-i="' + i + '"]');
          if (el && el.scrollIntoView) el.scrollIntoView({ block: "center" });
        }
        break;
      }
    }
  }

  function loadSource(i, forceRefresh) {
    if (i < 0 || i >= store.sources.length) return;
    // Lưu folder nguồn cũ TRƯỚC khi đổi store.current (để biết nguồn đang phát)
    var oldFolderId = curFolderId();
    store.current = i;
    saveStore();
    renderSrcList();
    closeSettings();
    var src = store.sources[i];
    if (!store.apiKey) {
      setStatus("Chưa có API key. Vào Cài đặt để nhập key.", true);
      openSettings();
      return;
    }
    var key = store.apiKey;
    // Nếu đang phát nhạc: giữ nguyên audio, lưu danh sách đang phát riêng
    // để chuyển nguồn không làm dừng nhạc.
    var isPlaying = false;
    try {
      isPlaying = (webAudioTrack && webAudioTrack.seq === playSeq && currentSource) ||
                  (player && !player.paused && !player.ended && player.src);
    } catch (e) { /* bỏ qua */ }
    if (isPlaying && tracks.length && current >= 0) {
      playTracks = tracks;
      playCurrent = current;
      playFolderId = oldFolderId; // nguồn ĐANG PHÁT (cũ), không phải nguồn mới chuyển tới
    }
    listEl.innerHTML = "";
    tracks = []; current = -1;
    expanded = {}; // đổi nguồn thì thu gọn hết lại
    if (searchOpen) setSearch(false); // đổi nguồn thì tắt tìm kiếm
    // KHÔNG dừng nhạc ở đây nữa — để bài đang phát tiếp tục.

    // Có cache thì hiện ngay, không quét lại
    if (!forceRefresh) {
      setStatus("Đang tải danh sách đã lưu...");
      getCache(src.folderId).then(function (cached) {
        if (cached && cached.tracks && cached.tracks.length) {
          tracks = cached.tracks;
          // migrate cache cũ: _folder từng lưu đường dẫn dài, giờ chỉ giữ tên thư mục cuối
          tracks.forEach(function (t) {
            if (t._folder && t._folder.indexOf(" / ") >= 0) {
              t._folder = t._folder.split(" / ").pop();
            }
          });
          sortTracks();
          buildList();
          restorePlayingPosition(src.folderId);
          var ageMin = Math.round((Date.now() - cached.at) / 60000);
          var ageTxt = ageMin < 1 ? "vừa xong" : ageMin < 60 ? ageMin + " phút trước" : Math.round(ageMin / 60) + " giờ trước";
          setStatus("Tìm thấy " + tracks.length + " bài (đã lưu " + ageTxt + "). Vào Cài đặt bấm menu cạnh nguồn để quét lại.");
          applyResume(src.folderId);
        } else {
          doScan();
        }
      });
      return;
    }
    doScan();
  }

  function doScan() {
    var src = store.sources[store.current];
    if (!src) return;
    if (!store.apiKey) {
      setStatus("Chưa có API key. Vào Cài đặt để nhập key.", true);
      return;
    }
    var key = store.apiKey;
    var addBtn = $("addSrcBtn");
    addBtn.disabled = true;
    var stats = { tracks: [], folders: 0 };
    scanRecursive(src.folderId, "", 0, key, stats, function (s) {
      setStatus("Đang quét \"" + src.name + "\": " + s.folders + " thư mục, thấy " + s.tracks.length + " bài...");
    }).then(function () {
      tracks = stats.tracks;
      sortTracks();
      if (!tracks.length) { setStatus("Không thấy file nhạc nào trong \"" + src.name + "\" (" + stats.folders + " thư mục đã quét).", true); return; }
      buildList();
      restorePlayingPosition(src.folderId);
      var errNote = stats.errors ? " (" + stats.errors + " thư mục lỗi, bỏ qua)" : "";
      setStatus("Tìm thấy " + tracks.length + " bài trong " + stats.folders + " thư mục" + errNote + ". Đang lưu...");
      setCache(src.folderId, tracks).then(function (cacheOk) {
        var cacheNote = cacheOk ? "" : " (danh sách quá lớn, không lưu cache được)";
        setStatus("Tìm thấy " + tracks.length + " bài trong " + stats.folders + " thư mục" + errNote + cacheNote + ". Bấm vào bài để nghe.");
      });
    }).catch(function (err) {
      setStatus("Lỗi: " + err.message, true);
    }).then(function () { addBtn.disabled = false; });
  }

  var lastBlobUrl = null;

  function isWav(t) {
    return /\.wav$/i.test(t.name || "") || (t.mimeType || "").indexOf("audio/wav") === 0;
  }

  var audioCtx = null, currentSource = null, webAudioTrack = null;

  function getAudioCtx() {
    if (!audioCtx) {

  // Trình phát riêng: play/pause, qua bài, shuffle, repeat, tua

  }

    if (playTracks === tracks) current = i;
    var t = playTracks[i];

    } else {

    }

    else if (shuffleOn) playPlaybackAt(randomPlayIdx());

    else if (repeatMode === 1) playPlaybackAt(0);

  function nextTrack() {

    else if (playCurrent + 1 < playTracks.length) playPlaybackAt(playCurrent + 1);

    if (webAudioTrack && webAudioTrack.seq === playSeq) {
      var w = webAudioTrack;
      var cur = w.offset + (currentSource ? (w.ctx.currentTime - w.startCtxTime) : 0);
      return { cur: cur, total: w.audioBuf.duration || 0 };
    }
    return { cur: player.currentTime || 0, total: player.duration || 0 };
  }

  function updateProgress() {
    if (seeking) return;
    var p = getPosition();
    timeCurEl.textContent = fmtDur(p.cur);
    timeTotalEl.textContent = fmtDur(p.total);
    seekBarEl.value = p.total > 0 ? Math.round(p.cur / p.total * 1000) : 0;
    var nowT = Date.now();
    if (nowT - lastResumeSaveAt > 10000) { lastResumeSaveAt = nowT; saveResumePoint(); } // nhớ vị trí mỗi 10s
    updatePlayBtn();
  }

  seekBarEl.addEventListener("input", function () { seeking = true; });
  seekBarEl.addEventListener("change", function () {
    seeking = false;
    var p = getPosition();
    if (p.total <= 0) return;
    var newTime = seekBarEl.value / 1000 * p.total;
    if (webAudioTrack && webAudioTrack.seq === playSeq) {
      // WebAudio: dừng và phát lại từ vị trí mới
      var w = webAudioTrack;
      w.offset = newTime;
      if (currentSource) {
        var s = currentSource;
        currentSource = null;
        try { s.stop(); } catch (e) {}
        // Phát lại từ offset mới
        var src = w.ctx.createBufferSource();
        src.buffer = w.audioBuf;
        src.connect(w.ctx.destination);
        src.onended = s.onended;
        currentSource = src;
        w.startCtxTime = w.ctx.currentTime;
        try { src.start(0, newTime % w.audioBuf.duration); } catch (e) { try { src.start(0, 0); } catch (e2) {} }
      }
    } else {
      player.currentTime = newTime;
    }
    updateProgress();
  });

  // Cập nhật tiến trình khi đang phát
  setInterval(updateProgress, 500);

  player.addEventListener("ended", function () {
    handleTrackEnded();
  });

  player.addEventListener("loadedmetadata", function () {
    setStatus("Nhận metadata OK, độ dài: " + (isFinite(player.duration) ? player.duration.toFixed(2) + "s" : String(player.duration)));
  });
  player.addEventListener("playing", function () {
    setStatus("Đang phát: " + (tracks[current] ? tracks[current].name : ""));
  });
})();
</script>
</body>
</html>
