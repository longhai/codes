<!DOCTYPE html>

<html>
<head>
<title>EmulatorJS | Demo</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000">
<link rel="stylesheet" href="https://demo.emulatorjs.org/main.css">
</head>

<body>

<div id="box">
<input type="file" id="input">
Drag ROM file or click here
</div>

<div id="version">
<select id="version-select"></select>

<button id="download" class="hide" onclick="downloadversion()">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
<path d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2m2.354 6.854-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L7.5 9.293V5.5a.5.5 0 0 1 1 0v3.793l1.146-1.147a.5.5 0 0 1 .708.708"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
<path d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2m2.354 4.854-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7 8.793l2.646-2.647a.5.5 0 0 1 .708.708"/>
</svg>
</button>

<button id="settings">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
<path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
</svg>
</button>
</div>

<div id="popup-settings" class="popup popup-animate">
<div class="content">

<div class="title"><h1>Settings</h1></div>

<div class="options">

<div class="buttonbox">
<p>
Enable Debuging:
<label class="switch">
<input type="checkbox" id="debug">
<span class="slider round"></span>
</label>
</p>
</div>

<br>

<div class="buttonbox">
<p>Clean Cache:</p>
<button id="cache">Clean</button>
</div>

<br>

<div class="buttonbox">
<p>Language:</p>
<select id="language"></select>
<p id="languageHelp"></p>
</div>

<br>

<div class="buttonbox last">
<p>Custom Path:</p>
<input type="text" id="customPath" placeholder="https://cdn.emulatorjs.org/stable/data/">
<p id="customPathValid"></p>
</div>

<p id="offline-status">Offline Status: CHECKING</p>
<p>Offline Cores will be available soon.</p>

<p class="hide">
Remove All Saved Versions:
<button onclick="removeallsaved()">Remove All</button>
</p>

<div id="installbox" class="buttonbox">
<p id="installboxtext">Install PWA:</p>
<button id="install" disabled>Install</button>
</div>

<p id="pwa-status" style="font-size:12px;text-align:right"></p>

<br>

</div>

<div class="bottom">
<button id="settings-close">Close</button>
</div>

</div>
</div>

<div class="popup-overlay"></div>

<script src="https://demo.emulatorjs.org/main.js"></script>

<script>

/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator)
navigator.serviceWorker.getRegistrations()
.then(rs=>rs.forEach(r=>r.unregister()));


/* =========================
   OFFLINE
========================= */

loadJSON("/versions",response=>{

const s=document.getElementById("offline-status");

if(response){
loadVersions(response);
s.textContent="Offline Status: READY";
}else{
loadJSON(
"https://cdn.emulatorjs.org/versions.json",
resp=>loadVersions(resp)
);
s.textContent="Offline Status: NOT INSTALLED";
}

});

loadSettings();


/* =========================
   ROM
========================= */

input.addEventListener("change",async()=>{

const file=input.files[0];
const parts=file.name.split(".");
const ext=(parts.pop()||"").toLowerCase();

/* =========================================================
   EXTENSION → CORE
========================================================= */

const map={
nes:"fds nes unif unf",
snes:"smc fig sfc gd3 gd7 dx2 bsx swc",
n64:"z64 n64",
pce:"pce",
ngp:"ngp ngc",
ws:"ws wsc",
coleco:"col cv",
vice_x64:"d64",
psx:"chd",
nds:"nds",
gba:"gba",
gb:"gb"
};

let core=Object.entries(map)
.find(([c,e])=>e.split(" ").includes(ext))?.[0];

  /* =========================================================
   CHỌN CORE
========================================================= */
  
if(!core){

const cores={
"Arcade":"arcade",
"Mame 2003":"mame2003_plus",
"Nintendo 64":"n64",
"Nintendo Game Boy":"gb",
"Nintendo Game Boy Advance":"gba",
"Nintendo DS":"nds",
"Nintendo Entertainment System":"nes",
"Super Nintendo Entertainment System":"snes",
"PlayStation":"psx",
"Virtual Boy":"vb",
"Sega Mega Drive":"segaMD",
"Sega Master System":"segaMS",
"Sega CD":"segaCD",
"Atari Lynx":"lynx",
"Sega 32X":"sega32x",
"Atari Jaguar":"jaguar",
"Sega Game Gear":"segaGG",
"Sega Saturn":"segaSaturn",
"Atari 7800":"atari7800",
"Atari 2600":"atari2600",
"NEC TurboGrafx-16/SuperGrafx/PC Engine":"pce",
"NEC PC-FX":"pcfx",
"SNK NeoGeo Pocket (Color)":"ngp",
"Bandai WonderSwan (Color)":"ws",
"ColecoVision":"coleco",
"Commodore 64":"vice_x64",
"Commodore 128":"vice_x128",
"Commodore VIC20":"vice_xvic",
"Commodore Plus/4":"vice_xplus4",
"Commodore PET":"vice_xpet",
"PlayStation Portable":"psp",
"3DS":"azahar",
"DOS":"dosbox_pure"
};

const select=document.createElement("select");
const button=document.createElement("button");

for(const name in cores)
select.add(new Option(name,cores[name]));

button.textContent="Load game";
button.onclick=()=>resolve(select.value);

box.innerHTML="";
box.append(select,button);

core=await new Promise(resolve=>{
button.onclick=()=>resolve(select.value);
});

}


/* EmulatorJS */

const div=document.createElement("div");
const game=document.createElement("div");
const script=document.createElement("script");

game.id="game";
div.id="display";

document.getElementById("top")?.remove();
document.getElementById("version")?.remove();
document.getElementById("box")?.remove();

div.appendChild(game);
document.body.appendChild(div);


/* CONFIG */

const cdn=window.cdn||"https://cdn.emulatorjs.org/stable/data/";

window.EJS_player="#game";
window.EJS_gameName=parts.join(".");
window.EJS_biosUrl=core==="psx"?"https://longhai.github.io/bios/psx.7z":["arcade","mame2003_plus"].includes(core)?"https://longhai.github.io/bios/arcade.7z":"";
window.EJS_gameUrl=file;
window.EJS_core=core;
window.EJS_pathtodata=cdn;
window.EJS_startOnLoaded=true;
window.EJS_DEBUG_XX=window.debug;

if(window.language!=="auto")
window.EJS_language=window.language;

if(["psp","dosbox_pure","azahar"].includes(core))
window.EJS_threads=true;

script.src=cdn+"loader.js";
document.body.appendChild(script);

});

box.ondragover=()=>box.setAttribute("drag",true);
box.ondragleave=()=>box.removeAttribute("drag");


/* =========================
   SETTINGS
========================= */

const settings=document.getElementById("settings");
const popup=document.getElementById("popup-settings");
const close=document.getElementById("settings-close");

settings.onclick=()=>popup.classList.add("show");
close.onclick=()=>popup.classList.remove("show");


/* DEBUG */

const params=new URLSearchParams(location.search);
const debug=document.getElementById("debug");

debug.checked=params.get("debug")==="1";

debug.onchange=e=>{
const u=new URL(location.href);
e.target.checked
?u.searchParams.set("debug","1")
:u.searchParams.delete("debug");
location.href=u.href;
};


/* CDN */

const customPath=document.getElementById("customPath");
const savedCdn=localStorage.getItem("custom_cdn");

if(savedCdn)
customPath.value=savedCdn;

customPath.onchange=()=>{

const value=customPath.value.trim();
const valid=/^https?:\/\/.+\/$/.test(value);
const status=document.getElementById("customPathValid");

if(valid){

localStorage.setItem("custom_cdn",value);
status.textContent="URL hợp lệ";
status.style.color="#4caf50";

}else{

localStorage.removeItem("custom_cdn");
status.textContent=value?"URL không hợp lệ":"";
status.style.color="#f44336";

}

};



/* =========================
   PWA
========================= */

let installPrompt = null;
const install = document.getElementById("install");
const pwaStatus = document.getElementById("pwa-status");

const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

const updatePWA = () => {
  const installed = isStandalone() || localStorage.getItem("pwa_installed") === "true";
  install.disabled = installed || !installPrompt;
  install.textContent = installed ? "Installed" : "Install";
  pwaStatus.textContent = installed ? "PWA đã được cài." : installPrompt ? "Sẵn sàng cài đặt." : "PWA chưa sẵn sàng.";
};

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  localStorage.removeItem("pwa_installed");
  updatePWA();
});

window.addEventListener("appinstalled", () => {
  localStorage.setItem("pwa_installed", "true");
  installPrompt = null;
  updatePWA();
});

install.onclick = async () => {
  if (!installPrompt) return (pwaStatus.textContent = "PWA yêu cầu HTTPS hoặc localhost.");
  try {
    await installPrompt.prompt();
    if ((await installPrompt.userChoice)?.outcome === "accepted") pwaStatus.textContent = "Đang cài đặt...";
  } catch (e) {
    pwaStatus.textContent = "Lỗi PWA: " + e.message;
  }
  installPrompt = null;
  updatePWA();
};

/* ========================= MANIFEST ========================= */
(() => {
  const icon = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><path fill="#1AAFFF" d="M174.336 768l-119.168 119.168a42.667 42.667 0 0 0 60.331 60.331L234.667 828.33l119.168 119.168a42.667 42.667 0 0 0 60.331-60.331L295 768l119.168-119.168a42.667 42.667 0 0 0-60.331-60.331L234.667 707.669l-119.168-119.168a42.667 42.667 0 0 0-60.331 60.331L174.336 768zM768 469.333c-117.824 0-213.333-95.509-213.333-213.333S650.176 42.667 768 42.667s213.333 95.509 213.333 213.333-95.509 213.333-213.333 213.333zm0-85.333a128 128 0 1 0 0-256 128 128 0 0 0 0 256zM554.667 661.547c0-59.093 47.68-106.88 106.88-106.88h212.907c59.093 0 106.88 47.68 106.88 106.88v212.907c0 59.093-47.68 106.88-106.88 106.88h-212.907A106.731 106.731 0 0 1 554.667 874.453v-212.906zm85.333 0v212.906c0 12.032 9.536 21.547 21.547 21.547h212.907c12.032 0 21.547-9.536 21.547-21.547v-212.906c0-12.032-9.536-21.547-21.547-21.547h-212.907c-12.032 0-21.547 9.536-21.547 21.547zM183.829 109.888c36.118-61.163 108.246-61.248 144.427 0l126.208 213.653c35.733 60.523 3.52 124.437-66.816 124.437H124.437c-70.613 0-102.635-63.765-66.816-124.437L183.829 109.91zM133.653 362.667h244.8l-122.41-207.232-122.39 207.232z"/></svg>`);

  const manifest = {
    name: "EmulatorJS",
    short_name: "EmulatorJS",
    start_url: location.href,
    display: "standalone",
    background_color: "#0d0e12",
    theme_color: "#1AAFFF",
    icons: [{ src: icon, sizes: "192x192 512x512", type: "image/svg+xml" }]
  };

  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/json" }));
  document.head.appendChild(link);
})();

updatePWA();
</script>

</body>
</html>
