<!DOCTYPE html>
<html>
<head>
    <title>EmulatorJS | Demo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
    <link rel="apple-touch-icon" href="img/icon.png">
    <meta name="theme-color" content="#000">
    <link rel="stylesheet" href="https://demo.emulatorjs.org/main.css">
</head>

<body>

<div id="box">
    <input type="file" id="input">
    Drag ROM file or click here
</div>

<div id="version">
    <select id="version-select"></select>

    <button id="download" class="hide" onclick="downloadversion()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2m2.354 6.854-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L7.5 9.293V5.5a.5.5 0 0 1 1 0v3.793l1.146-1.147a.5.5 0 0 1 .708.708"/>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2m2.354 4.854-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7 8.793l2.646-2.647a.5.5 0 0 1 .708.708"/>
        </svg>
    </button>

    <button id="settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
        </svg>
    </button>
</div>

<!-- SETTINGS -->

<div id="popup-settings" class="popup popup-animate">
    <div class="content">

        <div class="title">
            <h1>Settings</h1>
        </div>

        <div class="options">

            <div class="buttonbox">
                <p>
                    Enable Debuging:
                    <label class="switch">
                        <input type="checkbox" id="debug">
                        <span class="slider round"></span>
                    </label>
                </p>
            </div>

            <br>

            <div class="buttonbox">
                <p>Clean Cache:</p>
                <button id="cache">Clean</button>
            </div>

            <br>

            <div class="buttonbox">
                <p>Language:</p>
                <select id="language"></select>
                <p id="languageHelp"></p>
            </div>

            <br>

            <div class="buttonbox last">
                <p>Custom Path:</p>
                <input
                    type="text"
                    id="customPath"
                    placeholder="https://cdn.emulatorjs.org/stable/data/"
                >
                <p id="customPathValid"></p>
            </div>

            <p id="offline-status">
                Offline Status: CHECKING
            </p>

            <p>
                Offline Cores will be available soon.
            </p>

            <p class="hide">
                Remove All Saved Versions:
                <button id="remove-version" onclick="removeallsaved()">
                    Remove All
                </button>
            </p>

            <div id="installbox" class="buttonbox">
                <p id="installboxtext">Install PWA:</p>
                <button id="install">Install</button>
            </div>

            <p id="pwa-status-msg"
               style="font-size:12px;color:#f44336">
            </p>

            <br>

        </div>

        <div class="bottom">
            <button id="settings-close">Close</button>
        </div>

    </div>
</div>

<div class="popup-overlay"></div>

<script src="https://demo.emulatorjs.org/main.js"></script>

<script>

/* =========================
   DEMO ORIGINAL
========================= */

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
        .then(rs => rs.forEach(r => r.unregister()))
        .catch(() => {});
}

loadJSON("/versions", response => {

    const offlineStatus =
        document.getElementById("offline-status");

    if (!response) {

        loadJSON(
            "https://cdn.emulatorjs.org/versions.json",
            resp => loadVersions(resp)
        );

        offlineStatus.textContent =
            "Offline Status: NOT INSTALLED";

    } else {

        loadVersions(response);

        offlineStatus.textContent =
            "Offline Status: READY";
    }
});

loadSettings();


/* =========================
   ROM LOADING
========================= */

input.addEventListener("change", async () => {

    const url = input.files[0];
    const parts = input.files[0].name.split(".");
    const ext = (parts.pop() || "").toLowerCase();

    const core = await (async ext => {

        if (["fds","nes","unif","unf"].includes(ext))
            return "nes";

        if (["smc","fig","sfc","gd3","gd7","dx2","bsx","swc"].includes(ext))
            return "snes";

        if (["z64","n64"].includes(ext))
            return "n64";

        if (ext === "pce")
            return "pce";

        if (["ngp","ngc"].includes(ext))
            return "ngp";

        if (["ws","wsc"].includes(ext))
            return "ws";

        if (["col","cv"].includes(ext))
            return "coleco";

        if (ext === "d64")
            return "vice_x64";

        if (["nds","gba","gb"].includes(ext))
            return ext;

        return await new Promise(resolve => {

            const cores = {
                "Nintendo 64":"n64",
                "Nintendo Game Boy":"gb",
                "Nintendo Game Boy Advance":"gba",
                "Nintendo DS":"nds",
                "Nintendo Entertainment System":"nes",
                "Super Nintendo Entertainment System":"snes",
                "PlayStation":"psx",
                "Virtual Boy":"vb",
                "Sega Mega Drive":"segaMD",
                "Sega Master System":"segaMS",
                "Sega CD":"segaCD",
                "Atari Lynx":"lynx",
                "Sega 32X":"sega32x",
                "Atari Jaguar":"jaguar",
                "Sega Game Gear":"segaGG",
                "Sega Saturn":"segaSaturn",
                "Atari 7800":"atari7800",
                "Atari 2600":"atari2600",
                "NEC TurboGrafx-16/SuperGrafx/PC Engine":"pce",
                "NEC PC-FX":"pcfx",
                "SNK NeoGeo Pocket (Color)":"ngp",
                "Bandai WonderSwan (Color)":"ws",
                "ColecoVision":"coleco",
                "Commodore 64":"vice_x64",
                "Commodore 128":"vice_x128",
                "Commodore VIC20":"vice_xvic",
                "Commodore Plus/4":"vice_xplus4",
                "Commodore PET":"vice_xpet",
                "PlayStation Portable":"psp",
                "3DS":"azahar",
                "DOS":"dosbox_pure"
            };

            const button =
                document.createElement("button");

            const select =
                document.createElement("select");

            for (const type in cores) {

                const option =
                    document.createElement("option");

                option.value =
                    cores[type];

                option.textContent =
                    type;

                select.appendChild(option);
            }

            button.onclick = () =>
                resolve(select.value);

            button.textContent =
                "Load game";

            box.innerHTML = "";

            box.appendChild(select);
            box.appendChild(button);

        });

    })(ext);


    const div =
        document.createElement("div");

    const sub =
        document.createElement("div");

    const script =
        document.createElement("script");

    sub.id = "game";
    div.id = "display";


    /*
     * #top không có trong HTML này,
     * nên dùng ?. để không làm dừng EmulatorJS.
     */

    document.getElementById("top")?.remove();
    document.getElementById("version")?.remove();
    document.getElementById("box")?.remove();


    div.appendChild(sub);
    document.body.appendChild(div);


    /* =========================
       EMULATORJS ORIGINAL CONFIG
    ========================= */

    const cdn =
        window.cdn ||
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_player =
        "#game";

    window.EJS_gameName =
        parts.shift();

    window.EJS_biosUrl =
        "";

    window.EJS_gameUrl =
        url;

    window.EJS_core =
        core;

    window.EJS_pathtodata =
        cdn;

    window.EJS_startOnLoaded =
        true;

    /*
     * Không có EJS_AdUrl
     */

    window.EJS_DEBUG_XX =
        window.debug;

    if (window.language !== "auto") {
        window.EJS_language =
            window.language;
    }

    if (
        core === "psp" ||
        core === "dosbox_pure" ||
        core === "azahar"
    ) {
        window.EJS_threads =
            true;
    }

    /*
     * Giữ nguyên loader của Demo
     */

    script.src =
        cdn + "loader.js";

    document.body.appendChild(script);

});


box.ondragover = () =>
    box.setAttribute("drag", true);

box.ondragleave = () =>
    box.removeAttribute("drag");


/* =========================
   SETTINGS
========================= */

const settingsPopup =
    document.getElementById("popup-settings");

settings.onclick = () =>
    settingsPopup.classList.add("show");

document.getElementById("settings-close").onclick =
    () => settingsPopup.classList.remove("show");


/* =========================
   DEBUG
========================= */

const params =
    new URLSearchParams(location.search);

debug.checked =
    ["1","true"].includes(
        params.get("debug")
    );

debug.onchange = () => {

    const u =
        new URL(location.href);

    if (debug.checked)
        u.searchParams.set("debug","1");
    else
        u.searchParams.delete("debug");

    location.href =
        u.toString();
};


/* =========================
   LANGUAGE
========================= */

const languages = {
    auto:"Auto",
    en:"English",
    vi:"Tiếng Việt",
    pt:"Português",
    es:"Español",
    ja:"日本語",
    zh:"中文",
    de:"Deutsch",
    fr:"Français",
    ru:"Русский"
};

const language =
    document.getElementById("language");

for (const l in languages)
    language.add(
        new Option(languages[l],l)
    );

window.language =
    localStorage.getItem("language") ||
    "auto";

language.value =
    window.language;

language.onchange = () => {

    localStorage.setItem(
        "language",
        language.value
    );

    location.reload();
};


/* =========================
   CUSTOM CDN
========================= */

const customPath =
    document.getElementById("customPath");

const customPathValid =
    document.getElementById("customPathValid");

const savedCDN =
    localStorage.getItem("custom_cdn");

if (savedCDN)
    customPath.value =
        savedCDN;

customPath.onchange = () => {

    const value =
        customPath.value.trim();

    if (
        value &&
        /^https?:\/\/.+\/$/.test(value)
    ) {

        localStorage.setItem(
            "custom_cdn",
            value
        );

        customPathValid.textContent =
            "Valid";

        customPathValid.style.color =
            "#4caf50";

    } else {

        localStorage.removeItem(
            "custom_cdn"
        );

        customPathValid.textContent =
            value ? "Invalid URL" : "";

        customPathValid.style.color =
            "#f44336";
    }
};


/* =========================
   CACHE
========================= */

document.getElementById("cache").onclick =
    async () => {

        if (!confirm(
            "Clean all cache and saved data?"
        ))
            return;

        localStorage.clear();

        if (window.indexedDB?.databases) {

            try {

                const dbs =
                    await indexedDB.databases();

                dbs.forEach(db => {

                    if (db.name)
                        indexedDB.deleteDatabase(
                            db.name
                        );

                });

            } catch(e) {}

        }

        if (window.caches) {

            try {

                const keys =
                    await caches.keys();

                await Promise.all(
                    keys.map(k =>
                        caches.delete(k)
                    )
                );

            } catch(e) {}
        }

        location.reload();
    };


/* =========================
   PWA
   - SVG DATA URL
   - BLOB MANIFEST
========================= */

let installPrompt = null;

const installButton =
    document.getElementById("install");

const pwaStatus =
    document.getElementById("pwa-status-msg");


const icon =
"data:image/svg+xml," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024">
<path fill="#1AAFFF"
d="M174.336 768l-119.168 119.168a42.667 42.667 0 0 0 60.331 60.331L234.667 828.33l119.168 119.168a42.667 42.667 0 0 0 60.331-60.331L295 768l119.168-119.168a42.667 42.667 0 0 0-60.331-60.331L234.667 707.669l-119.168-119.168a42.667 42.667 0 0 0-60.331 60.331L174.336 768z
M768 469.333c-117.824 0-213.333-95.509-213.333-213.333S650.176 42.667 768 42.667s213.333 95.509 213.333 213.333-95.509 213.333-213.333 213.333zm0-85.333a128 128 0 1 0 0-256 128 128 0 0 0 0 256z
M554.667 661.547c0-59.093 47.68-106.88 106.88-106.88h212.907c59.093 0 106.88 47.68 106.88 106.88v212.907c0 59.093-47.68 106.88-106.88 106.88h-212.907A106.731 106.731 0 0 1 554.667 874.453v-212.906z
M640 661.547v212.906c0 12.032 9.536 21.547 21.547 21.547h212.907c12.032 0 21.547-9.536 21.547-21.547v-212.906c0-12.032-9.536-21.547-21.547-21.547h-212.907c-12.032 0-21.547 9.536-21.547 21.547z
M183.829 109.888c36.118-61.163 108.246-61.248 144.427 0l126.208 213.653c35.733 60.523 3.52 124.437-66.816 124.437H124.437c-70.613 0-102.635-63.765-66.816-124.437L183.829 109.91z
M133.653 362.667h244.8l-122.41-207.232-122.39 207.232z"/>
</svg>
`);


/* Manifest */

try {

    const manifest = {
        name: "EmulatorJS",
        short_name: "EmulatorJS",
        start_url: location.href,
        display: "standalone",
        background_color: "#000000",
        theme_color: "#1AAFFF",
        icons: [
            {
                src: icon,
                sizes: "192x192 512x512",
                type: "image/svg+xml"
            }
        ]
    };

    const manifestURL =
        URL.createObjectURL(
            new Blob(
                [JSON.stringify(manifest)],
                {type:"application/json"}
            )
        );

    const manifestLink =
        document.createElement("link");

    manifestLink.rel =
        "manifest";

    manifestLink.href =
        manifestURL;

    document.head.appendChild(
        manifestLink
    );

} catch(e) {}


/* PWA prompt */

window.addEventListener(
    "beforeinstallprompt",
    event => {

        event.preventDefault();

        installPrompt =
            event;

        installButton.disabled =
            false;

        installButton.textContent =
            "Install";
    }
);


window.addEventListener(
    "appinstalled",
    () => {

        localStorage.setItem(
            "pwa_installed",
            "true"
        );

        installPrompt =
            null;

        installButton.textContent =
            "Installed";

        installButton.disabled =
            true;
    }
);


function checkPwa() {

    const standalone =
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||
        navigator.standalone;

    const installed =
        localStorage.getItem(
            "pwa_installed"
        ) === "true";

    if (standalone || installed) {

        installButton.textContent =
            "Installed";

        installButton.disabled =
            true;

    } else if (installPrompt) {

        installButton.textContent =
            "Install";

        installButton.disabled =
            false;

    } else {

        installButton.textContent =
            "Install";

        installButton.disabled =
            true;
    }
}


installButton.onclick =
    async () => {

        if (!installPrompt) {

            pwaStatus.textContent =
                "PWA requires HTTPS or localhost.";

            return;
        }

        try {

            installPrompt.prompt();

            const result =
                await installPrompt.userChoice;

            if (
                result &&
                result.outcome === "accepted"
            ) {

                localStorage.setItem(
                    "pwa_installed",
                    "true"
                );

            }

            installPrompt =
                null;

            checkPwa();

        } catch(e) {

            pwaStatus.textContent =
                "PWA error: " + e.message;
        }
    };


checkPwa();

</script>

</body>
</html>
