<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Bắt buộc phải có thẻ viewport này để hiển thị đúng trên mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EmulatorJS Full Screen</title>
    
    <style>
        /* Reset margin, padding và ép html/body chiếm trọn màn hình */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Màu nền đen chuẩn chơi game */
        }

        /* Khung chứa game tự động full toàn bộ màn hình trên cả Mobile & Máy tính */
        .game-container {
            width: 100vw;
            height: 100vh;   /* Dự phòng cho trình duyệt cũ */
            height: 100dvh;  /* Chuẩn CSS động cho Mobile, không sợ đè thanh URL */
            max-width: 100%;
            position: relative;
        }

        /* Đảm bảo id="game" bên trong cũng giãn nở tối đa */
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div class="game-container">
  <div id="game"></div>
</div>

<script type="text/javascript">
    EJS_player = '#game';
    EJS_biosUrl = '';
    EJS_gameUrl = 'https://raw.githubusercontent.com/longhai/emu/main/roms/nes/3dbatworru.zip';
    EJS_core = 'nes';
    EJS_lightgun = false;
    EJS_pathtodata = 'https://longhai.github.io/emujs/';
    EJS_startOnLoaded = true;
    
    // Tùy chọn bổ sung của EmulatorJS: Tự động kích hoạt chế độ Fullscreen khi game tải xong
    EJS_fullscreenOnLoaded = true; 
</script>
<script src="https://longhai.github.io/emujs/loader.js"></script>

</body>
</html>
