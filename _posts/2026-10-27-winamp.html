<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winamp</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;color:#e5e7eb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden;width:100%}
  .top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#111827}
  .top span{font-size:14px;color:#9ca3af}
  .top button{background:#374151;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:16px;cursor:pointer}
  #menu{display:none;padding:10px;background:#1f2937}
  #menu.open{display:block}
  #menu p{font-size:13px;line-height:1.5;color:#9ca3af;margin:0 0 10px}
  #menu p b{color:#e5e7eb}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .bar button,.bar label{flex:1 1 auto;background:#374151;color:#fff;border:0;border-radius:8px;padding:11px 10px;font-size:15px;cursor:pointer;text-align:center}
  #menu input[type=url]{width:100%;padding:10px;border-radius:6px;border:1px solid #4b5563;background:#111827;color:#fff}
  #skinInput,#musicInput,#folderInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  #msg{font-size:13px;color:#fbbf24;min-height:18px;padding:0 10px}
  /* Thiet ke dung cua app: binh thuong #app canh giua, cua so 275px nho
     canh giua nhu Winamp goc. Chi khi bat Double Size (550px) moi can
     co ve vua man hinh va sat canh trai, chu khong phai luc nao cung full. */
  #appWrap{position:relative;overflow:hidden;margin:0 auto;height:0;width:275px}
  #app{position:relative;width:275px;margin:0 auto;height:0;transform-origin:top center}
  #webamp{transform-origin:top left}
  /* Ten bai trong Playlist: font goc Webamp chi 11px, lai bi co Double Size
     xuong 0,7 lan con ~8px nen gan nhu khong doc duoc nhu anh ban gui.
     Tang len 20px de sau khi co Double Size con ~14px, doc duoc nhu app,
     va tang chieu cao hang theo de chu khong de len nhau. */
  #playlist-window .playlist-track-titles, #playlist-window .playlist-track-durations{font-size:20px !important; line-height:28px !important}
  #playlist-window .track-cell{font-size:20px !important; line-height:28px !important; height:28px !important}
</style>
<script src="webamp.bundle.min.js"></script>
</head>

function embeddedSkinUrl(){
  try {
    const bin = atob(SKIN_B64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], {type: 'application/zip'}));
  } catch(e){ return null; }
}
function say(t){}

function toTrack(s, base){
  let url, artist, title;
  if(typeof s === 'string'){ url = s; title = s.split('/').pop().replace(/\.[^.]+$/,''); }
  else {
    url = s.url || s.file || '';
    title = s.title || s.name || url.split('/').pop().replace(/\.[^.]+$/,'');
    artist = s.artist || '';
    if(!artist && title.includes(' - ')){ const p = title.split(' - '); artist = p[0]; title = p.slice(1).join(' - '); }
  }
  const full = /^https?:\/\//.test(url) ? url : (base ? base + url : url);
  return { url: full, metaData: { artist: artist || undefined, title: title }, duration: s.duration || undefined };
}
async function loadSongsJson(url, base){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  const items = Array.isArray(data) ? data : (data.songs || []);
  if(!items.length) throw new Error('songs.json rỗng');
  return items.map(s => toTrack(s, base));
}

// DUNG THIET KE CUA APP: binh thuong GIU NGUYEN 275px, nho, canh giua,
// khong scale, khong full. Chi khi bat Double Size (cua so 550px) moi co
// ve vua man hinh va sat canh trai, de Double Size tren dien thoai khong
// tran ra ngoai ma thanh full vua man hinh nhu ban thay truoc day.
// Bu font Playlist theo ti le co: che do thuong scale=1 thi font 20px,
// che do Double Size scale ~0,7 thi font phai len 20/0,7 ~ 28px de chu
// tren man hinh van to ngang che do thuong, khong bi nho lai nhu truoc.
// Chu trong Playlist la text HTML nen bu duoc, chu khac cua skin la anh
// bitmap thi khong bu duoc, van se nho theo ti le co.
function setPlaylistFont(effectivePx){
  let st = document.getElementById('plFontDynamic');
  if(!st){ st = document.createElement('style'); st.id = 'plFontDynamic'; document.head.appendChild(st); }
  const scaleNow = parseFloat((document.getElementById('webamp')?.style.transform.match(/scale\(([^)]+)\)/) || [0, 1])[1]) || 1;
  const fontPx = (effectivePx / scaleNow);
  if(window.__lastPlFont && Math.abs(window.__lastPlFont - fontPx) < 0.5) return;
  window.__lastPlFont = fontPx;
  const linePx = Math.round(fontPx * 1.4);
  st.textContent = '#playlist-window .playlist-track-titles, #playlist-window .playlist-track-durations{font-size:' + fontPx.toFixed(1) + 'px !important; line-height:' + linePx + 'px !important} #playlist-window .track-cell{font-size:' + fontPx.toFixed(1) + 'px !important; line-height:' + linePx + 'px !important; height:' + linePx + 'px !important}';
}
function fitWebamp(){
  const w = document.getElementById('webamp');
  if(!w) return;
  const cur = parseFloat((w.style.transform.match(/scale\(([^)]+)\)/) || [0, 1])[1]) || 1;
  const ids = ['main-window','equalizer-window','playlist-window'];
  let minTop = Infinity, maxBottom = -Infinity, maxW = 0, mainLeft = 0;
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const r = el.getBoundingClientRect();
    if(r.width > 0){
      minTop = Math.min(minTop, r.top); maxBottom = Math.max(maxBottom, r.bottom);
      maxW = Math.max(maxW, r.width / cur);
      if(id === 'main-window') mainLeft = r.left;
    }
  });
  if(!isFinite(minTop) || maxW === 0) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const contentH = (maxBottom - minTop) / cur;
  // Khi nguoi dung chon Double Size, Webamp phong to cua so len 550px.
  // Neu co 550px ve vua man hinh 390px thi ti le chi 0,7, khung bi BOP
  // 30%, moi chi tiet deu nho lai - dung nhu ban noi. Cach dung tren
  // dien thoai khong phai la bop Double Size xuong, ma la TAT Double Size
  // goc di, roi KEO DAN co thuong (275px) LEN vua man hinh (ti le ~1,42).
  // Nhu vay khung duoc DAN RA, khong bi bop, chu va nut deu to hon.
  // Double Size luc nay chi dong vai tro cong tac bat/tat che do full.
  if(maxW >= 400){
    if(window.__toggling) return;
    if(typeof webamp !== 'undefined' && webamp && webamp.store){
      try {
        window.__toggling = true;
        window.__fullMode = !window.__fullMode;
        webamp.store.dispatch({type:'TOGGLE_DOUBLESIZE_MODE'});
        if(!window.__fullMode){
          webamp.store.dispatch({type:'WINDOW_SIZE_CHANGED', windowId:'playlist', size:[0, 16]});
          window.__lastEhFull = null;
        }
      } catch(e){ window.__toggling = false; }
    }
    return;
  }
  // Da ve co thuong (275px): xoa co toggling de lan chon Double Size sau
  // lai bat duoc.
  window.__toggling = false;
  // Cac cua so phai DINH SAT NHAU nhu truoc: Main cao 116, EQ o 116,
  // Playlist o 232. Neu EQ/Playlist bi keo lech hoac bi de lai o vi tri
  // Double Size cu (EQ 232, Playlist 464) thi se ho khe den giua cac
  // cua so - dung nhu anh ban gui. Phat hien khe >5px thi keo lai ve
  // dung vi tri, dung action UPDATE_WINDOW_POSITIONS da kiem chung.
  try {
    const mEl = document.getElementById('main-window'), eEl = document.getElementById('equalizer-window'), pEl = document.getElementById('playlist-window');
    if(mEl && eEl && pEl && typeof webamp !== 'undefined' && webamp && webamp.store){
      const mR = mEl.getBoundingClientRect(), eR = eEl.getBoundingClientRect(), pR = pEl.getBoundingClientRect();
      const eqGap = (eR.top - mR.bottom) / cur, plGap = (pR.top - eR.bottom) / cur;
      // Ca 2 truong hop gay tran tren trang truc tiep: (1) cac cua so ho
      // khe, (2) ca cum cua so bi day xuong duoi (top >5) lam chan Playlist
      // vuot khoi man hinh, du tong cao cua cum van vua. Ca 2 deu keo ve
      // 0/116/232 la het.
      const topOffset = mR.top / cur;
      if(Math.abs(eqGap) > 5 || Math.abs(plGap) > 5 || topOffset > 5){
        // Vi tri x phai la khoang canh giua de che do thuong van canh giua,
        // khong phai 0 (0 se day cua so sat canh trai). Che do full thi
        // fit se tu dich ve sat trai sau, nen x o day cu de canh giua.
        const xC = Math.round((window.innerWidth - 275) / 2);
        webamp.store.dispatch({type:'UPDATE_WINDOW_POSITIONS', positions:{main:{x:xC,y:0}, equalizer:{x:xC,y:116}, playlist:{x:xC,y:232}}, absolute:true});
      }
    }
  } catch(e){}
  if(window.__fullMode){
    // Che do full (keo dan): scale theo rong, sat canh trai, Playlist
    // keo dai theo chieu cao man hinh de lap day chieu doc, khong bop.
    const scale = (vw / 275) * 0.99;
    const totalNeeded = vh / scale;
    const ehFull = Math.max(0, Math.floor((totalNeeded - 232 - 116) / 29));
    if(window.__lastEhFull !== ehFull && typeof webamp !== 'undefined' && webamp && webamp.store){
      try { webamp.store.dispatch({type:'WINDOW_SIZE_CHANGED', windowId:'playlist', size:[0, ehFull]}); window.__lastEhFull = ehFull; } catch(e){}
    }
    const wLeft = w.getBoundingClientRect().left;
    const translateUnscaled = (mainLeft - wLeft) / cur;
    const shift = -translateUnscaled * scale;
    if(Math.abs(scale - cur) < 0.005 && Math.abs(parseFloat(w.style.left || 0) - shift) < 1) { setPlaylistFont(20); return; }
    w.style.position = 'relative';
    w.style.left = shift + 'px';
    w.style.transformOrigin = 'top left';
    w.style.transform = 'scale(' + scale + ')';
    setPlaylistFont(20);
    document.body.style.height = Math.ceil(contentH * scale) + 'px';
    document.body.style.overflow = 'auto';
    document.body.style.overflowX = 'hidden';
    return;
  }
  // Che do thuong: tra ve co goc, nho, canh giua nhu app goc.
  // Nhung Playlist KHONG duoc co dinh eh16 nua: khung xem trong app codes
  // cao hon chieu cao that cua trinh duyet khi mo truc tiep ngoai trang
  // (thanh dia chi + thanh dieu huong an mat ~100-150px), nen tong cao
  // 812px co dinh se TRAN chieu doc tren trang truc tiep, du trong app
  // codes van vua. Thu Playlist lai theo chieu cao that, chi thu khi
  // tran, khong tang qua 16 khi vua.
  const ehNormal = Math.min(16, Math.max(0, Math.floor((vh - 348) / 29)));
  if(window.__lastEhNormal !== ehNormal && typeof webamp !== 'undefined' && webamp && webamp.store){
    try { webamp.store.dispatch({type:'WINDOW_SIZE_CHANGED', windowId:'playlist', size:[0, ehNormal]}); window.__lastEhNormal = ehNormal; } catch(e){}
  }
  if(cur !== 1 || w.style.left){
    w.style.transform = 'scale(1)';
    w.style.position = ''; w.style.left = '';
    document.body.style.height = ''; document.body.style.overflow = 'auto';
    document.body.style.overflowX = 'hidden';
  }
  setPlaylistFont(20);
}

  function addLocalFiles(files){
    const audioFiles = [...files].filter(f => /\.(mp3|flac|wav|ogg|oga|m4a|aac|opus)$/i.test(f.name));
    if(!audioFiles.length){ say('Không thấy file nhạc nào trong lựa chọn đó.'); return; }
    audioFiles.sort((a,b) => a.name.localeCompare(b.name, 'vi'));
    const tracks2 = audioFiles.map(f => {
      const name = f.name.replace(/\.[^.]+$/, '');
      let artist, title = name;
      if(name.includes(' - ')){ const p = name.split(' - '); artist = p[0]; title = p.slice(1).join(' - '); }
      return { url: URL.createObjectURL(f), metaData: { artist: artist, title: title } };
    });
    webamp.appendTracks(tracks2);
    say('Đã thêm ' + tracks2.length + ' bài từ máy bạn.');
    const _m = document.getElementById('menu'); if(_m) _m.classList.remove('open');
  }
  const _musEl = document.getElementById('musicInput'); if(_musEl) _musEl.onchange = e => { addLocalFiles(e.target.files); e.target.value = ''; };
  const _folEl = document.getElementById('folderInput'); if(_folEl) _folEl.onchange = e => { addLocalFiles(e.target.files); e.target.value = ''; };
  
}
function loadWebamp(){
  return new Promise((resolve, reject) => {
    if(window.Webamp) return resolve();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/webamp@2.3.1/built/webamp.bundle.min.js';
    s.onload = () => window.Webamp ? resolve() : reject(new Error('no Webamp'));
    s.onerror = () => reject(new Error('load fail'));
    document.head.appendChild(s);
  });
}
loadWebamp().then(start).catch(() => say('Chưa tải được thư viện Webamp. Trên GitHub Pages cần up kèm file webamp.bundle.min.js cùng thư mục; nếu mở file lẻ thì cần mạng để tải từ unpkg.'));
</script>
