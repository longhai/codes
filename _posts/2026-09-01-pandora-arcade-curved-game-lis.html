<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pandora Arcade - Curved Game List</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    
    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(circle at 75% 40%, #c2410c 0%, #7f1d1d 30%, #1a0504 70%, #050101 100%);
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
    }

    /* Màn hình chờ */
    #loader {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #f97316; border-top-color: transparent; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* SVG Main Frame */
    main { width: 100%; height: 100%; max-height: 98vh; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 4px; }
    svg { width: 100%; height: 100%; max-height: 98vh; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); cursor: grab; }
    
    /* Phông chữ & Hiệu ứng Chữ */
    .txt-normal { font-family: 'Rajdhani', sans-serif; font-weight: 700; fill: #e2e8f0; font-size: 17px; }
    .txt-active { font-family: 'Rajdhani', sans-serif; font-weight: 800; fill: #ffffff; font-size: 19px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.95)); }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p id="load-txt" style="color: #fbbf24; font-family: 'Orbitron'; font-size: 12px; letter-spacing: 1px;">ĐANG TẢI DỮ LIỆU GAME...</p>
  </div>

  <main>
    <svg id="arcade-svg" viewBox="0 0 540 630" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="g-norm" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1e293b"/><stop offset="45%" stop-color="#334155"/><stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <linearGradient id="g-act" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#dc2626"/>
        </linearGradient>
        <linearGradient id="g-head" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3.5" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/>
        </filter>
        <g id="clip-defs"></g>
      </defs>

      <g id="header-group"></g>
      <g id="slots-group"></g>
    </svg>
  </main>

  <script>
    const DAT_URL = "https://raw.githubusercontent.com/Abdess/retrobios/refs/heads/main/bios/Arcade/FBNeo/FinalBurn%20Neo%20(ClrMame%20Pro%20XML%2C%20NES%20Games%20only).dat";
    const NUM = 10, H_TOP = 15, H_BOT = 52, S_Y0 = 62, S_H = 47, S_GAP = 7.5, W = 435, X0 = 14, X1 = 85;
    const TOTAL_H = S_Y0 + (NUM - 1) * (S_H + S_GAP) + S_H;
    const Y_MID = (H_TOP + TOTAL_H) / 2, HALF_H = (TOTAL_H - H_TOP) / 2;

    let games = [], selIdx = 0, topIdx = 0, slots = [], isCurved = true;

    // Tính độ cong X theo chế độ Cong / Dọc
    const getX = y => isCurved 
      ? (X0 + (X1 - X0) * (1 - Math.pow(Math.max(-1, Math.min(1, (y - Y_MID) / HALF_H)), 2)))
      : (X0 + 20);

    // Dựng Header khớp đường cong & Nút bấm chuyển giao diện
    function drawHeader() {
      const g = document.getElementById('header-group');
      const xl0 = getX(H_TOP), xl1 = getX(H_BOT);
      const btnW = 65, btnH = 20;
      const btnX = (xl0 + xl1) / 2 + W - btnW - 10;
      const btnY = H_TOP + (H_BOT - H_TOP - btnH) / 2;
      
      g.innerHTML = `
        <polygon points="${xl0.toFixed(1)},${H_TOP} ${(xl0+W).toFixed(1)},${H_TOP} ${(xl1+W).toFixed(1)},${H_BOT} ${xl1.toFixed(1)},${H_BOT}" fill="url(#g-head)" stroke="#475569" stroke-width="1.5"/>
        <line x1="${xl0.toFixed(1)}" y1="${H_TOP}" x2="${xl1.toFixed(1)}" y2="${H_BOT}" stroke="#38bdf8" stroke-width="4"/>
        <text id="cnt-txt" x="${(xl0+xl1)/2 + 18}" y="${H_TOP + (H_BOT-H_TOP)/2 + 5}" fill="#fbbf24" font-size="15" font-weight="bold" font-family="Orbitron">GAME: 0 / 0</text>

        <g id="btn-toggle" style="cursor: pointer;">
          <rect x="${btnX.toFixed(1)}" y="${btnY.toFixed(1)}" width="${btnW}" height="${btnH}" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
          <text x="${(btnX + btnW / 2).toFixed(1)}" y="${btnY + 14}" fill="#f97316" font-size="10" font-weight="bold" font-family="Orbitron" text-anchor="middle">${isCurved ? 'CONG' : 'DỌC'}</text>
        </g>
      `;

      document.getElementById('btn-toggle').onclick = (e) => {
        e.stopPropagation();
        isCurved = !isCurved;
        drawHeader();
        drawSlots();
        render();
      };
    }

    // Dựng 10 Slots SVG
    function drawSlots() {
      const grp = document.getElementById('slots-group'), defs = document.getElementById('clip-defs');
      grp.innerHTML = ''; defs.innerHTML = ''; slots = [];

      for (let i = 0; i < NUM; i++) {
        const y0 = S_Y0 + i * (S_H + S_GAP), y1 = y0 + S_H;
        const xl0 = getX(y0), xl1 = getX(y1);

        const clip = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
        clip.id = `c-${i}`;
        clip.innerHTML = `<polygon points="${xl0.toFixed(1)},${y0} ${(xl0+W-15).toFixed(1)},${y0} ${(xl1+W-15).toFixed(1)},${y1} ${xl1.toFixed(1)},${y1}"/>`;
        defs.appendChild(clip);

        const el = document.createElementNS("http://www.w3.org/2000/svg", "g");
        el.style.cursor = "pointer";
        el.innerHTML = `
          <polygon points="${xl0.toFixed(1)},${y0} ${(xl0+W).toFixed(1)},${y0} ${(xl1+W).toFixed(1)},${y1} ${xl1.toFixed(1)},${y1}" fill="url(#g-norm)" stroke="#475569" stroke-width="1.5"/>
          <line x1="${xl0.toFixed(1)}" y1="${y0}" x2="${xl1.toFixed(1)}" y2="${y1}" stroke="#60a5fa" stroke-width="4"/>
          <text x="${(xl0+xl1)/2 + 18}" y="${y0 + S_H/2 + 5.5}" class="txt-normal" clip-path="url(#c-${i})"></text>
        `;

        el.onclick = () => { if (topIdx + i < games.length) { selIdx = topIdx + i; render(); } };
        grp.appendChild(el);
        slots.push({
          poly: el.querySelector('polygon'),
          line: el.querySelector('line'),
          txt: el.querySelector('text'),
          g: el
        });
      }
    }

    // Nạp dữ liệu XML
    async function loadData() {
      try {
        const res = await fetch(DAT_URL);
        const xml = await res.text();
        const nodes = new DOMParser().parseFromString(xml, "text/xml").querySelectorAll("game, machine");
        
        const set = new Set();
        nodes.forEach(n => {
          const t = n.querySelector("description")?.textContent.trim() || n.getAttribute("name");
          if (t) set.add(t);
        });
        games = Array.from(set);

        document.getElementById('loader').style.display = 'none';
        drawHeader();
        drawSlots();
        render();
      } catch (e) {
        document.getElementById('load-txt').innerText = "LỖI TẢI DỮ LIỆU!";
        document.getElementById('load-txt').style.color = "#ef4444";
      }
    }

    // Cập nhật giao diện khi chọn/vuốt
    function render() {
      if (!games.length) return;
      if (selIdx < topIdx) topIdx = selIdx;
      else if (selIdx >= topIdx + NUM) topIdx = selIdx - (NUM - 1);
      topIdx = Math.max(0, Math.min(topIdx, games.length - NUM));

      document.getElementById('cnt-txt').textContent = `GAME: ${selIdx + 1} / ${games.length}`;

      slots.forEach((s, i) => {
        const idx = topIdx + i;
        if (idx < games.length) {
          s.g.style.display = "block";
          const title = games[idx];
          s.txt.textContent = title.length > 56 ? title.slice(0, 54) + "..." : title;

          const active = idx === selIdx;
          s.poly.setAttribute("fill", active ? "url(#g-act)" : "url(#g-norm)");
          s.poly.setAttribute("stroke", active ? "#fef08a" : "#475569");
          s.poly.setAttribute("stroke-width", active ? "2.5" : "1.5");
          active ? s.poly.setAttribute("filter", "url(#glow)") : s.poly.removeAttribute("filter");

          s.line.setAttribute("stroke", active ? "#fef08a" : "#60a5fa");
          s.line.setAttribute("stroke-width", active ? "5" : "4");

          s.txt.setAttribute("class", active ? "txt-active" : "txt-normal");
        } else {
          s.g.style.display = "none";
        }
      });
    }

    const move = step => {
      const nxt = selIdx + step;
      if (nxt >= 0 && nxt < games.length) { selIdx = nxt; render(); }
    };

    // Điều khiển Cảm ứng, Cuộn & Mũi tên
    let startY = 0;
    const svg = document.getElementById('arcade-svg');
    svg.ontouchstart = e => startY = e.touches[0].clientY;
    svg.ontouchmove = e => {
      const dY = startY - e.touches[0].clientY;
      if (Math.abs(dY) >= 20) { move(dY > 0 ? 1 : -1); startY = e.touches[0].clientY; }
    };
    window.onwheel = e => move(e.deltaY > 0 ? 1 : -1);
    window.onkeydown = e => {
      if (e.key === 'ArrowDown') move(1);
      if (e.key === 'ArrowUp') move(-1);
    };

    window.onload = loadData;
  </script>
</body>
</html>
