<!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cài đặt Ứng dụng</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font:16px sans-serif;min-height:100vh;display:grid;place-items:center}
main{width:min(420px,calc(100% - 40px));padding:24px;background:#333;border:1px solid #555;border-radius:12px}
h1{font-size:20px;margin:0 0 20px;padding-bottom:10px;border-bottom:1px solid #555}
div{display:flex;justify-content:space-between;align-items:center}
button{padding:8px 16px;border:1px solid #555;border-radius:6px;background:#333;color:#eee;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head><body>
<main>
<h1>Cài đặt Ứng dụng</h1>
<div>
<span>Cài đặt PWA:</span>
<button id="install" disabled>Cài đặt</button>
</div>
</main><script>
let p;
const b=document.getElementById("install");

onbeforeinstallprompt=e=>{
 e.preventDefault();
 p=e;
 b.disabled=false;
};

b.onclick=async()=>{
 if(!p)return;
 await p.prompt();
 p=null;
 b.disabled=true;
};
</script></body>
</html>
