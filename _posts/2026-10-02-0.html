<!DOCTYPE html>
<html>
<head>
<title>EmulatorJS | Demo</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000">
<link rel="stylesheet" href="https://demo.emulatorjs.org/main.css">
</head>

<body>

<div id="box">
    <input type="file" id="input">
    Drag ROM file or click here
</div>

<div id="version">
    <select id="version-select"></select>

    <button id="download" class="hide" onclick="downloadversion()">
        ↓
    </button>

    <button id="settings">
        ⚙
    </button>
</div>

<div id="popup-settings" class="popup popup-animate">
    <div class="content">
        <div class="title"><h1>Settings</h1></div>

        <div class="options">

            <div class="buttonbox">
                <p>Enable Debuging:
                    <label class="switch">
                        <input type="checkbox" id="debug">
                        <span class="slider round"></span>
                    </label>
                </p>
            </div><br>

            <div class="buttonbox">
                <p>Clean Cache: <button id="cache">Clean</button></p>
            </div><br>

            <div class="buttonbox">
                <p>Language:
                    <select id="language"></select>
                    <span id="languageHelp"></span>
                </p>
            </div><br>

            <div class="buttonbox last">
                <p>Custom Path:
                    <input type="text" id="customPath"
                    placeholder="https://cdn.emulatorjs.org/stable/">
                    <span id="customPathValid"></span>
                </p>
            </div>

            <p id="offline-status">Offline Status: CHECKING</p>
            <p>Offline Cores will be available soon.</p>

            <p class="hide">
                Remove All Saved Versions:
                <button id="remove-version" onclick="removeallsaved()">Remove All</button>
            </p>

            <div id="installbox" class="buttonbox">
                <p id="installboxtext">Install PWA:</p>
                <button id="install" disabled>Install</button>
            </div>

        </div>

        <div class="bottom">
            <button id="settings-close">Close</button>
        </div>
    </div>
</div>

<div class="popup-overlay"></div>

<script src="https://demo.emulatorjs.org/main.js"></script>

<script>

/* =========================
   PWA
========================= */

const installButton = document.getElementById("install");
const installBox = document.getElementById("installbox");
const installBoxText = document.getElementById("installboxtext");

let installPrompt = null;

function isPWAInstalled() {
    return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.navigator.standalone === true ||
        localStorage.getItem("pwa_installed") === "true"
    );
}

function updateInstallUI() {

    if (isPWAInstalled()) {
        installBox.style.display = "none";
        return;
    }

    installBox.style.display = "";
    installButton.disabled = !installPrompt;
    installButton.textContent = installPrompt ? "Install" : "Install";
}

window.addEventListener("beforeinstallprompt", e => {

    e.preventDefault();

    if (isPWAInstalled()) {
        installPrompt = null;
        return;
    }

    installPrompt = e;

    localStorage.setItem("pwa", "true");

    updateInstallUI();
});

window.addEventListener("appinstalled", () => {

    installPrompt = null;

    localStorage.setItem("pwa_installed", "true");
    localStorage.setItem("pwa", "false");

    updateInstallUI();
});

installButton.addEventListener("click", async () => {

    if (!installPrompt || isPWAInstalled()) return;

    const prompt = installPrompt;

    installPrompt = null;

    const result = await prompt.prompt();

    if (result.outcome === "accepted") {
        localStorage.setItem("pwa_installed", "true");
        localStorage.setItem("pwa", "false");
    }

    updateInstallUI();
});

/* Kiểm tra ngay khi mở trang */
updateInstallUI();

/* Kiểm tra khi chuyển sang standalone */
window.addEventListener("visibilitychange", updateInstallUI);

window.matchMedia("(display-mode: standalone)")
    .addEventListener("change", updateInstallUI);


/* =========================
   PWA MANIFEST
========================= */

(() => {

    const manifest = {
        name: "EmulatorJS",
        short_name: "EmulatorJS",
        start_url: location.href.split("#")[0],
        display: "standalone",
        background_color: "#000000",
        theme_color: "#000000",
        icons: [
            {
                src: "img/icon.png",
                sizes: "192x192",
                type: "image/png"
            },
            {
                src: "img/icon.png",
                sizes: "512x512",
                type: "image/png"
            }
        ]
    };

    const blob = new Blob(
        [JSON.stringify(manifest)],
        {type:"application/manifest+json"}
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("link");

    link.rel = "manifest";
    link.href = url;

    document.head.appendChild(link);

})();


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {

    const sw = `
        self.addEventListener("install", e => {
            self.skipWaiting();
        });

        self.addEventListener("activate", e => {
            e.waitUntil(self.clients.claim());
        });
    `;

    const blob = new Blob(
        [sw],
        {type:"application/javascript"}
    );

    const url = URL.createObjectURL(blob);

    navigator.serviceWorker.register(url).catch(() => {});
}


/* =========================
   EMULATORJS
========================= */

if ("serviceWorker" in navigator) {

    async function unregisterServiceWorkers() {

        const registrations =
            await navigator.serviceWorker.getRegistrations();

        for (const registration of registrations) {
            await registration.unregister();
        }
    }

    /* Không unregister PWA SW ở đây */
}

loadJSON("/versions", response => {

    const offlineStatus =
        document.getElementById("offline-status");

    if (!response) {

        loadJSON(
            "https://cdn.emulatorjs.org/versions.json",
            resp => loadVersions(resp)
        );

        offlineStatus.textContent =
            "Offline Status: NOT INSTALLED";

    } else {

        loadVersions(response);

        offlineStatus.textContent =
            "Offline Status: READY";
    }
});

loadSettings();

input.addEventListener("change", async () => {

    const url = input.files[0];
    const parts = input.files[0].name.split(".");

    const core = await (async ext => {

        if (["fds","nes","unif","unf"].includes(ext)) return "nes";

        if (["smc","fig","sfc","gd3","gd7","dx2","bsx","swc"].includes(ext))
            return "snes";

        if (["z64","n64"].includes(ext)) return "n64";

        if (["pce"].includes(ext)) return "pce";

        if (["ngp","ngc"].includes(ext)) return "ngp";

        if (["ws","wsc"].includes(ext)) return "ws";

        if (["col","cv"].includes(ext)) return "coleco";

        if (["d64"].includes(ext)) return "vice_x64";

        if (["nds","gba","gb"].includes(ext)) return ext;

        return await new Promise(resolve => {

            const cores = {
                "Nintendo 64":"n64",
                "Nintendo Game Boy":"gb",
                "Nintendo Game Boy Advance":"gba",
                "Nintendo DS":"nds",
                "Nintendo Entertainment System":"nes",
                "Super Nintendo Entertainment System":"snes",
                "PlayStation":"psx",
                "Virtual Boy":"vb",
                "Sega Mega Drive":"segaMD",
                "Sega Master System":"segaMS",
                "Sega CD":"segaCD",
                "Atari Lynx":"lynx",
                "Sega 32X":"sega32x",
                "Atari Jaguar":"jaguar",
                "Sega Game Gear":"segaGG",
                "Sega Saturn":"segaSaturn",
                "Atari 7800":"atari7800",
                "Atari 2600":"atari2600",
                "NEC TurboGrafx-16/SuperGrafx/PC Engine":"pce",
                "NEC PC-FX":"pcfx",
                "SNK NeoGeo Pocket (Color)":"ngp",
                "Bandai WonderSwan (Color)":"ws",
                "ColecoVision":"coleco",
                "Commodore 64":"vice_x64",
                "Commodore 128":"vice_x128",
                "Commodore VIC20":"vice_xvic",
                "Commodore Plus/4":"vice_xplus4",
                "Commodore PET":"vice_xpet",
                "PlayStation Portable":"psp",
                "3DS":"azahar",
                "DOS":"dosbox_pure"
            };

            const button = document.createElement("button");
            const select = document.createElement("select");

            for (const type in cores) {

                const option =
                    document.createElement("option");

                option.value = cores[type];
                option.textContent = type;

                select.appendChild(option);
            }

            button.onclick = () =>
                resolve(select.value);

            button.textContent = "Load game";

            box.innerHTML = "";
            box.appendChild(select);
            box.appendChild(button);
        });

    })(parts.pop());

    const div = document.createElement("div");
    const sub = document.createElement("div");
    const script = document.createElement("script");

    sub.id = "game";
    div.id = "display";

    document.getElementById("version")?.remove();
    document.getElementById("box")?.remove();

    div.appendChild(sub);
    document.body.appendChild(div);

    const cdn =
        window.cdn ||
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_player = "#game";
    window.EJS_gameName = parts.shift();
    window.EJS_biosUrl = "";
    window.EJS_gameUrl = url;
    window.EJS_core = core;
    window.EJS_pathtodata = cdn;
    window.EJS_startOnLoaded = true;
    window.EJS_DEBUG_XX = window.debug;

    if (window.language !== "auto")
        window.EJS_language = window.language;

    if (
        core === "psp" ||
        core === "dosbox_pure" ||
        core === "azahar"
    ) {
        window.EJS_threads = true;
    }

    script.src = cdn + "loader.js";

    document.body.appendChild(script);
});

box.ondragover = () =>
    box.setAttribute("drag", true);

box.ondragleave = () =>
    box.removeAttribute("drag");

</script>

</body>
</html>
