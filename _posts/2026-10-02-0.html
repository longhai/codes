<!DOCTYPE html><html>
<head>
<title>EmulatorJS | Demo</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000">
<link rel="stylesheet" href="https://demo.emulatorjs.org/main.css">
</head><body>
<div id="box">
    <input type="file" id="input">
    Drag ROM file or click here
    <div style="margin-top:15px">
        <input id="rom-url" type="url" placeholder="Nhập URL ROM..." style="width:70%;padding:8px">
        <button id="load-url">Load URL</button>
    </div>
</div><div id="version">
    <select id="version-select"></select>
    <button id="download" class="hide">Download</button>
    <button id="settings">⚙</button>
</div><div id="popup-settings" class="popup popup-animate">
    <div class="content">
        <div class="title"><h1>Settings</h1></div>
        <div class="options">
            <div class="buttonbox">
                <p>Enable Debuging:
                    <label class="switch">
                        <input type="checkbox" id="debug">
                        <span class="slider round"></span>
                    </label>
                </p>
            </div><br>        <div class="buttonbox">
            <p>Clean Cache: <button id="cache">Clean</button></p>
        </div><br>

        <div class="buttonbox">
            <p>Language: <select id="language"></select></p>
            <p id="languageHelp"></p>
        </div><br>

        <div class="buttonbox last">
            <p>Custom Path:</p>
            <input type="text" id="customPath"
                placeholder="https://cdn.emulatorjs.org/stable/">
            <p id="customPathValid"></p>
        </div>

        <p id="offline-status">Offline Status: CHECKING</p>
        <p>Offline Cores will be available soon.</p>

        <div id="installbox" class="buttonbox">
            <p id="installboxtext">Install PWA:</p>
            <button id="install">Install</button>
        </div><br>
    </div>

    <div class="bottom">
        <button id="settings-close">Close</button>
    </div>
</div>

</div><div class="popup-overlay"></div><script src="https://demo.emulatorjs.org/main.js"></script><script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => {
        rs.forEach(r => r.unregister());
    });
}

loadJSON("/versions", response => {
    const status = document.getElementById("offline-status");
    if (!response) {
        loadJSON(
            "https://cdn.emulatorjs.org/versions.json",
            resp => loadVersions(resp)
        );
        status.textContent = "Offline Status: NOT INSTALLED";
    } else {
        loadVersions(response);
        status.textContent = "Offline Status: READY";
    }
});

loadSettings();

const extMap = {
    fds:"nes",nes:"nes",unif:"nes",unf:"nes",
    smc:"snes",fig:"snes",sfc:"snes",gd3:"snes",gd7:"snes",dx2:"snes",bsx:"snes",swc:"snes",
    z64:"n64",n64:"n64",
    pce:"pce",
    ngp:"ngp",ngc:"ngp",
    ws:"ws",wsc:"ws",
    col:"coleco",cv:"coleco",
    d64:"vice_x64",
    nds:"nds",gba:"gba",gb:"gb"
};

const cores = {
    "Nintendo 64":"n64",
    "Nintendo Game Boy":"gb",
    "Nintendo Game Boy Advance":"gba",
    "Nintendo DS":"nds",
    "Nintendo Entertainment System":"nes",
    "Super Nintendo Entertainment System":"snes",
    "PlayStation":"psx",
    "Virtual Boy":"vb",
    "Sega Mega Drive":"segaMD",
    "Sega Master System":"segaMS",
    "Sega CD":"segaCD",
    "Atari Lynx":"lynx",
    "Sega 32X":"sega32x",
    "Atari Jaguar":"jaguar",
    "Sega Game Gear":"segaGG",
    "Sega Saturn":"segaSaturn",
    "Atari 7800":"atari7800",
    "Atari 2600":"atari2600",
    "NEC TurboGrafx-16/SuperGrafx/PC Engine":"pce",
    "NEC PC-FX":"pcfx",
    "SNK NeoGeo Pocket (Color)":"ngp",
    "Bandai WonderSwan (Color)":"ws",
    "ColecoVision":"coleco",
    "Commodore 64":"vice_x64",
    "Commodore 128":"vice_x128",
    "Commodore VIC20":"vice_xvic",
    "Commodore Plus/4":"vice_xplus4",
    "Commodore PET":"vice_xpet",
    "PlayStation Portable":"psp",
    "3DS":"azahar",
    "DOS":"dosbox_pure"
};

function getCore(name, forcedCore) {
    if (forcedCore) return forcedCore;

    const ext = name.split("?")[0].split("#")[0]
        .split(".").pop().toLowerCase();

    return extMap[ext] || null;
}

function loadROM(url, forcedCore) {
    if (!url) return;

    const name = decodeURIComponent(
        url.split("/").pop().split("?")[0]
    ) || "Game";

    const parts = name.split(".");
    const core = getCore(name, forcedCore);

    const start = core
        ? Promise.resolve(core)
        : new Promise(resolve => {
            const button = document.createElement("button");
            const select = document.createElement("select");

            for (const type in cores) {
                const option = document.createElement("option");
                option.value = cores[type];
                option.textContent = type;
                select.appendChild(option);
            }

            button.textContent = "Load game";
            button.onclick = () =>
                resolve(select.value);

            box.innerHTML = "";
            box.appendChild(select);
            box.appendChild(button);
        });

    start.then(core => {
        const div = document.createElement("div");
        const sub = document.createElement("div");
        const script = document.createElement("script");

        sub.id = "game";
        div.id = "display";

        document.getElementById("top")?.remove();
        document.getElementById("version")?.remove();
        box.remove();

        div.appendChild(sub);
        document.body.appendChild(div);

        const cdn =
            window.cdn ||
            "https://cdn.emulatorjs.org/stable/data/";

        window.EJS_player = "#game";
        window.EJS_gameName = parts.shift();
        window.EJS_biosUrl = "";
        window.EJS_gameUrl = url;
        window.EJS_core = core;
        window.EJS_pathtodata = cdn;
        window.EJS_startOnLoaded = true;
        window.EJS_DEBUG_XX = window.debug;

        if (window.language !== "auto")
            window.EJS_language = window.language;

        if (
            core === "psp" ||
            core === "dosbox_pure" ||
            core === "azahar"
        )
            window.EJS_threads = true;

        script.src = cdn + "loader.js";
        document.body.appendChild(script);
    });
}

/* File ROM */
input.addEventListener("change", async () => {
    const file = input.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    loadROM(url);
});

/* URL ROM */
document.getElementById("load-url").onclick = () => {
    const url = document.getElementById("rom-url").value.trim();
    if (url) loadROM(url);
};

document.getElementById("rom-url").addEventListener("keydown", e => {
    if (e.key === "Enter")
        document.getElementById("load-url").click();
});

box.ondragover = () =>
    box.setAttribute("drag", true);

box.ondragleave = () =>
    box.removeAttribute("drag");

/* URL trình duyệt:
   ?rom=URL
   ?rom=URL&core=nes
*/
const params = new URLSearchParams(location.search);
const browserROM = params.get("rom");
const browserCore = params.get("core");

if (browserROM) {
    document.getElementById("rom-url").value = browserROM;
    loadROM(browserROM, browserCore);
}

/* PWA */
let installPrompt = null;

const installButton = document.querySelector("#install");
const installBox = document.querySelector("#installbox");

function isInstalled() {
    return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true ||
        localStorage.getItem("pwa_installed") === "true"
    );
}

function checkPWA() {
    if (isInstalled()) {
        installBox.style.display = "none";
    } else {
        installBox.style.display = "";
    }
}

checkPWA();

window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    installPrompt = event;

    if (!isInstalled()) {
        installBox.style.display = "";
        installButton.disabled = false;
        installButton.textContent = "Install";
    }
});

installButton.addEventListener("click", async () => {
    if (!installPrompt) return;

    const result = await installPrompt.prompt();

    if (result.outcome === "accepted") {
        localStorage.setItem("pwa_installed", "true");
        installBox.style.display = "none";
    }

    installPrompt = null;
});

window.addEventListener("appinstalled", () => {
    localStorage.setItem("pwa_installed", "true");
    installBox.style.display = "none";
});

/* Manifest */
(() => {
    const manifest = {
        name: "EmulatorJS",
        short_name: "EmulatorJS",
        start_url: location.href.split("?")[0],
        display: "standalone",
        background_color: "#000000",
        theme_color: "#000000",
        icons: [{
            src: "img/icon.png",
            sizes: "512x512",
            type: "image/png"
        }]
    };

    const blob = new Blob(
        [JSON.stringify(manifest)],
        {type:"application/manifest+json"}
    );

    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
})();

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible")
        checkPWA();
});
</script></body>
</html>
