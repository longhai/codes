</head><body><div id="box">
    <input type="file" id="input">

</div><div id="version">
    <select id="version-select"></select><button id="download" class="hide" onclick="downloadversion()">
    Download
</button>

<button id="settings">
    ⚙
</button>

</div><div id="popup-settings" class="popup popup-animate">
    <div class="content">    <div class="title">
        <h1>Settings</h1>
    </div>

    <div class="options">

        <div class="buttonbox">
            <p>
                Enable Debuging:
                <label class="switch">
                    <input type="checkbox" id="debug">
                    <span class="slider round"></span>
                </label>
            </p>
        </div>

        <br>

        <div class="buttonbox">
            <p>Clean Cache:</p>
            <button id="cache">Clean</button>
        </div>

        <br>

        <div class="buttonbox">
            <p>Language:</p>
            <select id="language"></select>
            <p id="languageHelp"></p>
        </div>

        <br>

        <div class="buttonbox last">
            <p>Custom Path:</p>
            <input
                type="text"
                id="customPath"
                placeholder="https://cdn.emulatorjs.org/stable/"
            >
            <p id="customPathValid"></p>
        </div>

        <p id="offline-status">Offline Status: CHECKING</p>

        <p>Offline Cores will be available soon.</p>

        <p class="hide">
            Remove All Saved Versions:
            <button id="remove-version" onclick="removeallsaved()">
                Remove All
            </button>
        </p>

        <div id="installbox" class="buttonbox" style="display:none">
            <p id="installboxtext">Install PWA:</p>
            <button id="install">Install</button>
        </div>

        <br>

    </div>

    <div class="bottom">
        <button id="settings-close">Close</button>
    </div>

</div>

</div><div class="popup-overlay"></div><script src="https://demo.emulatorjs.org/main.js"></script><script>

/* =========================
   PWA
========================= */

(() => {

    const installBox = document.getElementById("installbox");
    const installButton = document.getElementById("install");
    let installPrompt = null;

    const isStandalone = () =>
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.navigator.standalone === true;

    const setInstalled = value => {
        localStorage.setItem("pwa_installed", value ? "true" : "false");
    };

    const isInstalled = () =>
        localStorage.getItem("pwa_installed") === "true";

    const hideInstall = () => {
        installBox.style.display = "none";
    };

    const showInstall = () => {
        installBox.style.display = "flex";
        installButton.disabled = false;
        installButton.textContent = "Install";
    };

    /*
     * Nếu đang chạy trong PWA:
     * chắc chắn đã cài.
     */
    if (isStandalone()) {
        setInstalled(true);
        hideInstall();
    }

    /*
     * Trình duyệt cho phép cài.
     *
     * Đây cũng là tín hiệu quan trọng:
     * nếu trước đó localStorage nói "đã cài"
     * nhưng beforeinstallprompt lại xuất hiện,
     * nghĩa là PWA hiện không còn được cài
     * hoặc trình duyệt cho phép cài lại.
     */
    window.addEventListener("beforeinstallprompt", event => {

        event.preventDefault();

        installPrompt = event;

        setInstalled(false);

        showInstall();
    });

    /*
     * Người dùng cài thành công.
     */
    window.addEventListener("appinstalled", () => {

        installPrompt = null;

        setInstalled(true);

        hideInstall();
    });

    /*
     * Bấm Install.
     */
    installButton.addEventListener("click", async () => {

        if (!installPrompt) return;

        const prompt = installPrompt;

        installPrompt = null;

        await prompt.prompt();

        const result = await prompt.userChoice;

        if (result.outcome === "accepted") {
            setInstalled(true);
            hideInstall();
        } else {
            /*
             * Người dùng bấm Cancel.
             * Cho phép thử lại khi trình duyệt
             * phát beforeinstallprompt lần tiếp theo.
             */
            installPrompt = null;
        }
    });

    /*
     * Khi chuyển sang app PWA.
     */
    document.addEventListener("visibilitychange", () => {

        if (isStandalone()) {
            setInstalled(true);
            hideInstall();
        }
    });

    /*
     * Khi quay lại trang.
     */
    window.addEventListener("pageshow", () => {

        if (isStandalone()) {
            setInstalled(true);
            hideInstall();
        }
    });

})();


/* =========================
   EmulatorJS
========================= */

if ("serviceWorker" in navigator) {

    async function unregisterServiceWorkers() {

        const registrations =
            await navigator.serviceWorker.getRegistrations();

        for (const registration of registrations) {
            await registration.unregister();
        }
    }

    unregisterServiceWorkers();
}


loadJSON("/versions", response => {

    const offlineStatus =
        document.getElementById("offline-status");

    if (!response) {

        loadJSON(
            "https://cdn.emulatorjs.org/versions.json",
            resp => loadVersions(resp)
        );

        offlineStatus.textContent =
            "Offline Status: NOT INSTALLED";

    } else {

        loadVersions(response);

        offlineStatus.textContent =
            "Offline Status: READY";
    }
});


loadSettings();


input.addEventListener("change", async () => {

    const url = input.files[0];

    const parts = input.files[0].name.split(".");

    const core = await (async ext => {

        if (["fds","nes","unif","unf"].includes(ext))
            return "nes";

        if (["smc","fig","sfc","gd3","gd7","dx2","bsx","swc"].includes(ext))
            return "snes";

        if (["z64","n64"].includes(ext))
            return "n64";

        if (["pce"].includes(ext))
            return "pce";

        if (["ngp","ngc"].includes(ext))
            return "ngp";

        if (["ws","wsc"].includes(ext))
            return "ws";

        if (["col","cv"].includes(ext))
            return "coleco";

        if (["d64"].includes(ext))
            return "vice_x64";

        if (["nds","gba","gb"].includes(ext))
            return ext;

        return await new Promise(resolve => {

            const cores = {

                "Nintendo 64": "n64",
                "Nintendo Game Boy": "gb",
                "Nintendo Game Boy Advance": "gba",
                "Nintendo DS": "nds",
                "Nintendo Entertainment System": "nes",
                "Super Nintendo Entertainment System": "snes",
                "PlayStation": "psx",
                "Virtual Boy": "vb",
                "Sega Mega Drive": "segaMD",
                "Sega Master System": "segaMS",
                "Sega CD": "segaCD",
                "Atari Lynx": "lynx",
                "Sega 32X": "sega32x",
                "Atari Jaguar": "jaguar",
                "Sega Game Gear": "segaGG",
                "Sega Saturn": "segaSaturn",
                "Atari 7800": "atari7800",
                "Atari 2600": "atari2600",
                "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                "NEC PC-FX": "pcfx",
                "SNK NeoGeo Pocket (Color)": "ngp",
                "Bandai WonderSwan (Color)": "ws",
                "ColecoVision": "coleco",
                "Commodore 64": "vice_x64",
                "Commodore 128": "vice_x128",
                "Commodore VIC20": "vice_xvic",
                "Commodore Plus/4": "vice_xplus4",
                "Commodore PET": "vice_xpet",
                "PlayStation Portable": "psp",
                "3DS": "azahar",
                "DOS": "dosbox_pure"
            };

            const button = document.createElement("button");
            const select = document.createElement("select");

            for (const type in cores) {

                const option =
                    document.createElement("option");

                option.value = cores[type];
                option.textContent = type;

                select.appendChild(option);
            }

            button.textContent = "Load game";

            button.onclick = () =>
                resolve(select.value);

            box.innerHTML = "";

            box.appendChild(select);
            box.appendChild(button);

        });

    })(parts.pop());


    const div = document.createElement("div");
    const sub = document.createElement("div");
    const script = document.createElement("script");

    sub.id = "game";
    div.id = "display";

    document.getElementById("top")?.remove();
    document.getElementById("version")?.remove();
    document.getElementById("box")?.remove();

    div.appendChild(sub);
    document.body.appendChild(div);


    /*
     * GIỮ NGUYÊN INIT CỦA DEMO
     * để ưu tiên FPS.
     */

    const cdn =
        window.cdn ||
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_player = "#game";
    window.EJS_gameName = parts.shift();
    window.EJS_biosUrl = "";
    window.EJS_gameUrl = url;
    window.EJS_core = core;
    window.EJS_pathtodata = cdn;
    window.EJS_startOnLoaded = true;
    window.EJS_DEBUG_XX = window.debug;

    if (window.language !== "auto") {
        window.EJS_language = window.language;
    }

    if (
        core === "psp" ||
        core === "dosbox_pure" ||
        core === "azahar"
    ) {
        window.EJS_threads = true;
    }

    script.src = cdn + "loader.js";

    document.body.appendChild(script);

});


box.ondragover = () =>
    box.setAttribute("drag", true);

box.ondragleave = () =>
    box.removeAttribute("drag");

</script></body>
</html>
