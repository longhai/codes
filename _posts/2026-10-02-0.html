<!DOCTYPE html>
<html>
<head>
<title>EmulatorJS | Demo</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000">
<link rel="stylesheet" href="https://demo.emulatorjs.org/main.css">
</head>

<body>

<div id="box">
    <input type="file" id="input">
    <div>Drag ROM file or click here</div>
    <div style="margin-top:12px">
        <input id="rom-url" type="url"
               placeholder="Nhập URL ROM..."
               style="width:80%;padding:8px">
        <button id="load-url">Load URL</button>
    </div>
</div>

<div id="version">
    <select id="version-select"></select>
    <button id="download" class="hide" onclick="downloadversion()">Download</button>
    <button id="settings">⚙</button>
</div>

<div id="popup-settings" class="popup popup-animate">
    <div class="content">
        <div class="title"><h1>Settings</h1></div>

        <div class="options">

            <div class="buttonbox">
                <p>
                    Enable Debuging:
                    <label class="switch">
                        <input type="checkbox" id="debug">
                        <span class="slider round"></span>
                    </label>
                </p>
            </div>

            <br>

            <div class="buttonbox">
                <p>Clean Cache: <button id="cache">Clean</button></p>
            </div>

            <br>

            <div class="buttonbox">
                <p>Language:</p>
                <select id="language">
                    <option value="auto">Auto</option>
                    <option value="en">English</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="pt">Português</option>
                    <option value="es">Español</option>
                    <option value="ja">日本語</option>
                    <option value="zh">中文</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="ru">Русский</option>
                </select>
                <p id="languageHelp"></p>
            </div>

            <br>

            <div class="buttonbox">
                <p>Custom Path:</p>
                <input type="text" id="customPath"
                       placeholder="https://cdn.emulatorjs.org/stable/">
                <p id="customPathValid"></p>
            </div>

            <p id="offline-status">Offline Status: CHECKING</p>

            <div id="installbox" class="buttonbox">
                <p id="installboxtext">Install PWA:</p>
                <button id="install">Install</button>
            </div>

        </div>

        <div class="bottom">
            <button id="settings-close">Close</button>
        </div>
    </div>
</div>

<div class="popup-overlay"></div>

<script src="https://demo.emulatorjs.org/main.js"></script>

<script>
/* =========================
   PWA
========================= */

let installPrompt = null;

const installButton = document.getElementById("install");
const installBox = document.getElementById("installbox");
const installText = document.getElementById("installboxtext");

function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
}

function checkPWA() {
    if (isStandalone() ||
        localStorage.getItem("pwa_installed") === "true") {

        installBox.style.display = "none";
        return;
    }

    installBox.style.display = "";
}

window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installPrompt = e;

    if (!isStandalone()) {
        installBox.style.display = "";
        installButton.disabled = false;
        installButton.textContent = "Install";
    }
});

installButton.addEventListener("click", async () => {
    if (!installPrompt) return;

    const result = await installPrompt.prompt();

    if (result.outcome === "accepted") {
        localStorage.setItem("pwa_installed", "true");
        installBox.style.display = "none";
    }

    installPrompt = null;
});

window.addEventListener("appinstalled", () => {
    localStorage.setItem("pwa_installed", "true");
    installBox.style.display = "none";
});

checkPWA();


/* =========================
   PWA MANIFEST
========================= */

(() => {
    const manifest = {
        name: "EmulatorJS",
        short_name: "EmulatorJS",
        start_url: location.href.split("?")[0],
        display: "standalone",
        background_color: "#000000",
        theme_color: "#000000",
        icons: [
            {
                src: "img/icon.png",
                sizes: "192x192",
                type: "image/png"
            },
            {
                src: "img/icon.png",
                sizes: "512x512",
                type: "image/png"
            }
        ]
    };

    const blob = new Blob(
        [JSON.stringify(manifest)],
        {type:"application/manifest+json"}
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = url;

    document.head.appendChild(link);
})();


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
        .then(regs => {
            for (const r of regs) {
                if (r.scope.includes(location.origin))
                    r.update().catch(()=>{});
            }
        })
        .catch(()=>{});
}


/* =========================
   SETTINGS
========================= */

const savedLanguage =
    localStorage.getItem("emulator_language") || "auto";

window.language = savedLanguage;

const languageSelect =
    document.getElementById("language");

languageSelect.value = savedLanguage;

languageSelect.addEventListener("change", () => {
    const lang = languageSelect.value;

    localStorage.setItem("emulator_language", lang);
    window.language = lang;

    document.getElementById("languageHelp").textContent =
        "Language changed. Reload EmulatorJS to apply.";
});


/* =========================
   ROM URL
========================= */

const urlInput = document.getElementById("rom-url");
const loadUrlButton = document.getElementById("load-url");


function getCoreFromExtension(url) {

    const ext =
        url.split("?")[0]
           .split("#")[0]
           .split(".")
           .pop()
           .toLowerCase();

    const map = {
        fds:"nes",
        nes:"nes",
        unif:"nes",
        unf:"nes",

        smc:"snes",
        fig:"snes",
        sfc:"snes",
        gd3:"snes",
        gd7:"snes",
        dx2:"snes",
        bsx:"snes",
        swc:"snes",

        z64:"n64",
        n64:"n64",

        pce:"pce",

        ngp:"ngp",
        ngc:"ngp",

        ws:"ws",
        wsc:"ws",

        col:"coleco",
        cv:"coleco",

        d64:"vice_x64",

        nds:"nds",
        gba:"gba",
        gb:"gb",

        iso:"psx",
        bin:"psx",
        cue:"psx",
        chd:"psx",

        v64:"n64"
    };

    return map[ext] || "";
}


function loadROM(url, core) {

    if (!url) return;

    if (!core)
        core = getCoreFromExtension(url);

    if (!core) {
        core = prompt(
            "Không tự nhận diện được core.\nNhập core:",
            "nes"
        );

        if (!core) return;
    }

    const name =
        decodeURIComponent(
            url.split("/").pop().split("?")[0]
        );

    const parts = name.split(".");

    const div = document.createElement("div");
    const sub = document.createElement("div");
    const script = document.createElement("script");

    sub.id = "game";
    div.id = "display";

    document.getElementById("version")?.remove();
    document.getElementById("box")?.remove();

    div.appendChild(sub);
    document.body.appendChild(div);

    const cdn =
        window.cdn ||
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_player = "#game";
    window.EJS_gameName = parts.shift();
    window.EJS_biosUrl = "";
    window.EJS_gameUrl = url;
    window.EJS_core = core;
    window.EJS_pathtodata = cdn;
    window.EJS_startOnLoaded = true;

    window.EJS_DEBUG_XX =
        window.debug || false;

    if (window.language &&
        window.language !== "auto") {

        window.EJS_language =
            window.language;
    }

    if (
        core === "psp" ||
        core === "dosbox_pure" ||
        core === "azahar"
    ) {
        window.EJS_threads = true;
    }

    script.src = cdn + "loader.js";

    document.body.appendChild(script);
}


/* =========================
   URL TRÌNH DUYỆT
========================= */

function loadFromBrowserURL() {

    const params = new URLSearchParams(
        window.location.search
    );

    const rom = params.get("rom");
    const core = params.get("core");

    if (rom)
        loadROM(rom, core);
}

loadFromBrowserURL();


/* =========================
   LOAD URL TRÊN MÀN HÌNH
========================= */

loadUrlButton.addEventListener("click", () => {

    const url = urlInput.value.trim();

    if (!url) return;

    loadROM(url);

});


/* =========================
   FILE ROM
========================= */

input.addEventListener("change", async () => {

    const file = input.files[0];

    if (!file) return;

    const parts =
        file.name.split(".");

    const ext =
        parts[parts.length - 1].toLowerCase();

    let core = getCoreFromExtension(file.name);

    if (!core) {

        core = await new Promise(resolve => {

            const cores = {
                "Nintendo 64":"n64",
                "Nintendo Game Boy":"gb",
                "Nintendo Game Boy Advance":"gba",
                "Nintendo DS":"nds",
                "Nintendo Entertainment System":"nes",
                "Super Nintendo Entertainment System":"snes",
                "PlayStation":"psx",
                "Virtual Boy":"vb",
                "Sega Mega Drive":"segaMD",
                "Sega Master System":"segaMS",
                "Sega CD":"segaCD",
                "Atari Lynx":"lynx",
                "Sega 32X":"sega32x",
                "Atari Jaguar":"jaguar",
                "Sega Game Gear":"segaGG",
                "Sega Saturn":"segaSaturn",
                "Atari 7800":"atari7800",
                "Atari 2600":"atari2600",
                "NEC TurboGrafx-16/SuperGrafx/PC Engine":"pce",
                "NEC PC-FX":"pcfx",
                "SNK NeoGeo Pocket (Color)":"ngp",
                "Bandai WonderSwan (Color)":"ws",
                "ColecoVision":"coleco",
                "Commodore 64":"vice_x64",
                "Commodore 128":"vice_x128",
                "Commodore VIC20":"vice_xvic",
                "Commodore Plus/4":"vice_xplus4",
                "Commodore PET":"vice_xpet",
                "PlayStation Portable":"psp",
                "3DS":"azahar",
                "DOS":"dosbox_pure"
            };

            const select =
                document.createElement("select");

            for (const name in cores) {

                const option =
                    document.createElement("option");

                option.value = cores[name];
                option.textContent = name;

                select.appendChild(option);
            }

            const button =
                document.createElement("button");

            button.textContent = "Load game";

            button.onclick = () =>
                resolve(select.value);

            box.innerHTML = "";
            box.appendChild(select);
            box.appendChild(button);
        });
    }

    const div =
        document.createElement("div");

    const sub =
        document.createElement("div");

    const script =
        document.createElement("script");

    sub.id = "game";
    div.id = "display";

    document.getElementById("version")?.remove();
    document.getElementById("box")?.remove();

    div.appendChild(sub);
    document.body.appendChild(div);

    const cdn =
        window.cdn ||
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_player = "#game";
    window.EJS_gameName = parts.shift();
    window.EJS_biosUrl = "";
    window.EJS_gameUrl = file;
    window.EJS_core = core;
    window.EJS_pathtodata = cdn;
    window.EJS_startOnLoaded = true;

    window.EJS_DEBUG_XX =
        window.debug || false;

    if (window.language &&
        window.language !== "auto") {

        window.EJS_language =
            window.language;
    }

    if (
        core === "psp" ||
        core === "dosbox_pure" ||
        core === "azahar"
    ) {
        window.EJS_threads = true;
    }

    script.src = cdn + "loader.js";

    document.body.appendChild(script);
});


/* =========================
   DRAG
========================= */

box.ondragover = () =>
    box.setAttribute("drag", true);

box.ondragleave = () =>
    box.removeAttribute("drag");


/* =========================
   OFFLINE STATUS
========================= */

if (typeof loadJSON === "function") {

    loadJSON("/versions", response => {

        const status =
            document.getElementById("offline-status");

        if (!response) {

            loadJSON(
                "https://cdn.emulatorjs.org/versions.json",
                resp => {
                    if (typeof loadVersions === "function")
                        loadVersions(resp);
                }
            );

            status.textContent =
                "Offline Status: NOT INSTALLED";

        } else {

            if (typeof loadVersions === "function")
                loadVersions(response);

            status.textContent =
                "Offline Status: READY";
        }
    });
}

if (typeof loadSettings === "function")
    loadSettings();

</script>

</body>
</html>
