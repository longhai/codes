<!DOCTYPE html>
<html>
<head>
    <title>EmulatorJS | Demo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
    <link rel="apple-touch-icon" href="img/icon.png">
    <meta name="theme-color" content="#000">
    <link rel="stylesheet" href="https://demo.emulatorjs.org/main.css">

    <style>
        #urlbox {
            display:flex;
            gap:6px;
            margin-top:10px;
            flex-wrap:wrap;
        }

        #rom-url {
            flex:1;
            min-width:220px;
            padding:8px;
        }

        #url-core {
            padding:8px;
        }

        #load-url {
            padding:8px 14px;
        }
    </style>
</head>

<body>

<div id="box">

    <input type="file" id="input">
    Drag ROM file or click here

    <div id="urlbox">
        <input
            type="url"
            id="rom-url"
            placeholder="https://example.com/game.nes"
        >

        <select id="url-core">
            <option value="auto">Auto</option>
            <option value="nes">NES</option>
            <option value="snes">SNES</option>
            <option value="n64">Nintendo 64</option>
            <option value="gb">Game Boy</option>
            <option value="gba">Game Boy Advance</option>
            <option value="nds">Nintendo DS</option>
            <option value="psx">PlayStation</option>
            <option value="segaMD">Mega Drive</option>
            <option value="segaMS">Master System</option>
            <option value="segaGG">Game Gear</option>
            <option value="segaCD">Sega CD</option>
            <option value="sega32x">Sega 32X</option>
            <option value="pce">PC Engine</option>
            <option value="ngp">Neo Geo Pocket</option>
            <option value="ws">WonderSwan</option>
            <option value="coleco">ColecoVision</option>
            <option value="arcade">Arcade</option>
            <option value="fbneo">FBNeo</option>
            <option value="mame2003_plus">MAME 2003 Plus</option>
            <option value="psp">PSP</option>
            <option value="dosbox_pure">DOS</option>
        </select>

        <button id="load-url">Load</button>
    </div>

</div>

<div id="version">
    <select id="version-select"></select>

    <button id="download" class="hide">
        Download
    </button>

    <button id="settings">
        ⚙
    </button>
</div>

<div id="popup-settings" class="popup popup-animate">
    <div class="content">

        <div class="title">
            <h1>Settings</h1>
        </div>

        <div class="options">

            <div class="buttonbox">
                <p>
                    Enable Debuging:
                    <label class="switch">
                        <input type="checkbox" id="debug">
                        <span class="slider round"></span>
                    </label>
                </p>
            </div>

            <br>

            <div class="buttonbox">
                <p>Clean Cache:</p>
                <button id="cache">Clean</button>
            </div>

            <br>

            <div class="buttonbox">
                <p>Language:</p>
                <select id="language">
                    <option value="auto">Auto</option>
                    <option value="en">English</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="pt">Português</option>
                    <option value="es">Español</option>
                    <option value="ja">日本語</option>
                    <option value="zh">中文</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="ru">Русский</option>
                </select>
                <p id="languageHelp"></p>
            </div>

            <br>

            <div class="buttonbox">
                <p>Custom Path:</p>
                <input
                    type="text"
                    id="customPath"
                    placeholder="https://cdn.emulatorjs.org/stable/"
                >
                <p id="customPathValid"></p>
            </div>

            <p id="offline-status">Offline Status: CHECKING</p>

            <p>Offline Cores will be available soon.</p>

            <div class="buttonbox" id="installbox">
                <p id="installboxtext">Install PWA:</p>
                <button id="install">Install</button>
            </div>

            <br>

        </div>

        <div class="bottom">
            <button id="settings-close">Close</button>
        </div>

    </div>
</div>

<div class="popup-overlay"></div>

<script src="https://demo.emulatorjs.org/main.js"></script>

<script>
/* =========================
   PWA
========================= */

(function () {

    const manifest = {
        name: "EmulatorJS",
        short_name: "EmulatorJS",
        start_url: location.href.split("?")[0],
        display: "standalone",
        background_color: "#000000",
        theme_color: "#000000",
        icons: [
            {
                src: "img/icon.png",
                sizes: "192x192",
                type: "image/png"
            },
            {
                src: "img/icon.png",
                sizes: "512x512",
                type: "image/png"
            }
        ]
    };

    const blob = new Blob(
        [JSON.stringify(manifest)],
        { type: "application/manifest+json" }
    );

    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);

})();


let installPrompt = null;

const installButton = document.getElementById("install");
const installBox = document.getElementById("installbox");

function isInstalled() {
    return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true ||
        localStorage.getItem("pwa_installed") === "true"
    );
}

function updateInstallUI() {

    if (isInstalled()) {
        installBox.style.display = "none";
        return;
    }

    installBox.style.display = "";
}

updateInstallUI();

window.addEventListener("beforeinstallprompt", event => {

    if (isInstalled()) {
        return;
    }

    event.preventDefault();
    installPrompt = event;

    installButton.textContent = "Install";
    installButton.disabled = false;

});

installButton.addEventListener("click", async () => {

    if (!installPrompt) return;

    await installPrompt.prompt();

    const result = await installPrompt.userChoice;

    if (result.outcome === "accepted") {
        localStorage.setItem("pwa_installed", "true");
        installPrompt = null;
        updateInstallUI();
    }

});

window.addEventListener("appinstalled", () => {

    localStorage.setItem("pwa_installed", "true");

    installPrompt = null;

    updateInstallUI();

});


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {

    /*
       Không intercept fetch.
       Vì vậy không can thiệp FPS của EmulatorJS.
    */

    const sw = `
        self.addEventListener("install", e => {
            self.skipWaiting();
        });

        self.addEventListener("activate", e => {
            e.waitUntil(self.clients.claim());
        });
    `;

    try {

        const blob = new Blob(
            [sw],
            { type: "application/javascript" }
        );

        const url = URL.createObjectURL(blob);

        navigator.serviceWorker.register(url).catch(() => {});

    } catch (e) {}

}


/* =========================
   SETTINGS
========================= */

loadJSON("/versions", response => {

    const offlineStatus =
        document.getElementById("offline-status");

    if (!response) {

        loadJSON(
            "https://cdn.emulatorjs.org/versions.json",
            resp => loadVersions(resp)
        );

        offlineStatus.textContent =
            "Offline Status: NOT INSTALLED";

    } else {

        loadVersions(response);

        offlineStatus.textContent =
            "Offline Status: READY";
    }

});

loadSettings();


/* =========================
   CORE DETECTION
========================= */

function detectCore(ext) {

    ext = ext.toLowerCase();

    const map = {

        fds: "nes",
        nes: "nes",
        unif: "nes",
        unf: "nes",

        smc: "snes",
        fig: "snes",
        sfc: "snes",
        gd3: "snes",
        gd7: "snes",
        dx2: "snes",
        bsx: "snes",
        swc: "snes",

        z64: "n64",
        n64: "n64",

        pce: "pce",

        ngp: "ngp",
        ngc: "ngp",

        ws: "ws",
        wsc: "ws",

        col: "coleco",
        cv: "coleco",

        d64: "vice_x64",

        nds: "nds",
        gba: "gba",
        gb: "gb",

        smd: "segaMD",
        gen: "segaMD",
        md: "segaMD",

        sms: "segaMS",
        gg: "segaGG",

        cue: "psx",
        bin: "psx",
        iso: "psx",
        chd: "psx",
        pbp: "psx"
    };

    return map[ext] || null;
}


/* =========================
   LOAD GAME
========================= */

async function loadGame(url, core, name) {

    if (!url) return;

    if (!core || core === "auto") {

        const clean = url.split("?")[0].split("#")[0];

        const ext =
            clean.split(".").pop().toLowerCase();

        core = detectCore(ext);
    }

    if (!core) {

        core = await new Promise(resolve => {

            const cores = {
                "Nintendo 64": "n64",
                "Nintendo Game Boy": "gb",
                "Nintendo Game Boy Advance": "gba",
                "Nintendo DS": "nds",
                "Nintendo Entertainment System": "nes",
                "Super Nintendo Entertainment System": "snes",
                "PlayStation": "psx",
                "Virtual Boy": "vb",
                "Sega Mega Drive": "segaMD",
                "Sega Master System": "segaMS",
                "Sega CD": "segaCD",
                "Atari Lynx": "lynx",
                "Sega 32X": "sega32x",
                "Atari Jaguar": "jaguar",
                "Sega Game Gear": "segaGG",
                "Sega Saturn": "segaSaturn",
                "Atari 7800": "atari7800",
                "Atari 2600": "atari2600",
                "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                "NEC PC-FX": "pcfx",
                "SNK NeoGeo Pocket (Color)": "ngp",
                "Bandai WonderSwan (Color)": "ws",
                "ColecoVision": "coleco",
                "Commodore 64": "vice_x64",
                "Commodore 128": "vice_x128",
                "Commodore VIC20": "vice_xvic",
                "Commodore Plus/4": "vice_xplus4",
                "Commodore PET": "vice_xpet",
                "PlayStation Portable": "psp",
                "3DS": "azahar",
                "DOS": "dosbox_pure",
                "Arcade": "arcade",
                "FBNeo": "fbneo",
                "MAME 2003 Plus": "mame2003_plus"
            };

            const select = document.createElement("select");
            const button = document.createElement("button");

            for (const type in cores) {

                const option =
                    document.createElement("option");

                option.value = cores[type];
                option.textContent = type;

                select.appendChild(option);
            }

            button.textContent = "Load game";

            box.innerHTML = "";
            box.appendChild(select);
            box.appendChild(button);

            button.onclick = () =>
                resolve(select.value);
        });

    }

    const display = document.createElement("div");
    const game = document.createElement("div");
    const script = document.createElement("script");

    display.id = "display";
    game.id = "game";

    const top =
        document.getElementById("top");

    const version =
        document.getElementById("version");

    if (top) top.remove();
    if (version) version.remove();
    if (box) box.remove();

    display.appendChild(game);
    document.body.appendChild(display);


    /*
       QUAN TRỌNG:

       Đây giữ nguyên cách EmulatorJS Demo
       khởi tạo để tránh ảnh hưởng FPS.
    */

    const cdn =
        window.cdn ||
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_player = "#game";

    window.EJS_gameName =
        name || "Game";

    window.EJS_biosUrl = "";

    window.EJS_gameUrl = url;

    window.EJS_core = core;

    window.EJS_pathtodata = cdn;

    window.EJS_startOnLoaded = true;

    window.EJS_DEBUG_XX =
        window.debug;


    /*
       LANGUAGE

       Phải đặt trước loader.js.
    */

    const language =
        localStorage.getItem("language") ||
        document.getElementById("language").value ||
        "auto";

    if (language !== "auto") {
        window.EJS_language = language;
    }


    /*
       Threads giống code Demo gốc.
    */

    if (
        core === "psp" ||
        core === "dosbox_pure" ||
        core === "azahar"
    ) {
        window.EJS_threads = true;
    }


    script.src = cdn + "loader.js";

    document.body.appendChild(script);

}


/* =========================
   FILE ROM
========================= */

input.addEventListener("change", async () => {

    if (!input.files.length) return;

    const file = input.files[0];

    const parts =
        file.name.split(".");

    const name =
        parts.slice(0, -1).join(".") ||
        file.name;

    let core =
        detectCore(parts.pop());

    if (!core) core = "auto";

    loadGame(file, core, name);

});


/* =========================
   URL ROM
========================= */

const urlInput =
    document.getElementById("rom-url");

const urlCore =
    document.getElementById("url-core");

const urlButton =
    document.getElementById("load-url");


urlButton.addEventListener("click", () => {

    const url =
        urlInput.value.trim();

    if (!url) return;

    let core =
        urlCore.value;

    const name =
        decodeURIComponent(
            url
                .split("?")[0]
                .split("#")[0]
                .split("/")
                .pop() || "Game"
        );

    loadGame(url, core, name);

});


urlInput.addEventListener("keydown", e => {

    if (e.key === "Enter") {
        urlButton.click();
    }

});


/* =========================
   BROWSER URL
========================= */

(function () {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const rom =
        params.get("rom");

    const core =
        params.get("core") || "auto";

    if (!rom) return;

    const name =
        params.get("name") ||
        decodeURIComponent(
            rom
                .split("?")[0]
                .split("#")[0]
                .split("/")
                .pop() || "Game"
        );

    loadGame(
        rom,
        core,
        name
    );

})();


/* =========================
   DRAG
========================= */

box.ondragover = () =>
    box.setAttribute("drag", true);

box.ondragleave = () =>
    box.removeAttribute("drag");


/* =========================
   LANGUAGE
========================= */

const languageSelect =
    document.getElementById("language");

const savedLanguage =
    localStorage.getItem("language");

if (savedLanguage) {
    languageSelect.value = savedLanguage;
}

languageSelect.addEventListener("change", () => {

    localStorage.setItem(
        "language",
        languageSelect.value
    );

    /*
       EmulatorJS đã chạy thì language
       không thể đổi giữa game.

       Reload để loader.js đọc language mới.
    */

    location.reload();

});


/* =========================
   SETTINGS / DISPLAY
========================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            window.matchMedia(
                "(display-mode: standalone)"
            ).matches
        ) {
            updateInstallUI();
        }

    }
);

</script>

</body>
</html>
