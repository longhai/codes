<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cài đặt Ứng dụng</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'><path fill='%231AAFFF' d='M174.336 768l-119.168 119.168a42.667 42.667 0 0 0 60.331 60.331L234.667 828.33l119.168 119.168a42.667 42.667 0 0 0 60.331-60.331L295 768l119.168-119.168a42.667 42.667 0 0 0-60.331-60.331L234.667 707.669l-119.168-119.168a42.667 42.667 0 0 0-60.331 60.331L174.336 768zM768 469.333c-117.824 0-213.333-95.509-213.333-213.333S650.176 42.667 768 42.667s213.333 95.509 213.333 213.333-95.509 213.333-213.333 213.333zm0-85.333a128 128 0 1 0 0-256 128 128 0 0 0 0 256zM554.667 661.547c0-59.093 47.68-106.88 106.88-106.88h212.907c59.093 0 106.88 47.68 106.88 106.88v212.907c0 59.093-47.68 106.88-106.88 106.88h-212.907A106.731 106.731 0 0 1 554.667 874.453v-212.906zm85.333 0v212.906c0 12.032 9.536 21.547 21.547 21.547h212.907c12.032 0 21.547-9.536 21.547-21.547v-212.906c0-12.032-9.536-21.547-21.547-21.547h-212.907c-12.032 0-21.547 9.536-21.547 21.547zM183.829 109.888c36.118-61.163 108.246-61.248 144.427 0l126.208 213.653c35.733 60.523 3.52 124.437-66.816 124.437H124.437c-70.613 0-102.635-63.765-66.816-124.437L183.829 109.91zM133.653 362.667h244.8l-122.41-207.232-122.39 207.232z'/></svg>">
    <style>
        :root{--pri:#1AAFFF;--bg:#0d0e12;--c-bg:#333;--c-bd:#555;--txt:#f0f0f0}
        @media(prefers-color-scheme:light){:root{--pri:#0088cc;--bg:#f4f6f9;--c-bg:#fff;--c-bd:#d0d5dd;--txt:#1a1d20}}
        *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
        body{background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .card{background:var(--c-bg);border:1px solid var(--c-bd);border-radius:12px;width:100%;max-width:420px;padding:24px;box-shadow:0 10px 25px #0003}
        h1{font-size:1.25rem;margin-bottom:20px;border-bottom:1px solid var(--c-bd);padding-bottom:10px}
        .buttonbox{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.95rem}
        button{background:var(--c-bg);border:1px solid var(--c-bd);color:var(--txt);padding:8px 16px;border-radius:6px;font-size:.9rem;cursor:pointer;transition:.2s}
        button:hover:not(:disabled){background:var(--pri);border-color:var(--pri);color:#fff}
        button:disabled{opacity:.5;cursor:not-allowed}
        #pwa-msg{font-size:12px;color:#f44336;margin-top:8px;text-align:right}
    </style>
</head>
<body>

<div class="card">
    <h1>Cài đặt Ứng dụng</h1>
    <div class="buttonbox">
        <span>Cài đặt PWA:</span>
        <button id="install" disabled>Cài đặt</button>
    </div>
    <div id="pwa-msg"></div>
</div>

<script>
    const $ = id => document.getElementById(id);
    let promptEvt;

    const checkPwa = () => {
        const isApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone || localStorage.pwa_installed;
        $("install").textContent = isApp ? "Đã cài đặt" : "Cài đặt";
        $("install").disabled = isApp || !promptEvt;
    };

    window.onbeforeinstallprompt = e => {
        e.preventDefault();
        promptEvt = e;
        delete localStorage.pwa_installed;
        checkPwa();
    };

    window.onappinstalled = () => {
        localStorage.pwa_installed = "true";
        promptEvt = null;
        checkPwa();
    };

    // Tạo Manifest & Register SW bằng Blob URL
    try {
        const svgIcon = document.querySelector('link[rel="icon"]').href;
        const manifest = { name: "WebApp", start_url: location.href, display: "standalone", icons: [{ src: svgIcon, sizes: "512x512", type: "image/svg+xml" }] };
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/json" }));
        document.head.appendChild(link);

        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            const sw = "self.oninstall=()=>self.skipWaiting();self.onactivate=()=>self.clients.claim();self.onfetch=e=>e.respondWith(fetch(e.request));";
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], { type: "text/javascript" })));
        }
    } catch(e){}
    checkPwa();

    $("install").onclick = async () => {
        if (!promptEvt) return $("pwa-msg").textContent = "PWA yêu cầu môi trường HTTPS hoặc localhost.";
        try {
            promptEvt.prompt();
            if ((await promptEvt.userChoice)?.outcome === 'accepted') {
                localStorage.pwa_installed = "true";
                promptEvt = null;
                checkPwa();
            }
        } catch (e) { $("pwa-msg").textContent = "Lỗi PWA: " + e.message; }
    };
</script>

</body>
</html>
