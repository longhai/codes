<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'><path fill='%231AAFFF' d='M174.336 768l-119.168 119.168a42.667 42.667 0 0 0 60.331 60.331L234.667 828.33l119.168 119.168a42.667 42.667 0 0 0 60.331-60.331L295 768l119.168-119.168a42.667 42.667 0 0 0-60.331-60.331L234.667 707.669l-119.168-119.168a42.667 42.667 0 0 0-60.331 60.331L174.336 768zM768 469.333c-117.824 0-213.333-95.509-213.333-213.333S650.176 42.667 768 42.667s213.333 95.509 213.333 213.333-95.509 213.333-213.333 213.333zm0-85.333a128 128 0 1 0 0-256 128 128 0 0 0 0 256zM554.667 661.547c0-59.093 47.68-106.88 106.88-106.88h212.907c59.093 0 106.88 47.68 106.88 106.88v212.907c0 59.093-47.68 106.88-106.88 106.88h-212.907A106.731 106.731 0 0 1 554.667 874.453v-212.906zm85.333 0v212.906c0 12.032 9.536 21.547 21.547 21.547h212.907c12.032 0 21.547-9.536 21.547-21.547v-212.906c0-12.032-9.536-21.547-21.547-21.547h-212.907c-12.032 0-21.547 9.536-21.547 21.547zM183.829 109.888c36.118-61.163 108.246-61.248 144.427 0l126.208 213.653c35.733 60.523 3.52 124.437-66.816 124.437H124.437c-70.613 0-102.635-63.765-66.816-124.437L183.829 109.91zM133.653 362.667h244.8l-122.41-207.232-122.39 207.232z'/></svg>">
    <style>
        :root {
            --primary: #1AAFFF;
            --bg-color: #0d0e12;
            --card-bg: #333;
            --card-border: #555;
            --text-color: #f0f0f0;
            --text-sub: #a0a5b5;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --primary: #0088cc;
                --bg-color: #f4f6f9;
                --card-bg: #fff;
                --card-border: #d0d5dd;
                --text-color: #1a1d20;
                --text-sub: #667085;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 24px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }
        button {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: .9rem;
            cursor: pointer;
            outline: 0;
            margin-top: 12px;
            transition: .2s;
        }
        button:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }
        #pwa-status-msg { font-size: 12px; color: #f44336; margin-top: 4px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="label-pwa">Cài đặt PWA:</h2>
        <button id="install"></button>
        <div id="pwa-status-msg"></div>
    </div>

    <script>
        const $ = i => document.getElementById(i),
        i18n = {
            vi: { pwa: "Cài đặt PWA:", inst: "Cài đặt", installed: "Đã cài đặt" },
            en: { pwa: "PWA Setup:", inst: "Install", installed: "Installed" }
        };

        let installPrompt = null;
        window.language = localStorage.getItem("language") || "auto";

        function updateUiLang(l) {
            const d = (l === "vi" || (l === "auto" && navigator.language.startsWith("vi"))) ? i18n.vi : i18n.en;
            if ($("label-pwa")) $("label-pwa").textContent = d.pwa;
            checkPwa();
        }

        function checkPwa() {
            const isVi = (window.language === "vi" || (window.language === "auto" && navigator.language.startsWith("vi"))),
                  st = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone,
                  mk = localStorage.getItem("pwa_installed") === "true";
            $("install").textContent = (st || (mk && !installPrompt)) ? (isVi ? i18n.vi.installed : i18n.en.installed) : (isVi ? i18n.vi.inst : i18n.en.inst);
            $("install").disabled = st || (mk && !installPrompt) || !installPrompt;
        }

        window.addEventListener("beforeinstallprompt", e => {
            e.preventDefault();
            installPrompt = e;
            localStorage.removeItem("pwa_installed");
            checkPwa();
        });

        window.addEventListener("appinstalled", () => {
            localStorage.setItem("pwa_installed", "true");
            installPrompt = null;
            checkPwa();
        });

        (() => {
            try {
                const m = {
                    name: "Web Application",
                    short_name: "WebApp",
                    start_url: location.href,
                    display: "standalone",
                    background_color: "#0d0e12",
                    theme_color: "#1AAFFF",
                    icons: [{
                        src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'><path fill='%231AAFFF' d='M174.336 768l-119.168 119.168a42.667 42.667 0 0 0 60.331 60.331L234.667 828.33l119.168 119.168a42.667 42.667 0 0 0 60.331-60.331L295 768l119.168-119.168a42.667 42.667 0 0 0-60.331-60.331L234.667 707.669l-119.168-119.168a42.667 42.667 0 0 0-60.331 60.331L174.336 768zM768 469.333c-117.824 0-213.333-95.509-213.333-213.333S650.176 42.667 768 42.667s213.333 95.509 213.333 213.333-95.509 213.333-213.333 213.333zm0-85.333a128 128 0 1 0 0-256 128 128 0 0 0 0 256zM554.667 661.547c0-59.093 47.68-106.88 106.88-106.88h212.907c59.093 0 106.88 47.68 106.88 106.88v212.907c0 59.093-47.68 106.88-106.88 106.88h-212.907A106.731 106.731 0 0 1 554.667 874.453v-212.906zm85.333 0v212.906c0 12.032 9.536 21.547 21.547 21.547h212.907c12.032 0 21.547-9.536 21.547-21.547v-212.906c0-12.032-9.536-21.547-21.547-21.547h-212.907c-12.032 0-21.547 9.536-21.547 21.547zM183.829 109.888c36.118-61.163 108.246-61.248 144.427 0l126.208 213.653c35.733 60.523 3.52 124.437-66.816 124.437H124.437c-70.613 0-102.635-63.765-66.816-124.437L183.829 109.91zM133.653 362.667h244.8l-122.41-207.232-122.39 207.232z'/></svg>",
                        sizes: "192x192 512x512",
                        type: "image/svg+xml"
                    }]
                }, l = document.createElement("link");
                l.rel = "manifest";
                l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/json" }));
                document.head.appendChild(l);

                if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
                    navigator.serviceWorker.register(URL.createObjectURL(new Blob(["self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)));"], { type: "application/javascript" }))).catch(() => {});
                }
            } catch (e) {}
            checkPwa();
        })();

        $("install").onclick = async () => {
            if (installPrompt) {
                try {
                    installPrompt.prompt();
                    if ((await installPrompt.userChoice)?.outcome === 'accepted') {
                        localStorage.setItem("pwa_installed", "true");
                        installPrompt = null;
                        checkPwa();
                    }
                } catch (e) {
                    $("pwa-status-msg").textContent = "Lỗi PWA: " + e.message;
                }
            } else {
                $("pwa-status-msg").textContent = (window.language === "en" || (window.language === "auto" && !navigator.language.startsWith("vi"))) ? "PWA requires HTTPS or localhost." : "PWA yêu cầu môi trường HTTPS/localhost.";
            }
        };

        // Khởi chạy kiểm tra giao diện ban đầu đúng thời điểm như gốc
        updateUiLang(window.language);
    </script>
</body>
</html>
