<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chơi game Flash</title>
<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<style>
	:root{
		--bg:#111318; --card:#1c1c1e; --text:#f2f2f7;
		--muted:#9a9aa2; --accent:#ff9f0a; --key-bg:rgba(44,44,46,.88); --key-pressed:rgba(180,180,180,.55);
	}
	*{box-sizing:border-box;}
	html,body{height:100%;}
	body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Arial,sans-serif;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;}
	/* --- Sân game chiếm toàn màn hình --- */
	#stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;}
	#player-holder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
	#player-holder > *{width:100% !important;height:100% !important;}
	#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:88vw;text-align:center;color:var(--muted);font-size:15px;line-height:1.55;background:rgba(0,0,0,.55);padding:16px 18px;border-radius:16px;z-index:2;}
	#status b{color:var(--text);}
	#status .big-btn{display:inline-block;margin-top:12px;border:0;border-radius:999px;background:var(--accent);color:#111;font:inherit;font-size:15px;font-weight:700;padding:12px 22px;cursor:pointer;}
	/* --- Nút menu nổi duy nhất trên màn hình chơi --- */
	#fabMenu{position:fixed;top:5%;left:93%;transform:translate(-50%,-50%);z-index:40;width:36px;height:36px;border:0;border-radius:50%;background:rgba(44,44,46,.6);color:var(--text);font-size:20px;line-height:1;cursor:grab;touch-action:none;}
	/* --- Lớp phím ảo nổi --- */
	#padOverlay{position:fixed;inset:0;z-index:10;pointer-events:none;}
	body.editing #padOverlay{background:rgba(0,0,0,.25);}
	body.editing #stage{filter:brightness(.75);}
	.vkey{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;border-radius:12px;background:var(--key-bg);color:var(--text);font:inherit;font-size:15px;font-weight:600;width:42px;height:42px;padding:0 4px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.35);touch-action:none;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
	.vkey.pressed{background:var(--key-pressed);box-shadow:none;}
	.vkey.txt{font-size:11.5px;}
	body.editing .vkey{outline:2px dashed rgba(255,255,255,.65);outline-offset:2px;cursor:grab;}
	body.editing .vkey.selected{outline:3px solid #0a84ff;outline-offset:2px;}
	/* --- Bảng trượt dưới (dùng chung cho Menu và Chỉnh phím) --- */
	#sheetOverlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;}
	#sheetOverlay.show{display:block;}
	.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s ease;max-height:70dvh;overflow-y:auto;visibility:hidden;}
	.sheet.show{transform:translateY(0);visibility:visible;}
	.sheet .handle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:2px auto 8px;}
	.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(255,255,255,.08);font-size:15px;}
	.set-row .lbl{flex:1;}
	.set-row input[type="checkbox"]{width:22px;height:22px;accent-color:var(--accent);}
	.set-row input[type="range"]{flex:1;accent-color:var(--accent);}
	.set-row .val{width:44px;text-align:right;color:var(--muted);font-size:13px;}
	.set-btn{border:0;border-radius:10px;background:#2c2c2e;color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:11px 14px;cursor:pointer;}
	.set-btn.primary{background:var(--accent);color:#111;font-weight:700;}
	.set-btn.block{display:block;width:100%;padding:11px;margin-top:8px;font-size:14px;}
	.set-btn.slim{padding:9px;font-size:14px;}
	.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
	.btn-grid .set-btn{margin-top:0;}
	.link-row{display:flex;gap:8px;margin-top:8px;}
	.link-row input{flex:1;min-width:0;background:#111;color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:10px;font:inherit;font-size:14px;padding:11px 12px;}
	/* --- Bảng Chỉnh phím --- */
	#editSheet{z-index:60;}
	#editSheet.dragging{transform:translateY(105%);}
	#editSheet.collapsed .tool-row,#editSheet.collapsed #chipRow{display:none;}
	.edit-head{display:flex;align-items:center;gap:8px;}
	.edit-head .lbl{flex:1;text-align:center;font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
	.edit-head .lbl b{color:var(--text);}
	.tool-row{display:flex;gap:6px;margin-top:12px;}
	.tool-row button{flex:1;border:0;border-radius:9px;font:inherit;font-size:13px;font-weight:700;padding:11px 4px;cursor:pointer;color:#fff;}
	.tool-row button:disabled{opacity:.35;}
	.tool-row .t-big{background:#22c55e;}
	.tool-row .t-small{background:#ef4444;}
	.tool-row .t-reset{background:#6b7280;}
	.tool-row .t-del{background:#16a34a;}
	#chipRow{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch;}
	.chip-key{flex:0 0 auto;border:0;border-radius:9px;background:#3a3a3c;color:var(--text);font:inherit;font-size:14px;font-weight:600;min-width:38px;height:38px;padding:0 9px;cursor:pointer;}
	.chip-key.on{background:var(--accent);color:#111;}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
	<main id="stage">
		<div id="player-holder"></div>
		<div id="status">Đang nạp trình Flash (Ruffle)…</div>
	</main>

	<!-- Lớp phím ảo nổi -->
	<div id="padOverlay" aria-label="Phím ảo"></div>

	<!-- Nút menu nổi duy nhất -->
	<button type="button" id="fabMenu" aria-label="Menu">⋯</button>

	<div id="sheetOverlay"></div>

	<!-- Bảng Menu: mọi thao tác gói trong 1 bảng -->
	<section class="sheet" id="menuSheet" aria-label="Menu">
		<div class="handle"></div>
		<div class="btn-grid">
			<button type="button" class="set-btn" id="mOpen">📂 Mở file</button>
			<button type="button" class="set-btn" id="btnFs">⛶ Toàn màn hình</button>
		</div>
		<div class="link-row">
			<input id="linkInput" type="url" placeholder="Dán link file .swf" inputmode="url">
			<button type="button" class="set-btn primary" id="btnLoadLink">Tải</button>
		</div>
		<div class="set-row"><span class="lbl">Hiện bàn phím ảo</span><input type="checkbox" id="setShowPad"></div>
		<div class="set-row"><span class="lbl">Độ mờ phím</span><input type="range" id="setOpacity" min="35" max="100" step="5"><span class="val" id="opacityVal"></span></div>
		<button type="button" class="set-btn primary block" id="btnEditLayout">⚙ Chỉnh phím</button>
		<button type="button" class="set-btn block slim" id="btnCloseMenu">Đóng</button>
	</section>

	<!-- Bảng Chỉnh phím: công cụ + thêm phím trong cùng 1 bảng -->
	<section class="sheet" id="editSheet" aria-label="Chỉnh phím">
		<div class="handle"></div>
		<div class="edit-head">
			<button type="button" class="set-btn" id="btnCancelEdit">Hủy</button>
			<span class="lbl" id="selKeyLabel">Chạm 1 phím trên màn hình để chọn</span>
			<button type="button" class="set-btn" id="btnCollapseEdit" title="Thu gọn / mở rộng bảng">˅</button>
			<button type="button" class="set-btn primary" id="btnSaveLayout">Lưu</button>
		</div>
		<div class="tool-row">
			<button type="button" class="t-big" id="toolBig">Phóng to</button>
			<button type="button" class="t-small" id="toolSmall">Thu nhỏ</button>
			<button type="button" class="t-reset" id="toolReset">Đặt lại</button>
			<button type="button" class="t-del" id="toolDel">Xóa</button>
		</div>
		<div id="chipRow"></div>
	</section>

	<input id="fileInput" type="file" accept=".swf" style="display:none">

<script>
'use strict';
/* Trang chơi Flash bằng Ruffle (cùng công nghệ trang yikm đang dùng).
   Nguồn game: ?swf= trên URL -> game nhúng sẵn (nếu có) -> file gold_miner.swf cùng thư mục -> mở file / dán link tay. */
var DEFAULT_SWFS = [
	'gold_miner.swf'
];
var holder = document.getElementById('player-holder');
var statusBox = document.getElementById('status');
var player = null;

window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
	autoplay: 'on',
	splashScreen: false,
	letterbox: 'on',
	backgroundColor: '#000000'
};

function setStatus(html) {
	if (html) { statusBox.innerHTML = html; statusBox.style.display = ''; }
	else statusBox.style.display = 'none';
}
function qs(name) {
	var m = new RegExp('(?:^|&)' + name + '=([^&]*)').exec(location.search.substring(1));
	if (!m) return '';
	try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return m[1]; }
}
function ensurePlayer() {
	if (player) return player;
	if (!window.RufflePlayer || !window.RufflePlayer.newest) return null;
	player = window.RufflePlayer.newest().createPlayer();
	player.style.width = '100%';
	player.style.height = '100%';
	holder.appendChild(player);
	return player;
}
function loadByUrl(url, label) {
	var p = ensurePlayer();
	if (!p) { setStatus('Chưa nạp được Ruffle. Kiểm tra mạng rồi tải lại trang.'); return; }
	if (label) setStatus('Đang tải game…');
	var done = false;
	try {
		var pr = p.load({ url: url });
		if (pr && typeof pr.then === 'function') {
			pr.then(function () { done = true; setStatus(''); })
			  .catch(function () { if (!done) loadFailed(url); });
		}
		setTimeout(function () { if (!done) setStatus(''); }, 6000);
	} catch (e) { loadFailed(url); }
}
function loadFailed(url) {
	setStatus('<b>Không tải được file game từ link này.</b><br>' +
		'Có thể máy chủ của link chặn nhúng ngoài (CORS) hoặc link đã hỏng.<br>' +
		'Bạn bấm <b>Mở file .swf</b> để chọn file trên máy, hoặc <b>Dán link</b> thử link khác.' +
		'<br><button type="button" class="big-btn" id="stOpen">Mở file .swf</button>');
	var b = document.getElementById('stOpen');
	if (b) b.addEventListener('click', openFileDialog);
}
function loadByFile(file) {
	if (!file) return;
	var p = ensurePlayer();
	if (!p) { setStatus('Chưa nạp được Ruffle. Kiểm tra mạng rồi tải lại trang.'); return; }
	setStatus('Đang đọc file…');
	file.arrayBuffer().then(function (buf) {
		return p.load({ data: new Uint8Array(buf) });
	}).then(function () { setStatus(''); })
	  .catch(function () { loadFailed(''); });
}
function loadByData(buf, label) {
	var p = ensurePlayer();
	if (!p) { setStatus('Chưa nạp được Ruffle. Kiểm tra mạng rồi tải lại trang.'); return Promise.resolve(false); }
	return p.load({ data: new Uint8Array(buf) }).then(function () { setStatus(''); return true; });
}
/* Tự tải file game về dạng dữ liệu rồi nạp — đúng cơ chế "Mở file" đã chạy được,
   tránh để Ruffle tự lấy link chéo máy chủ (dễ bị chặn). */
function tryDefault(index) {
	if (index >= DEFAULT_SWFS.length) { loadFailed(''); return; }
	var url = DEFAULT_SWFS[index];
	setStatus('Đang tải game Đào vàng…');
	fetch(url).then(function (r) {
		if (!r.ok) throw new Error('http');
		return r.arrayBuffer();
	}).then(function (buf) {
		var b = new Uint8Array(buf);
		var magic = String.fromCharCode(b[0], b[1], b[2]);
		if (magic !== 'FWS' && magic !== 'CWS' && magic !== 'ZWS') throw new Error('not-swf');
		return loadByData(buf, '⛏️ Đào vàng (Flash)');
	}).then(function (ok) {
		if (ok === false) throw new Error('player');
	}).catch(function () { tryDefault(index + 1); });
}
/* --- Game nhúng sẵn trong file trang (nếu có) --- */
function loadEmbedded() {
	setStatus('Đang nạp game Đào vàng…');
	try {
		var bin = atob(window.EMBEDDED_SWF_B64);
		var bytes = new Uint8Array(bin.length);
		for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
		loadByData(bytes.buffer, '⛏️ Đào vàng (Flash)')
			.then(function (ok) { if (!ok) tryDefault(0); })
			.catch(function () { tryDefault(0); });
	} catch (e) { tryDefault(0); }
}

/* --- Mở file / kéo thả file .swf (không chạy khi đang chỉnh phím) --- */
var fileInput = document.getElementById('fileInput');
function openFileDialog() { fileInput.click(); }
fileInput.addEventListener('change', function () { loadByFile(fileInput.files[0]); fileInput.value = ''; });
document.addEventListener('dragover', function (e) { e.preventDefault(); });
document.addEventListener('drop', function (e) {
	e.preventDefault();
	if (document.body.classList.contains('editing')) return;
	if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) loadByFile(e.dataTransfer.files[0]);
});

/* ============ PHÍM ẢO NỔI — KÉO THẢ TỰ DO ============ */
var KEY_CATALOG = [
	{ id: 'left',  label: '◀', key: 'ArrowLeft',  code: 'ArrowLeft',  keycode: 37 },
	{ id: 'up',    label: '▲', key: 'ArrowUp',    code: 'ArrowUp',    keycode: 38 },
	{ id: 'right', label: '▶', key: 'ArrowRight', code: 'ArrowRight', keycode: 39 },
	{ id: 'down',  label: '▼', key: 'ArrowDown', code: 'ArrowDown', keycode: 40 },
	{ id: 'space', label: 'Space', key: ' ', code: 'Space', keycode: 32 },
	{ id: 'enter', label: 'Enter', key: 'Enter', code: 'Enter', keycode: 13 },
	{ id: 'pause', label: 'P', key: 'p', code: 'KeyP', keycode: 80 }
];
(function buildCatalog() {
	var i, ch;
	for (i = 0; i < 26; i++) { ch = String.fromCharCode(65 + i); KEY_CATALOG.push({ id: 'k' + ch, label: ch, key: ch.toLowerCase(), code: 'Key' + ch, keycode: 65 + i }); }
	for (i = 0; i <= 9; i++) KEY_CATALOG.push({ id: 'd' + i, label: String(i), key: String(i), code: 'Digit' + i, keycode: 48 + i });
	KEY_CATALOG.push({ id: 'shift', label: 'Shift', key: 'Shift', code: 'ShiftLeft', keycode: 16 });
	KEY_CATALOG.push({ id: 'ctrl', label: 'Ctrl', key: 'Control', code: 'ControlLeft', keycode: 17 });
	KEY_CATALOG.push({ id: 'alt', label: 'Alt', key: 'Alt', code: 'AltLeft', keycode: 18 });
	KEY_CATALOG.push({ id: 'esc', label: 'Esc', key: 'Escape', code: 'Escape', keycode: 27 });
	KEY_CATALOG.push({ id: 'tab', label: 'Tab', key: 'Tab', code: 'Tab', keycode: 9 });
	KEY_CATALOG.push({ id: 'bsp', label: '⌫', key: 'Backspace', code: 'Backspace', keycode: 8 });
})();
function catalogById(id) {
	for (var i = 0; i < KEY_CATALOG.length; i++) if (KEY_CATALOG[i].id === id) return KEY_CATALOG[i];
	return null;
}
function defaultLayout() {
	/* Mặc định KHÔNG hiện phím nào: người chơi tự vào Menu → Chỉnh phím để chọn phím mình cần */
	return [];
}
function defaultFor(id) {
	return { id: id, x: 50, y: 40, s: 1 };
}

var LAYOUT_STORE = 'flash_vkey_layout_v5';
var OLD_STORE = 'flash_vkey_settings';
var padSettings = { showPad: true, opacity: 100 };
var padLayout = defaultLayout();

function loadPadState() {
	try {
		var raw = localStorage.getItem(LAYOUT_STORE);
		if (raw) {
			var s = JSON.parse(raw);
			if (s.layout) padLayout = s.layout;
			if (s.settings) padSettings = s.settings;
			return;
		}
	} catch (e) {}
	/* Lên v5: mặc định không còn phím nào — chỉ mang cài đặt cũ sang (độ mờ, hiện/ẩn),
	   KHÔNG mang bố cục/phím cũ sang */
	padLayout = [];
	try {
		var prev = JSON.parse(localStorage.getItem('flash_vkey_layout_v4') || 'null') ||
		           JSON.parse(localStorage.getItem('flash_vkey_layout_v3') || 'null');
		if (prev && prev.settings) padSettings = prev.settings;
		else {
			var old = JSON.parse(localStorage.getItem(OLD_STORE) || 'null');
			if (old) {
				if (typeof old.opacity === 'number') padSettings.opacity = old.opacity;
				if (old.showPad === false) padSettings.showPad = false;
			}
		}
	} catch (e) {}
}
function savePadState() {
	try { localStorage.setItem(LAYOUT_STORE, JSON.stringify({ layout: padLayout, settings: padSettings })); } catch (e) {}
}

/* --- Gửi sự kiện phím tới game --- */
function sendKey(type, def) {
	var targets = [];
	if (player) targets.push(player);
	if (document.activeElement) targets.push(document.activeElement);
	targets.push(document, window);
	for (var i = 0; i < targets.length; i++) {
		try {
			var ev = new KeyboardEvent(type, { key: def.key, code: def.code, bubbles: true, cancelable: true });
			try { Object.defineProperty(ev, 'keyCode', { get: function () { return def.keycode; } }); } catch (e) {}
			try { Object.defineProperty(ev, 'which', { get: function () { return def.keycode; } }); } catch (e) {}
			targets[i].dispatchEvent(ev);
		} catch (e) {}
	}
}

/* --- Dựng phím lên lớp nổi --- */
var padOverlay = document.getElementById('padOverlay');
var editSheet = document.getElementById('editSheet');
var editing = false;
var selectedId = null;

function placeKeyEl(btn, item) {
	btn.style.left = item.x + '%';
	btn.style.top = item.y + '%';
	var t = 'translate(-50%,-50%)';
	if (item.s && item.s !== 1) t += ' scale(' + item.s + ')';
	btn.style.transform = t;
}
/* Phím được kéo tới bất kỳ đâu kể cả đáy màn hình: trong lúc kéo, bảng Chỉnh phím
   tự trượt xuống cho khỏi che, thả tay ra bảng hiện lại — nên không cần khóa trần kéo nữa */
function renderPad() {
	padOverlay.innerHTML = '';
	padOverlay.style.display = padSettings.showPad ? '' : 'none';
	padLayout.forEach(function (item) {
		var def = catalogById(item.id);
		if (!def) return;
		var btn = document.createElement('button');
		btn.type = 'button';
		/* Mọi phím ĐỀU cùng 1 cỡ ô và 1 màu như phím máy tính thật — trang dùng chung cho mọi game */
		btn.className = 'vkey' + (def.label.length > 3 ? ' txt' : '');
		btn.textContent = def.label;
		btn.setAttribute('data-id', item.id);
		btn.style.opacity = String(padSettings.opacity / 100);
		if (editing && item.id === selectedId) btn.classList.add('selected');
		placeKeyEl(btn, item);
		attachKeyBehavior(btn, item, def);
		padOverlay.appendChild(btn);
	});
	if (editing) refreshChipMarks();
}
function attachKeyBehavior(btn, item, def) {
	var drag = null;
	btn.addEventListener('pointerdown', function (e) {
		e.preventDefault();
		if (editing) {
			selectKey(item.id);
			editSheet.classList.add('dragging');
			drag = { x0: e.clientX, y0: e.clientY, ix: item.x, iy: item.y, moved: false };
			try { btn.setPointerCapture(e.pointerId); } catch (err) {}
		} else {
			btn.classList.add('pressed');
			sendKey('keydown', def);
			if (navigator.vibrate) navigator.vibrate(8);
		}
	});
	btn.addEventListener('pointermove', function (e) {
		if (!editing || !drag) return;
		var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
		if (Math.abs(dx) + Math.abs(dy) > 10) drag.moved = true;
		if (drag.moved) {
			item.x = Math.min(97, Math.max(3, drag.ix + dx / window.innerWidth * 100));
			item.y = Math.min(97, Math.max(3, drag.iy + dy / window.innerHeight * 100));
			placeKeyEl(btn, item);
		}
	});
	function endDrag(e) {
		if (editing) {
			editSheet.classList.remove('dragging');
			drag = null;
		} else if (btn.classList.contains('pressed')) {
			btn.classList.remove('pressed');
			sendKey('keyup', def);
		}
	}
	btn.addEventListener('pointerup', endDrag);
	btn.addEventListener('pointercancel', endDrag);
	btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

/* --- Chọn phím: cập nhật hàng công cụ trong bảng Chỉnh phím --- */
var selKeyLabel = document.getElementById('selKeyLabel');
var toolBtns = [];
['toolBig', 'toolSmall', 'toolReset', 'toolDel'].forEach(function (id) {
	toolBtns.push(document.getElementById(id));
});
function keyEl(id) { return padOverlay.querySelector('.vkey[data-id="' + id + '"]'); }
function layoutItem(id) {
	for (var i = 0; i < padLayout.length; i++) if (padLayout[i].id === id) return padLayout[i];
	return null;
}
function selectKey(id) {
	selectedId = id;
	var all = padOverlay.querySelectorAll('.vkey');
	for (var i = 0; i < all.length; i++) all[i].classList.toggle('selected', all[i].getAttribute('data-id') === id);
	var def = id ? catalogById(id) : null;
	selKeyLabel.innerHTML = def ? 'Đang chọn: <b>' + def.label + '</b>' : 'Chạm 1 phím trên màn hình để chọn';
	toolBtns.forEach(function (b) { b.disabled = !id; });
}
function scaleSelected(delta) {
	var it = layoutItem(selectedId); if (!it) return;
	it.s = Math.min(1.8, Math.max(0.6, Math.round((it.s + delta) * 10) / 10));
	var el = keyEl(it.id); if (el) placeKeyEl(el, it);
}
document.getElementById('toolBig').addEventListener('click', function () { scaleSelected(0.1); });
document.getElementById('toolSmall').addEventListener('click', function () { scaleSelected(-0.1); });
document.getElementById('toolReset').addEventListener('click', function () {
	var it = layoutItem(selectedId); if (!it) return;
	var d = defaultFor(it.id);
	it.x = d.x; it.y = d.y; it.s = d.s;
	var el = keyEl(it.id); if (el) placeKeyEl(el, it);
});
document.getElementById('toolDel').addEventListener('click', function () {
	if (!selectedId) return;
	padLayout = padLayout.filter(function (k) { return k.id !== selectedId; });
	selectKey(null);
	renderPad();
});

/* --- Hàng phím thêm (1 hàng cuộn ngang duy nhất) --- */
var chipRow = document.getElementById('chipRow');
function buildChips() {
	chipRow.innerHTML = '';
	KEY_CATALOG.forEach(function (def) {
		var b = document.createElement('button');
		b.type = 'button';
		b.className = 'chip-key';
		b.textContent = def.label;
		b.setAttribute('data-chip', def.id);
		b.addEventListener('click', function () {
			if (layoutItem(def.id)) { selectKey(def.id); return; }
			padLayout.push({ id: def.id, x: 50, y: 40, s: 1 });
			renderPad();
			selectKey(def.id);
		});
		chipRow.appendChild(b);
	});
}
function refreshChipMarks() {
	var marks = chipRow.querySelectorAll('.chip-key');
	for (var i = 0; i < marks.length; i++) {
		marks[i].classList.toggle('on', !!layoutItem(marks[i].getAttribute('data-chip')));
	}
}

/* --- Bảng Menu --- */
var menuSheet = document.getElementById('menuSheet');
var overlay = document.getElementById('sheetOverlay');
var fabMenu = document.getElementById('fabMenu');
function openMenu() {
	document.getElementById('setShowPad').checked = !!padSettings.showPad;
	document.getElementById('setOpacity').value = padSettings.opacity;
	document.getElementById('opacityVal').textContent = padSettings.opacity + '%';
	menuSheet.classList.add('show'); overlay.classList.add('show');
}
function closeMenu() { menuSheet.classList.remove('show'); overlay.classList.remove('show'); }
/* Nút ⋯ cũng kéo đặt tùy ý chỗ nào cũng được, vị trí được nhớ lại */
var FAB_STORE = 'flash_fab_pos';
var fabPos = { x: 93, y: 5 };
try {
	var fp = JSON.parse(localStorage.getItem(FAB_STORE) || 'null');
	if (fp && typeof fp.x === 'number' && typeof fp.y === 'number') fabPos = fp;
} catch (e) {}
function applyFabPos() {
	fabMenu.style.left = fabPos.x + '%';
	fabMenu.style.top = fabPos.y + '%';
}
applyFabPos();
var fabDrag = null, fabMoved = false;
fabMenu.addEventListener('pointerdown', function (e) {
	fabDrag = { x0: e.clientX, y0: e.clientY, ix: fabPos.x, iy: fabPos.y };
	fabMoved = false;
	try { fabMenu.setPointerCapture(e.pointerId); } catch (err) {}
});
fabMenu.addEventListener('pointermove', function (e) {
	if (!fabDrag) return;
	var dx = e.clientX - fabDrag.x0, dy = e.clientY - fabDrag.y0;
	if (Math.abs(dx) + Math.abs(dy) > 10) fabMoved = true;
	if (fabMoved) {
		fabPos.x = Math.min(95, Math.max(5, fabDrag.ix + dx / window.innerWidth * 100));
		fabPos.y = Math.min(95, Math.max(5, fabDrag.iy + dy / window.innerHeight * 100));
		applyFabPos();
	}
});
fabMenu.addEventListener('pointerup', function () {
	if (fabDrag && fabMoved) {
		try { localStorage.setItem(FAB_STORE, JSON.stringify(fabPos)); } catch (e) {}
	}
	fabDrag = null;
});
fabMenu.addEventListener('click', function (e) {
	if (fabMoved) { e.preventDefault(); return; }
	openMenu();
});
document.getElementById('btnCloseMenu').addEventListener('click', closeMenu);
overlay.addEventListener('click', function () { closeMenu(); });
document.getElementById('mOpen').addEventListener('click', function () { closeMenu(); openFileDialog(); });
document.getElementById('btnLoadLink').addEventListener('click', function () {
	var url = document.getElementById('linkInput').value.trim();
	if (url) { closeMenu(); loadByUrl(url, '⛏️ Game Flash'); }
});
document.getElementById('btnFs').addEventListener('click', function () {
	try {
		if (document.fullscreenElement) document.exitFullscreen();
		else if (player && player.enterFullscreen) player.enterFullscreen();
		else document.documentElement.requestFullscreen();
	} catch (e) {}
	closeMenu();
});
document.getElementById('setShowPad').addEventListener('change', function () {
	padSettings.showPad = this.checked; savePadState(); renderPad();
});
document.getElementById('setOpacity').addEventListener('input', function () {
	padSettings.opacity = parseInt(this.value, 10) || 100;
	document.getElementById('opacityVal').textContent = padSettings.opacity + '%';
	savePadState(); renderPad();
});

/* --- Vào / ra chế độ chỉnh --- */
var editSnapshot = null;
function enterEdit() {
	editing = true;
	editSnapshot = JSON.stringify(padLayout);
	document.body.classList.add('editing');
	fabMenu.style.display = 'none';
	editSheet.classList.add('show');
	selectKey(null);
	renderPad();
}
function exitEdit(save) {
	editing = false;
	selectedId = null;
	document.body.classList.remove('editing');
	editSheet.classList.remove('show');
	editSheet.classList.remove('dragging');
	editSheet.classList.remove('collapsed');
	document.getElementById('btnCollapseEdit').textContent = '˅';
	fabMenu.style.display = '';
	if (save) savePadState();
	else if (editSnapshot) { try { padLayout = JSON.parse(editSnapshot); } catch (e) {} }
	renderPad();
}
document.getElementById('btnEditLayout').addEventListener('click', function () { closeMenu(); enterEdit(); });
document.getElementById('btnSaveLayout').addEventListener('click', function () { exitEdit(true); });
document.getElementById('btnCancelEdit').addEventListener('click', function () { exitEdit(false); });
document.getElementById('btnCollapseEdit').addEventListener('click', function () {
	var collapsed = editSheet.classList.toggle('collapsed');
	this.textContent = collapsed ? '˄' : '˅';
});

/* --- Khởi động --- */
loadPadState();
buildChips();
renderPad();
selectKey(null);
window.addEventListener('load', function () {
	var fromUrl = qs('swf');
	if (fromUrl) loadByUrl(fromUrl, '⛏️ Game Flash');
	else if (window.EMBEDDED_SWF_B64) loadEmbedded();
	else tryDefault(0);
});
</script>
</body>
