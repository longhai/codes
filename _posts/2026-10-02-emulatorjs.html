<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmulatorJS</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0e12;color:#fff;font:16px Arial}
button{padding:10px 18px;border:0;border-radius:8px;background:#1AAFFF;color:#fff}
button:disabled{opacity:.5}
</style>
</head>
<body><button id="install" disabled>Cài đặt</button>

<script>
let p=null,
    b=document.getElementById("install");

function installed(){
    return matchMedia("(display-mode:standalone)").matches||
           navigator.standalone;
}

function update(){
    b.textContent=installed()?"Đã cài đặt":"Cài đặt";
    b.disabled=installed()||!p;
}

addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();
    p=e;
    update();
});

addEventListener("appinstalled",()=>{
    p=null;
    update();
});

b.onclick=async()=>{
    if(!p)return;
    p.prompt();
    await p.userChoice;
    p=null;
    update();
};

const m={
    name:"EmulatorJS Demo",
    short_name:"EmulatorJS",
    start_url:location.href,
    display:"standalone",
    background_color:"#0d0e12",
    theme_color:"#1AAFFF"
};

const l=document.createElement("link");
l.rel="manifest";
l.href=URL.createObjectURL(
    new Blob([JSON.stringify(m)],{type:"application/json"})
);
document.head.appendChild(l);

update();
</script></body>
</html>
