<!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cài đặt Ứng dụng</title>
<style>
*{box-sizing:border-box;margin:0;font-family:sans-serif}
body{background:#111;color:#eee;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(420px,100%);padding:24px;background:#333;border:1px solid #555;border-radius:12px}
h1{font-size:20px;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #555}
div{display:flex;justify-content:space-between;align-items:center}
button{padding:8px 16px;border:1px solid #555;border-radius:6px;background:#333;color:#eee}
button:disabled{opacity:.5}
</style>
</head><body>
<main>
<h1>Cài đặt PWA</h1>
<div>
<span>Cài đặt PWA:</span>
<button id="install" disabled>Cài đặt</button>
</div>
</main><script>
const b=document.getElementById("install");
let p;

const icon="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'><path fill='%231AAFFF' d='M174 768 55 887a43 43 0 0 0 60 60l120-119 119 119a43 43 0 0 0 60-60L295 768l119-119a43 43 0 0 0-60-60L235 708 115 589a43 43 0 0 0-60 60zM768 469a213 213 0 1 0 0-426 213 213 0 0 0 0 426zm0-85a128 128 0 1 0 0-256 128 128 0 0 0 0 256z'/></svg>";

const m={
 name:"WebApp",
 short_name:"WebApp",
 start_url:location.href,
 display:"standalone",
 icons:[{src:icon,sizes:"512x512",type:"image/svg+xml"}]
};

const l=document.createElement("link");
l.rel="manifest";
l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/json"}));
document.head.append(l);

onbeforeinstallprompt=e=>{
 e.preventDefault();
 p=e;
 b.disabled=false;
};

b.onclick=async()=>{
 if(!p)return;
 await p.prompt();
 p=null;
 b.disabled=true;
};
</script></body>
</html>
