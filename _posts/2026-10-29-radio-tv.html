<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio TV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#050505;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px}
/* header */
header{height:64px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05);position:sticky;top:0;z-index:70}
.logo{display:flex;align-items:center;gap:10px}
.logo-box{width:32px;height:32px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.logo h1{font-size:17px;letter-spacing:-.5px;text-transform:uppercase;line-height:1;margin:0;font-weight:900}
.logo h1 span:last-child{color:#6366f1}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.05);color:#94a3b8;font-size:18px}
.icon-btn:hover{color:#fff}
.done-btn{display:flex;align-items:center;gap:6px;padding:6px 16px;background:#4f46e5;color:#fff;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.search-bar{flex:1;display:flex;align-items:center;gap:8px;padding:0 8px}
.search-box{position:relative;flex:1}
.search-box span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#64748b;font-size:14px}
.search-box input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 32px 8px 36px;outline:none;font-size:12px;color:#fff}
.search-box input:focus{border-color:rgba(99,102,241,.5)}
.search-box button{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#64748b;font-size:14px}
.cancel{font-size:12px;font-weight:700;color:#94a3b8;white-space:nowrap}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:44px;width:224px;background:#0f0f0f;border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:6px 0;z-index:100;display:none}
.menu.open{display:block}
.menu button,.menu label{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;font-size:12px;font-weight:500;color:#cbd5e1;text-align:left}
.menu button:hover,.menu label:hover{background:rgba(255,255,255,.05)}
.menu button i,.menu label i{color:#818cf8;font-style:normal}
.menu button.danger{color:#f87171}
.menu hr{height:1px;background:rgba(255,255,255,.05);border:0;margin:4px 8px}
/* player */
#playerWrap{position:sticky;top:64px;z-index:50;background:#000;box-shadow:0 20px 40px rgba(0,0,0,.5);overflow:hidden;transition:all .5s;height:0;opacity:0}
#playerWrap.show{opacity:1}
#playerWrap.audio{height:176px}
#playerWrap.video{aspect-ratio:16/9;height:auto}
#playerInner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:16px 24px;gap:12px}
#playerVideo{width:100%;height:100%;object-fit:contain;display:none}
#playerVideo.show{display:block}
.audio-ui{display:flex;flex-direction:column;gap:12px}
.audio-top{display:flex;align-items:center;gap:20px}
.thumb{width:80px;height:80px;border-radius:16px;background:#171717;border:1px solid rgba(255,255,255,.1);flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:32px}
.thumb img{width:100%;height:100%;object-fit:contain;padding:8px}
.thumb .pulse{position:absolute;inset:0;background:rgba(99,102,241,.1);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.audio-top h2{font-size:20px;font-weight:900;color:#fff;line-height:1.2;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audio-top p{color:#818cf8;font-size:10px;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-top:4px}
.controls{display:flex;align-items:center;gap:16px}
.play-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;color:#000;border-radius:12px;font-size:20px;box-shadow:0 8px 20px rgba(0,0,0,.4);flex-shrink:0}
.bar{flex:1;height:6px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:all 1s;width:0;opacity:0}
.bar div.on{width:100%;opacity:1}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#loading.show{display:flex}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#818cf8;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* list */
main{height:calc(100vh - 64px);overflow-y:auto;padding-bottom:96px}
main.player-on{height:calc(100vh - 64px - 176px)}
main.player-on.video-on{height:auto}
.empty{padding:48px;text-align:center;opacity:.4}
.empty div{font-size:48px;margin-bottom:16px}
.group-head{width:100%;display:flex;align-items:center;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02);position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);text-align:left}
.group-head.edit{background:rgba(69,26,3,.2)}
.group-left{flex:1;display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer}
.group-left span{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#a1a1aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-head.edit .group-left span{color:rgba(245,158,11,.8)}
.group-edit{display:flex;gap:4px;margin:0 8px}
.group-edit button{padding:8px;border-radius:8px;font-size:14px}
.group-edit button:first-child{background:rgba(245,158,11,.1);color:#f59e0b}
.group-edit button:last-child{background:rgba(239,68,68,.1);color:#ef4444}
.chev{padding-left:8px;cursor:pointer;color:#71717a;transition:transform .3s}
.chev.open{transform:rotate(180deg)}
.chan{display:flex;align-items:flex-start;gap:16px;padding:16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03)}
.chan:hover{background:rgba(255,255,255,.03)}
.chan.active{background:rgba(79,70,229,.1)}
.chan.active.edit{background:rgba(245,158,11,.1)}
.chan-logo{width:48px;height:48px;background:#18181b;border-radius:12px;border:1px solid rgba(255,255,255,.05);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:20px;color:#3f3f46}
.chan-logo img{width:100%;height:100%;object-fit:contain;padding:8px}
.chan-info{flex:1;min-width:0}
.chan-info h3{font-size:14px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f4f4f5}
.chan.active .chan-info h3{color:#818cf8}
.chan.active.edit .chan-info h3{color:#f59e0b}
.chan-info p{font-size:10px;color:#71717a;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6}
.chan-actions{display:flex;gap:4px;margin-left:8px}
.chan-actions button{padding:10px;border-radius:12px;font-size:14px}
.chan-actions button:first-child{background:#27272a;color:#f59e0b}
.chan-actions button:last-child{background:rgba(239,68,68,.1);color:#ef4444}
/* modal */
.modal{position:fixed;inset:0;z-index:130;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.95);backdrop-filter:blur(4px)}
.modal.open{display:flex}
.box{background:#0f0f0f;border:1px solid rgba(255,255,255,.1);border-radius:32px;width:100%;max-width:380px;overflow:hidden}
.box-head{padding:24px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center}
.box-head span{font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#818cf8}
.box-head button{color:#64748b;font-size:20px}
.box-body{padding:28px;display:flex;flex-direction:column;gap:16px}
.box-body input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;font-size:14px;color:#fff;outline:none}
.box-body input:focus{border-color:rgba(99,102,241,.5)}
.box-body label{font-size:9px;font-weight:900;color:#64748b;text-transform:uppercase;padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box-foot{padding:24px;background:rgba(0,0,0,.4);display:flex;gap:12px;border-top:1px solid rgba(255,255,255,.05)}
.box-foot button{flex:1;padding:16px;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;border-radius:16px}
.btn-ghost{border:1px solid rgba(255,255,255,.1);color:#94a3b8}
.btn-white{background:#fff;color:#000}
.btn-indigo{background:#4f46e5;color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.btn-amber{background:#d97706;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.center{text-align:center}
.center .big{padding:16px;background:rgba(239,68,68,.1);border-radius:999px;width:fit-content;margin:0 auto;color:#ef4444;font-size:32px}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo" id="logoArea">
    <div class="logo-box">📻</div>
    <h1><span style="color:#fff">Radio</span> <span>TV</span></h1>
  </div>

  <div class="search-bar hidden" id="searchBar">
    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="Tìm kiếm kênh...">
      <button id="clearSearch">✕</button>
    </div>
    <button class="cancel" id="cancelSearch">Hủy</button>
  </div>

  <div style="display:flex;align-items:center;gap:8px">
    <button class="done-btn hidden" id="doneEdit">✓ Hoàn tất</button>
    <button class="icon-btn" id="searchBtn" title="Tìm kiếm">🔍</button>
    <div class="menu-wrap" id="menuWrap">
      <button class="icon-btn" id="menuBtn">⋮</button>
      <div class="menu" id="menu">
        <button onclick="openUrlImport()"><i>🌐</i> Nhập từ Link (URL)</button>
        <label><i>⬆️</i> Nhập từ File (.m3u)<input type="file" accept=".m3u,.m3u8" class="hidden" onchange="importFile(this)"></label>
        <button onclick="exportM3U()"><i>⬇️</i> Xuất file M3U</button>
        <hr>
        <button onclick="openAdd()"><i>＋</i> Thêm kênh mới</button>
        <button onclick="toggleEdit()"><i>▦</i> <span id="editLabel">Bật chế độ sửa</span></button>
        <button onclick="sortAZ()"><i>⇅</i> Sắp xếp A-Z</button>
        <hr>
        <button class="danger" onclick="openClear()"><i>🗑️</i> Xóa sạch dữ liệu</button>
      </div>
    </div>
  </div>
</header>

<div id="playerWrap">
  <div id="playerInner">
    <video id="playerVideo" controls playsinline></video>
    <div class="audio-ui" id="audioUI">
      <div class="audio-top">
        <div class="thumb" id="thumb">🎵</div>
        <div style="flex:1;min-width:0">
          <h2 id="nowName">Đang chờ...</h2>
          <p id="nowGroup">Khác</p>
        </div>
      </div>
      <div class="controls">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
        <div class="bar"><div id="barFill"></div></div>
      </div>
    </div>
    <div id="loading"><div class="spinner"></div></div>
  </div>
</div>

<main id="list"></main>

<!-- Đổi tên nhóm -->
<div class="modal" id="renameModal">
  <div class="box">
    <div class="box-head"><span style="color:#f59e0b">Đổi tên nhóm</span><button onclick="closeModal('renameModal')">✕</button></div>
    <div class="box-body">
      <div><label>Tên nhóm cũ: <span style="color:#fff" id="oldNameText"></span></label>
      <input id="newNameInput" placeholder="Nhập tên nhóm mới..."></div>
    </div>
    <div class="box-foot"><button class="btn-ghost" onclick="closeModal('renameModal')">Hủy</button><button class="btn-amber" onclick="doRename()">Cập nhật</button></div>
  </div>
</div>

<!-- Xóa nhóm -->
<div class="modal" id="deleteGroupModal">
  <div class="box center" style="border-color:rgba(239,68,68,.2)">
    <div class="box-body">
      <div class="big">🗑️</div>
      <h3 style="color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:2px;font-size:14px">Xóa nhóm: <span id="deleteGroupName"></span>?</h3>
      <p style="font-size:12px;color:#64748b">Mọi kênh bên trong nhóm này sẽ bị xóa khỏi danh sách.</p>
      <button class="btn-red" style="width:100%;padding:16px;border-radius:16px;font-size:10px;font-weight:900;letter-spacing:2px" onclick="doDeleteGroup()">Xóa toàn bộ nhóm</button>
      <button class="btn-ghost" style="width:100%;padding:16px;border-radius:16px;font-size:10px;font-weight:900;letter-spacing:2px" onclick="closeModal('deleteGroupModal')">Quay lại</button>
    </div>
  </div>
</div>

<!-- Nhập URL -->
<div class="modal" id="urlModal">
  <div class="box">
    <div class="box-head"><span>🌐 Nhập Link M3U</span><button onclick="closeModal('urlModal')">✕</button></div>
    <div class="box-body"><input id="importUrl" placeholder="https://..."></div>
    <div class="box-foot"><button class="btn-ghost" onclick="closeModal('urlModal')">Hủy</button><button class="btn-indigo" onclick="doImportUrl()">Tải dữ liệu</button></div>
  </div>
</div>

<!-- Thêm / sửa kênh -->
<div class="modal" id="chanModal">
  <div class="box">
    <div class="box-head"><span id="chanModalTitle">Thêm kênh mới</span><button onclick="closeModal('chanModal')">✕</button></div>
    <div class="box-body">
      <input id="fName" placeholder="Tên kênh...">
      <input id="fUrl" placeholder="Stream URL (m3u8, mp4...)" style="color:#818cf8">
      <div class="grid2">
        <input id="fGroup" placeholder="Nhóm...">
        <input id="fLogo" placeholder="Logo URL...">
      </div>
    </div>
    <div class="box-foot"><button class="btn-ghost" onclick="closeModal('chanModal')">Đóng</button><button class="btn-white" onclick="saveChannel()">Lưu lại</button></div>
  </div>
</div>

<!-- Xóa sạch -->
<div class="modal" id="clearModal">
  <div class="box center" style="border-color:rgba(239,68,68,.2)">
    <div class="box-body">
      <div class="big">🗑️</div>
      <h3 style="color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:2px;font-size:14px">Xóa sạch dữ liệu?</h3>
      <button class="btn-red" style="width:100%;padding:16px;border-radius:16px;font-size:10px;font-weight:900;letter-spacing:2px" onclick="doClear()">Xác nhận xóa</button>
      <button class="btn-ghost" style="width:100%;padding:16px;border-radius:16px;font-size:10px;font-weight:900;letter-spacing:2px" onclick="closeModal('clearModal')">Quay lại</button>
    </div>
  </div>
</div>

<script>
var KEY='radio-tv-channels-v1';
var channels=[];
try{ channels=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ channels=[]; }
var search='', isSearching=false, currentUrl='', isVideoMode=false, isPlaying=false;
var expanded={}, isEditMode=false, editingIndex=null, renameOld='';
var video=document.getElementById('playerVideo'), hls=null, loadingEl=document.getElementById('loading');

function save(){ localStorage.setItem(KEY, JSON.stringify(channels)); render(); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function parseM3U(text){
  var lines=text.replace(/^\uFEFF/,'').split(/\r?\n/), out=[], cur=null;
  lines.forEach(function(line){
    line=line.trim();
    if(line.indexOf('#EXTINF:')===0){
      cur={};
      var i=line.lastIndexOf(',');
      cur.name=i!==-1?line.substring(i+1).trim():'Không tên';
      var g=line.match(/group-title="([^"]*)"/i); cur.group=g?g[1]:'Khác';
      var l=line.match(/tvg-logo="([^"]*)"/i); cur.logo=l?l[1]:'';
    } else if(line && line[0]!=='#' && cur){
      cur.url=line; out.push(cur); cur=null;
    }
  });
  return out;
}
function exportM3U(){
  if(!channels.length) return;
  var c='#EXTM3U\n';
  channels.forEach(function(ch){ c+='#EXTINF:-1 tvg-logo="'+(ch.logo||'')+'" group-title="'+(ch.group||'Khác')+'",'+ch.name+'\n'+ch.url+'\n'; });
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([c],{type:'text/plain'}));
  a.download='playlist_pro.m3u'; a.click();
  closeMenu();
}
function importFile(input){
  var f=input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(e){ var p=parseM3U(e.target.result); if(p.length) saveList(channels.concat(p)); closeMenu(); };
  r.readAsText(f); input.value='';
}
function saveList(list){ channels=list; save(); }
function closeMenu(){ document.getElementById('menu').classList.remove('open'); }
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function toggleEdit(){
  isEditMode=!isEditMode; closeMenu();
  document.getElementById('doneEdit').classList.toggle('hidden',!isEditMode);
  document.getElementById('editLabel').textContent=isEditMode?'Tắt chế độ sửa':'Bật chế độ sửa';
  render();
}
function sortAZ(){ channels=[].concat(channels).sort(function(a,b){ return a.name.localeCompare(b.name,'vi'); }); save(); closeMenu(); }
function openAdd(){
  editingIndex=null;
  document.getElementById('chanModalTitle').textContent='Thêm kênh mới';
  ['fName','fUrl','fGroup','fLogo'].forEach(function(id){ document.getElementById(id).value=''; });
  closeMenu(); openModal('chanModal');
}
function openEdit(i){
  editingIndex=i; var c=channels[i];
  document.getElementById('chanModalTitle').textContent='Cập nhật kênh';
  document.getElementById('fName').value=c.name||'';
  document.getElementById('fUrl').value=c.url||'';
  document.getElementById('fGroup').value=c.group||'';
  document.getElementById('fLogo').value=c.logo||'';
  openModal('chanModal');
}
function saveChannel(){
  var d={name:document.getElementById('fName').value.trim(),url:document.getElementById('fUrl').value.trim(),group:document.getElementById('fGroup').value.trim(),logo:document.getElementById('fLogo').value.trim()};
  if(!d.name||!d.url) return;
  if(editingIndex!==null) channels[editingIndex]=d; else channels.unshift(d);
  save(); closeModal('chanModal');
}
function deleteChannel(i){ channels=channels.filter(function(_,x){ return x!==i; }); save(); }
function openRename(g){ renameOld=g; document.getElementById('oldNameText').textContent=g; document.getElementById('newNameInput').value=g; openModal('renameModal'); }
function doRename(){
  var n=document.getElementById('newNameInput').value.trim();
  if(!n||n===renameOld) return;
  channels=channels.map(function(c){ return (c.group||'Khác')===renameOld?{name:c.name,url:c.url,group:n,logo:c.logo}:c; });
  save(); closeModal('renameModal');
}
function openDeleteGroup(g){ document.getElementById('deleteGroupName').textContent=g; window._delGroup=g; openModal('deleteGroupModal'); }
function doDeleteGroup(){ channels=channels.filter(function(c){ return (c.group||'Khác')!==window._delGroup; }); save(); closeModal('deleteGroupModal'); }
function openClear(){ closeMenu(); openModal('clearModal'); }
function doClear(){ channels=[]; currentUrl=''; stopMedia(); save(); closeModal('clearModal'); }
function openUrlImport(){ closeMenu(); openModal('urlModal'); }
async function doImportUrl(){
  var u=document.getElementById('importUrl').value.trim(); if(!u) return;
  setLoading(true);
  try{
    var r=await fetch(u); var t=await r.text(); var p=parseM3U(t);
    if(p.length) saveList(channels.concat(p));
    closeModal('urlModal'); document.getElementById('importUrl').value='';
  }catch(e){ alert('Không tải được link này. Nhiều máy chủ chặn đọc từ trang khác (CORS) — thử tải file .m3u về rồi dùng "Nhập từ File" thay cho "Nhập từ Link".'); }
  setLoading(false);
}
function setLoading(v){ loadingEl.classList.toggle('show',v); }
function stopMedia(){
  if(hls){ hls.destroy(); hls=null; }
  video.pause(); video.removeAttribute('src'); video.load();
  isPlaying=false; updatePlayerUI();
}
function togglePlay(){
  if(!video) return;
  if(video.paused) video.play().catch(function(){}); else video.pause();
}
function playChannelByIndex(i){
  if(isEditMode) return;
  playChannel(channels[i]);
}
function playChannel(ch){
  if(!ch||!video) return;
  var url=ch.url;
  if(currentUrl===url){ togglePlay(); return; }
  setLoading(true); currentUrl=url;
  var hint=((ch.group||'').toLowerCase().indexOf('tv')!==-1 || (ch.group||'').toLowerCase().indexOf('truyền hình')!==-1) || url.toLowerCase().indexOf('.mp4')!==-1;
  isVideoMode=hint;
  stopMedia(); setLoading(true);
  function startHls(u){
    if(window.Hls && window.Hls.isSupported()){
      hls=new window.Hls({enableWorker:true,lowLatencyMode:true});
      hls.loadSource(u); hls.attachMedia(video);
      hls.on(window.Hls.Events.MANIFEST_PARSED,function(){
        video.play().catch(function(){});
        if(hls.levels && hls.levels.some(function(l){ return l.videoCodec || l.width>0; })) isVideoMode=true;
        setLoading(false); renderPlayer();
      });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=u; video.play().then(function(){setLoading(false);}).catch(function(){setLoading(false);}); renderPlayer();
    } else { setLoading(false); }
  }
  if(url.indexOf('.m3u8')!==-1){
    if(!window.Hls){
      var s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
      s.onload=function(){ startHls(url); }; s.onerror=function(){ setLoading(false); };
      document.head.appendChild(s);
    } else startHls(url);
  } else {
    video.src=url; video.play().then(function(){setLoading(false);}).catch(function(){setLoading(false);});
  }
  renderPlayer(); render();
}
video.addEventListener('play',function(){ isPlaying=true; updatePlayerUI(); });
video.addEventListener('pause',function(){ isPlaying=false; updatePlayerUI(); });

function updatePlayerUI(){
  var cur=channels.find(function(c){ return c.url===currentUrl; });
  document.getElementById('nowName').textContent=cur?cur.name:'Đang chờ...';
  document.getElementById('nowGroup').textContent=cur?(cur.group||'Khác'):'Khác';
  var th=document.getElementById('thumb');
  th.innerHTML=cur&&cur.logo?'<img src="'+esc(cur.logo)+'" onerror="this.style.display=\'none\'">🎵':'🎵';
  if(isPlaying) th.innerHTML+='<div class="pulse"></div>';
  document.getElementById('playBtn').textContent=isPlaying?'⏸':'▶';
  document.getElementById('barFill').className=isPlaying?'on':'';
}
function renderPlayer(){
  var wrap=document.getElementById('playerWrap');
  if(!currentUrl){ wrap.classList.remove('show','audio','video'); document.getElementById('list').classList.remove('player-on'); return; }
  wrap.classList.add('show');
  wrap.classList.toggle('audio',!isVideoMode);
  wrap.classList.toggle('video',isVideoMode);
  document.getElementById('playerVideo').classList.toggle('show',isVideoMode);
  document.getElementById('audioUI').classList.toggle('hidden',isVideoMode);
  document.getElementById('list').classList.toggle('player-on',!isVideoMode);
  updatePlayerUI();
}
function render(){
  var groups={};
  channels.forEach(function(c,idx){
    if(search && c.name.toLowerCase().indexOf(search.toLowerCase())===-1) return;
    var g=c.group||'Khác'; if(!groups[g]) groups[g]=[];
    groups[g].push({c:c,idx:idx});
  });
  var html='';
  var keys=Object.keys(groups);
  if(!keys.length){
    html='<div class="empty"><div>📻</div><p style="font-size:14px;font-weight:500">Danh sách trống.</p><p style="font-size:12px">Bấm ⋮ rồi chọn Nhập từ File (.m3u) hoặc Nhập từ Link.</p></div>';
  }
  keys.forEach(function(g){
    var list=groups[g], open=!!expanded[g];
    html+='<div><div class="group-head '+(isEditMode?'edit':'')+'">'
      +'<div class="group-left" onclick="toggleGroup(\''+esc(g).replace(/'/g,"\\'")+'\')"><span>📁 '+esc(g)+' <span style="opacity:.5;margin-left:4px">('+list.length+')</span></span></div>'
      +(isEditMode?'<div class="group-edit"><button onclick="event.stopPropagation();openRename(\''+esc(g).replace(/'/g,"\\'")+'\')">✎</button><button onclick="event.stopPropagation();openDeleteGroup(\''+esc(g).replace(/'/g,"\\'")+'\')">🗑️</button></div>':'')
      +'<div class="chev '+(open?'open':'')+'" onclick="toggleGroup(\''+esc(g).replace(/'/g,"\\'")+'\')">⌄</div></div>';
    if(open){
      list.forEach(function(item){
        var c=item.c, active=currentUrl===c.url;
        html+='<div class="chan '+(active?'active':'')+' '+(isEditMode?'edit':'')+'" onclick="playChannelByIndex('+item.idx+')">'
          +'<div class="chan-logo">'+(c.logo?'<img src="'+esc(c.logo)+'" onerror="this.style.display=\'none\'">':'📻')+'</div>'
          +'<div class="chan-info"><h3>'+esc(c.name)+'</h3><p>'+esc(c.url)+'</p></div>'
          +(isEditMode?'<div class="chan-actions" onclick="event.stopPropagation()"><button onclick="openEdit('+item.idx+')">✎</button><button onclick="deleteChannel('+item.idx+')">🗑️</button></div>':'')
          +'</div>';
      });
    }
    html+='</div>';
  });
  document.getElementById('list').innerHTML=html;
  renderPlayer();
}
function toggleGroup(g){ expanded[g]=!expanded[g]; render(); }

document.getElementById('menuBtn').onclick=function(e){ e.stopPropagation(); document.getElementById('menu').classList.toggle('open'); };
document.addEventListener('mousedown',function(e){
  var w=document.getElementById('menuWrap');
  if(w && !w.contains(e.target)) closeMenu();
});
document.getElementById('searchBtn').onclick=function(){
  isSearching=true;
  document.getElementById('logoArea').classList.add('hidden');
  document.getElementById('searchBar').classList.remove('hidden');
  document.getElementById('searchInput').focus();
};
document.getElementById('cancelSearch').onclick=function(){
  isSearching=false; search=''; document.getElementById('searchInput').value='';
  document.getElementById('logoArea').classList.remove('hidden');
  document.getElementById('searchBar').classList.add('hidden');
  render();
};
document.getElementById('clearSearch').onclick=function(){ document.getElementById('searchInput').value=''; search=''; render(); };
document.getElementById('searchInput').addEventListener('input',function(e){ search=e.target.value; render(); });
document.getElementById('doneEdit').onclick=function(){ toggleEdit(); };

render();
</script>
