---
layout: default
title: Quản trị Blog
body_class: page-index
---
<style>
  :root {
    --primary: #2563eb;
    --success: #16a34a;
    --bg-card: var(--card, #1e293b);
    --border-color: var(--border, #334155);
  }
  .admin-container { max-width: 1200px; margin: 0 auto; padding: 12px; font-family: system-ui, -apple-system, sans-serif; }
  .tab-nav { display: flex; gap: 6px; margin-bottom: 12px; background: var(--bg-card); padding: 4px; border-radius: 10px; border: 1px solid var(--border-color); }
  .tab-btn { flex: 1; padding: 10px; border: 0; background: transparent; color: var(--text); border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; }
  .tab-btn.active { background: var(--primary); color: #fff; }
  
  .grid-layout { display: grid; grid-template-columns: 1fr; gap: 15px; }
  @media (min-width: 900px) {
    .grid-layout { grid-template-columns: 320px 1fr; }
    .preview-mode-desktop { display: grid !important; grid-template-columns: 1fr 1fr; gap: 15px; }
  }

  .card-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
  .form-control { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg); color: var(--text); font-size: 14px; box-sizing: border-box; }
  .preview-frame { width: 100%; height: 400px; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; color: #000; }
</style>

<div class="admin-container">
  
  <!-- CẤU HÌNH GITHUB -->
  <details style="margin-bottom: 12px;" class="card-box">
    <summary style="cursor: pointer; font-weight: bold; font-size: 13px;">⚙️ Cài đặt Token GitHub</summary>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
      <input type="text" id="cfgOwner" class="form-control" placeholder="Tên tài khoản GitHub">
      <input type="text" id="cfgRepo" class="form-control" placeholder="Tên Repository">
      <input type="password" id="cfgToken" class="form-control" placeholder="GitHub Token (ghp_...)">
      <button type="button" onclick="saveConfig()" style="padding: 10px; background: var(--primary); color: #fff; border: 0; border-radius: 8px; font-weight: bold; cursor: pointer;">💾 Lưu Cấu Hình</button>
    </div>
  </details>

  <!-- THANH ĐIỀU HƯỚNG TAB (TỐI ƯU CHO MOBILE) -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('edit')">✏️ Soạn thảo</button>
    <button class="tab-btn" onclick="switchTab('preview')">👁️ Xem trước</button>
    <button class="tab-btn" onclick="switchTab('list')">📂 Bài cũ (<span id="postCount">0</span>)</button>
  </div>

  <div class="grid-layout">
    
    <!-- CỘT DANH SÁCH BÀI CŨ (ẨN/HIỆN THEO TAB HOẶC PC) -->
    <div id="tab-list" class="card-box" style="display: none;">
      <div style="display: flex; gap: 6px; margin-bottom: 10px;">
        <input type="text" id="searchPost" class="form-control" placeholder="🔍 Tìm bài viết..." oninput="filterPosts()">
        <button onclick="resetForm()" style="background: var(--success); color: #fff; border: 0; border-radius: 8px; padding: 0 12px; font-weight: bold; cursor: pointer;">➕</button>
      </div>
      <div id="postList" style="max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">Đang tải...</div>
    </div>

    <!-- KHU VỰC CHÍNH: SOẠN THẢO & XEM TRƯỚC -->
    <div id="mainEditorArea" class="preview-mode-desktop">
      
      <!-- FORM NHẬP NỘI DUNG -->
      <div id="tab-edit" class="card-box" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 id="formTitle" style="font-size: 15px; margin: 0;">Soạn bài viết</h3>
          <button type="button" onclick="resetForm()" style="background: transparent; color: var(--primary); border: 0; font-size: 12px; cursor: pointer;">Tạo mới</button>
        </div>

        <input type="text" id="title" class="form-control" placeholder="Tiêu đề bài viết..." required oninput="updatePreview()">

        <div style="display: flex; gap: 15px; font-size: 13px;">
          <label style="cursor: pointer;"><input type="radio" name="postType" value="code" checked onchange="updatePreview()"> 💻 Mã Code (HTML)</label>
          <label style="cursor: pointer;"><input type="radio" name="postType" value="text" onchange="updatePreview()"> 📝 Văn bản</label>
        </div>

        <textarea id="content" class="form-control" placeholder="Dán mã HTML hoặc nhập nội dung..." rows="14" style="font-family: monospace; font-size: 13px;" required oninput="updatePreview()"></textarea>

        <button type="button" id="submitBtn" onclick="submitPost()" style="padding: 12px; background: var(--primary); color: #fff; border: 0; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;">🚀 Đăng bài ngay</button>
      </div>

      <!-- KHUNG XEM TRƯỚC (LIVE PREVIEW) -->
      <div id="tab-preview" class="card-box" style="display: none;">
        <h3 style="font-size: 15px; margin-top: 0; margin-bottom: 12px;">👁️ Xem trước thực tế</h3>
        <iframe id="previewFrame" class="preview-frame"></iframe>
      </div>

    </div>

  </div>
</div>

<script>
let GH_CONFIG = JSON.parse(localStorage.getItem('gh_cfg') || '{}');
let rawPostsList = [];
let currentSha = null, currentPath = null;

// Khởi tạo Cấu hình
document.getElementById('cfgOwner').value = GH_CONFIG.owner || 'longhai';
document.getElementById('cfgRepo').value = GH_CONFIG.repo || 'codes';
document.getElementById('cfgToken').value = GH_CONFIG.token || '';

function saveConfig() {
  GH_CONFIG = {
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    token: document.getElementById('cfgToken').value.trim()
  };
  localStorage.setItem('gh_cfg', JSON.stringify(GH_CONFIG));
  alert('Đã lưu!');
  loadPosts();
}

// Chuyển đổi Tab linh hoạt cho Mobile & PC
function switchTab(tabName) {
  const isMobile = window.innerWidth < 900;
  
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  if (isMobile) {
    document.getElementById('tab-edit').style.display = tabName === 'edit' ? 'flex' : 'none';
    document.getElementById('tab-preview').style.display = tabName === 'preview' ? 'block' : 'none';
    document.getElementById('tab-list').style.display = tabName === 'list' ? 'block' : 'none';
  } else {
    // Trên PC: Luôn hiện danh sách bên trái, còn bên phải hiện Soạn thảo & Xem trước
    document.getElementById('tab-list').style.display = tabName === 'list' ? 'block' : 'block';
    document.getElementById('tab-edit').style.display = 'flex';
    document.getElementById('tab-preview').style.display = 'block';
  }
}

// Render Xem trước Thực tế (Live Preview)
function updatePreview() {
  const content = document.getElementById('content').value;
  const isCode = document.querySelector('input[name="postType"]:checked').value === 'code';
  const frame = document.getElementById('previewFrame').contentWindow.document;

  frame.open();
  if (isCode) {
    frame.write(content); // Render HTML/JS thực tế
  } else {
    frame.write(`<div style="font-family: sans-serif; padding: 15px; line-height: 1.6;">${content.replace(/\n/g, '<br>')}</div>`);
  }
  frame.close();
}

// Tải danh sách bài viết
async function loadPosts() {
  const listEl = document.getElementById('postList');
  if (!GH_CONFIG.token) {
    listEl.innerHTML = '<span style="color:#eab308; font-size:12px;">Chưa nhập Token!</span>';
    return;
  }

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/_posts`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    
    if (!res.ok) throw new Error();
    const files = await res.json();

    rawPostsList = files.filter(f => f.type === 'file' && (f.name.endsWith('.html') || f.name.endsWith('.md')));
    document.getElementById('postCount').textContent = rawPostsList.length;
    
    renderPostList(rawPostsList);
  } catch (err) {
    listEl.innerHTML = '<span style="color:#ef4444; font-size:12px;">Lỗi tải bài cũ!</span>';
  }
}

function renderPostList(list) {
  const listEl = document.getElementById('postList');
  listEl.innerHTML = '';
  
  list.slice().reverse().forEach(file => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = file.name.replace(/^\d{4}-\d{2}-\d{2}-/, '');
    btn.style.cssText = 'text-align:left; padding:8px 10px; border:1px solid var(--border-color); background:var(--bg); color:var(--text); border-radius:6px; cursor:pointer; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;';
    btn.onclick = () => editPost(file.path, file.sha);
    listEl.appendChild(btn);
  });
}

// Tìm kiếm bài viết
function filterPosts() {
  const q = document.getElementById('searchPost').value.toLowerCase();
  const filtered = rawPostsList.filter(f => f.name.toLowerCase().includes(q));
  renderPostList(filtered);
}

// Đọc nội dung để sửa
async function editPost(path, sha) {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${path}`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    const data = await res.json();
    const rawText = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));

    const titleMatch = rawText.match(/title:\s*["']?([^"'\n]+)["']?/);
    const typeMatch = rawText.match(/type:\s*(\w+)/);
    const contentParts = rawText.split(/^---$/m);
    let body = contentParts.length >= 3 ? contentParts.slice(2).join('---').trim() : rawText;

    document.getElementById('title').value = titleMatch ? titleMatch[1] : path.split('/').pop();
    
    const postType = typeMatch ? typeMatch[1] : (path.endsWith('.html') ? 'code' : 'text');
    document.querySelector(`input[name="postType"][value="${postType}"]`).checked = true;

    if (postType === 'code') body = body.replace(/^```html\n?/, '').replace(/\n?```$/, '');
    
    document.getElementById('content').value = body;
    currentSha = sha; currentPath = path;

    document.getElementById('formTitle').textContent = '✏️ Sửa bài viết';
    document.getElementById('submitBtn').textContent = '💾 Lưu cập nhật';
    
    updatePreview();
    if (window.innerWidth < 900) switchTab('edit'); // Tự chuyển về tab sửa bài trên Mobile
  } catch(e) {
    alert('Không thể đọc nội dung!');
  }
}

function resetForm() {
  currentSha = null; currentPath = null;
  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  document.getElementById('formTitle').textContent = 'Soạn bài viết';
  document.getElementById('submitBtn').textContent = '🚀 Đăng bài ngay';
  updatePreview();
}

// Đăng bài
async function submitPost() {
  if (!GH_CONFIG.token) return alert('Chưa nhập Token!');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  const title = document.getElementById('title').value.trim();
  const rawContent = document.getElementById('content').value;
  const isCode = document.querySelector('input[name="postType"][value="code"]').checked;

  const today = new Date().toISOString().split('T')[0];
  const slug = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
  
  const finalBody = isCode ? "```html\n" + rawContent + "\n```" : rawContent;
  const fileContent = `---\nlayout: post\ntitle: "${title}"\ndate: ${today}\ntype: ${isCode ? 'code' : 'text'}\n---\n\n${finalBody}`;
  
  const filePath = currentPath || `_posts/${today}-${slug}.html`;
  const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

  const payload = { message: `Update/Create: ${title}`, content: encodedContent };
  if (currentSha) payload.sha = currentSha;

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${filePath}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      alert(currentSha ? '✅ Đã lưu cập nhật!' : '✅ Đã đăng bài mới!');
      resetForm();
      loadPosts();
    } else {
      const err = await res.json();
      alert('❌ Lỗi: ' + err.message);
    }
  } catch (err) {
    alert('❌ Lỗi kết nối!');
  } finally {
    btn.disabled = false;
  }
}

// Tự động căn chỉnh hiển thị ban đầu
window.addEventListener('resize', () => {
  if (window.innerWidth >= 900) {
    document.getElementById('tab-edit').style.display = 'flex';
    document.getElementById('tab-preview').style.display = 'block';
    document.getElementById('tab-list').style.display = 'block';
  }
});

loadPosts();
</script>
