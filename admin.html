---
layout: default
title: Quản lý & Xem trước Bài viết
body_class: page-index
---
<div style="max-width: 900px; margin: 0 auto; padding: 10px; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- BAR ĐIỀU HƯỚNG TAB & CẤU HÌNH -->
  <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap;">
    <button type="button" class="tab-btn active" onclick="switchTab('editTab')" id="btnEditTab">✏️ Soạn thảo</button>
    <button type="button" class="tab-btn" onclick="switchTab('previewTab')" id="btnPreviewTab">👁️ Xem thực tế</button>
    <button type="button" onclick="resetForm()" style="padding: 8px 12px; background: #22c55e; color: #fff; border: 0; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: auto;">➕ Bài mới</button>
  </div>

  <!-- NÚT MỞ CẤU HÌNH -->
  <details style="margin-bottom: 12px; background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
    <summary style="cursor: pointer; font-size: 13px; font-weight: bold; color: var(--text);">⚙️ Cấu hình GitHub Token & Repository</summary>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 10px;">
      <input type="text" id="cfgOwner" placeholder="Tài khoản (longhai)" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <input type="text" id="cfgRepo" placeholder="Repo (codes)" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <input type="password" id="cfgToken" placeholder="GitHub Token (ghp_...)" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <button type="button" onclick="saveConfig()" style="padding: 8px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-weight: bold; grid-column: 1 / -1;">Lưu cài đặt</button>
    </div>
  </details>

  <!-- BẢNG CHỌN BÀI VIẾT CŨ -->
  <div style="margin-bottom: 12px;">
    <select id="postSelect" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px;">
      <option value="">-- Chọn bài viết cũ để chỉnh sửa --</option>
    </select>
  </div>

  <!-- NỘI DUNG TAB 1: SOẠN THẢO -->
  <div id="editTab" class="tab-content" style="display: block;">
    <form id="postForm" style="display: flex; flex-direction: column; gap: 10px;">
      <input type="text" id="title" placeholder="Tiêu đề bài viết..." required style="padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; font-weight: bold;">

      <div style="display: flex; gap: 20px; background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        <label style="cursor: pointer; font-size: 14px;"><input type="radio" name="postType" value="code" checked> 💻 Bài Mã Code</label>
        <label style="cursor: pointer; font-size: 14px;"><input type="radio" name="postType" value="text"> 📝 Bài Văn bản</label>
      </div>

      <textarea id="content" placeholder="Nhập mã HTML/JS hoặc nội dung Markdown..." rows="14" required style="padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: monospace; font-size: 14px; line-height: 1.5; resize: vertical;"></textarea>

      <button type="submit" id="submitBtn" style="padding: 14px; background: var(--pri); color: #fff; border: 0; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">🚀 Đăng bài ngay</button>
    </form>
  </div>

  <!-- NỘI DUNG TAB 2: XEM THỰC TẾ (PREVIEW) -->
  <div id="previewTab" class="tab-content" style="display: none;">
    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; min-height: 400px;">
      <h1 id="pvTitle" style="margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 10px;">(Tiêu đề bài viết)</h1>
      <div id="pvBody" style="line-height: 1.6;">(Nội dung xem trước sẽ hiển thị tại đây...)</div>
    </div>
  </div>

</div>

<style>
.tab-btn { padding: 10px 16px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }
</style>

<script>
let GH_CONFIG = JSON.parse(localStorage.getItem('gh_cfg') || '{}');
let rawPostsList = [], currentSha = null, currentPath = null;

document.getElementById('cfgOwner').value = GH_CONFIG.owner || 'longhai';
document.getElementById('cfgRepo').value = GH_CONFIG.repo || 'codes';
document.getElementById('cfgToken').value = GH_CONFIG.token || '';

function saveConfig() {
  GH_CONFIG = {
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    token: document.getElementById('cfgToken').value.trim()
  };
  localStorage.setItem('gh_cfg', JSON.stringify(GH_CONFIG));
  alert('Đã lưu cài đặt!');
  loadPosts();
}

// Chuyển Tab Soạn thảo <-> Xem thực tế
function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  
  document.getElementById(tabId).style.display = 'block';
  if (tabId === 'editTab') document.getElementById('btnEditTab').classList.add('active');
  if (tabId === 'previewTab') {
    document.getElementById('btnPreviewTab').classList.add('active');
    renderPreview();
  }
}

// Xử lý Render nội dung xem trước
function renderPreview() {
  const title = document.getElementById('title').value || 'Tiêu đề bài viết';
  const content = document.getElementById('content').value;
  const isCode = document.querySelector('input[name="postType"]:checked').value === 'code';

  document.getElementById('pvTitle').textContent = title;
  const bodyEl = document.getElementById('pvBody');

  if (isCode) {
    // Nếu là mã Code HTML: nhúng trực tiếp vào khung Iframe để chạy demo thực tế
    bodyEl.innerHTML = '<iframe id="codeFrame" style="width:100%; height:450px; border:1px solid var(--border); border-radius:6px; background:#fff;"></iframe>';
    const doc = document.getElementById('codeFrame').contentWindow.document;
    doc.open();
    doc.write(content);
    doc.close();
  } else {
    // Nếu là văn bản thường
    bodyEl.innerHTML = content.replace(/\n/g, '<br>');
  }
}

// Tải danh sách bài cũ
async function loadPosts() {
  const selectEl = document.getElementById('postSelect');
  if (!GH_CONFIG.token) {
    selectEl.innerHTML = '<option value="">Chưa nhập Token! Mở mục Cấu hình để nhập.</option>';
    return;
  }

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/_posts`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    
    if (!res.ok) {
      selectEl.innerHTML = `<option value="">Lỗi ${res.status}: Lấy danh sách thất bại</option>`;
      return;
    }

    const files = await res.json();
    rawPostsList = files.filter(f => f.type === 'file' && (f.name.endsWith('.html') || f.name.endsWith('.md')));

    selectEl.innerHTML = '<option value="">-- Chọn bài viết cũ để sửa (' + rawPostsList.length + ' bài) --</option>';
    rawPostsList.reverse().forEach((file, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = file.name.replace(/^\d{4}-\d{2}-\d{2}-/, '');
      selectEl.appendChild(opt);
    });
  } catch (err) {
    selectEl.innerHTML = '<option value="">Lỗi kết nối API!</option>';
  }
}

document.getElementById('postSelect').addEventListener('change', (e) => {
  const idx = e.target.value;
  if (idx !== "") {
    editPost(rawPostsList[idx].path, rawPostsList[idx].sha);
  } else {
    resetForm();
  }
});

function resetForm() {
  currentSha = null; currentPath = null;
  document.getElementById('postForm').reset();
  document.getElementById('postSelect').value = "";
  document.getElementById('submitBtn').textContent = '🚀 Đăng bài ngay';
  document.getElementById('submitBtn').style.background = 'var(--pri)';
}

async function editPost(path, sha) {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${path}`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    const data = await res.json();
    const rawText = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));

    const titleMatch = rawText.match(/title:\s*["']?([^"'\n]+)["']?/);
    const typeMatch = rawText.match(/type:\s*(\w+)/);

    const contentParts = rawText.split(/^---$/m);
    let body = contentParts.length >= 3 ? contentParts.slice(2).join('---').trim() : rawText;

    document.getElementById('title').value = titleMatch ? titleMatch[1] : path.split('/').pop();
    
    const postType = typeMatch ? typeMatch[1] : (path.endsWith('.html') ? 'code' : 'text');
    document.querySelector(`input[name="postType"][value="${postType}"]`).checked = true;

    if (postType === 'code') {
      body = body.replace(/^```html\n?/, '').replace(/\n?```$/, '');
    }
    
    document.getElementById('content').value = body;
    currentSha = sha; currentPath = path;
    
    document.getElementById('submitBtn').textContent = '💾 Lưu thay đổi';
    document.getElementById('submitBtn').style.background = '#2563eb';
    switchTab('editTab');
  } catch(e) {
    alert('Lỗi khi đọc bài viết!');
  }
}

// Submit Form Đăng / Cập nhật
document.getElementById('postForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!GH_CONFIG.token) return alert('Vui lòng nhập Token trước!');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  const title = document.getElementById('title').value.trim();
  const rawContent = document.getElementById('content').value;
  const isCode = document.querySelector('input[name="postType"][value="code"]').checked;

  const today = new Date().toISOString().split('T')[0];
  const slug = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
  
  const finalBody = isCode ? "```html\n" + rawContent + "\n```" : rawContent;
  const fileContent = `---\nlayout: post\ntitle: "${title}"\ndate: ${today}\ntype: ${isCode ? 'code' : 'text'}\n---\n\n${finalBody}`;
  
  const filePath = currentPath || `_posts/${today}-${slug}.html`;
  const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

  const payload = { message: `Update/Create: ${title}`, content: encodedContent };
  if (currentSha) payload.sha = currentSha;

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${filePath}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      alert(currentSha ? '✅ Đã lưu thay đổi!' : '✅ Đã đăng bài mới!');
      resetForm();
      loadPosts();
    } else {
      const err = await res.json();
      alert('❌ Lỗi: ' + err.message);
    }
  } catch (err) {
    alert('❌ Lỗi kết nối!');
  } finally {
    btn.disabled = false;
  }
});

loadPosts();
</script>
