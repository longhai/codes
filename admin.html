---
layout: null
---
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/split.js@1.6.5/dist/split.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#eee;font:14px Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
header{height:48px;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#181818;border-bottom:1px solid #333}
header button{height:34px;border:1px solid #444;background:#222;color:#eee;border-radius:6px;padding:0 10px}
header button:hover{background:#333}
.title{font-weight:bold;margin-right:auto}
main{position:relative;flex:1;min-height:0}
#editor,#preview{min-width:0;min-height:0;overflow:hidden}
#editor{display:flex;flex-direction:column;padding:8px;gap:7px}
#preview{background:#fff}
#preview iframe{width:100%;height:100%;border:0;background:#fff}
textarea{flex:1;width:100%;resize:none;background:#0b0b0b;color:#ddd;border:1px solid #333;border-radius:6px;padding:10px;outline:none;font:13px Consolas,monospace}
input,select{height:36px;background:#181818;color:#eee;border:1px solid #444;border-radius:6px;padding:0 9px;outline:none}
.row{display:flex;gap:6px}
.row>*{flex:1;min-width:0}
#status{font-size:12px;color:#999;display:flex;align-items:center;padding:0 3px}
.file{display:none}
.mobile-tabs{display:none}
.auth{
 position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20
}
.authbox{width:min(420px,92vw);background:#181818;border:1px solid #444;border-radius:10px;padding:15px}
.authbox h3{margin:0 0 12px}
.authbox input{width:100%;margin-bottom:8px}
.authbox .row button{height:36px}
@media(max-width:700px){
 header{height:48px}
 .desktop{display:none!important}
 .mobile-tabs{display:flex;height:40px;background:#181818;border-bottom:1px solid #333}
 .mobile-tabs button{flex:1;border:0;background:#181818;color:#aaa}
 .mobile-tabs button.active{background:#292929;color:#fff}
 main{height:calc(100% - 40px)}
 #editor,#preview{position:absolute;inset:0;width:100%!important;height:100%!important}
 #preview{display:none}
 body.preview #editor{display:none}
 body.preview #preview{display:block}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="title">Admin</div>
 <button onclick="resetForm()">＋ Mới</button>
 <label>
  <button onclick="fileInput.click()">📂 Mở</button>
  <input id="fileInput" class="file" type="file" accept=".html,.htm,.txt,.md">
 </label>
 <button onclick="showAuth()">⚙️</button>
 <button class="desktop" onclick="changePos()">↔️</button>
 <button class="desktop" onclick="toggleFull()">⛶</button>
</header>

<div class="mobile-tabs">
 <button id="tabEdit" class="active" onclick="mobileTab(0)">✏️ Sửa</button>
 <button id="tabPreview" onclick="mobileTab(1)">👁 Xem</button>
</div>

<main id="main">
 <section id="editor">
  <div class="row">
   <select id="postSelect">
    <option value="">＋ Bài mới</option>
   </select>
   <button onclick="delPost()" id="delBtn">🗑 Xóa</button>
  </div>

  <input id="title" placeholder="Tiêu đề">

  <div id="status">Sẵn sàng</div>

  <textarea id="content" spellcheck="false"></textarea>

  <div class="row">
   <button onclick="subForm()" id="subBtn">🚀 Đăng</button>
   <button onclick="pv()">👁 Xem</button>
  </div>
 </section>

 <section id="preview">
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
 </section>
</main>
</div>

<div class="auth" id="auth">
 <div class="authbox">
  <h3>GitHub</h3>
  <input id="owner" placeholder="Owner">
  <input id="repo" placeholder="Repository">
  <input id="token" type="password" placeholder="Token">

  <div class="row">
   <button onclick="saveCfg()">💾 Lưu</button>
   <button onclick="clearKey()">🗑 Xóa Key</button>
   <button onclick="hideAuth()">Đóng</button>
  </div>
 </div>
</div>

<script>
const KEY='gh_cfg';

let C=JSON.parse(localStorage.getItem(KEY)||'{}'),
    list=[],
    cSha=null,
    cPath=null,
    dirty=false,
    busy=false,
    splitInstance=null,
    currentPosIndex=0;

const positions=['right','bottom','left','top'];

const $=id=>document.getElementById(id);

function utf8ToBase64(str){
 const bytes=new TextEncoder().encode(str);
 let bin='',n=0x8000;
 for(let i=0;i<bytes.length;i+=n)
  bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+n));
 return btoa(bin);
}

function base64ToUtf8(str){
 const bin=atob(str.replace(/\s/g,''));
 const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new TextDecoder().decode(bytes);
}

function apiUrl(path){
 return `https://api.github.com/repos/${encodeURIComponent(C.owner)}/${encodeURIComponent(C.repo)}/contents/`+
 path.split('/').map(encodeURIComponent).join('/');
}

async function req(path,method='GET',body=null){
 const opt={
  method,
  headers:{
   Authorization:`Bearer ${C.token}`,
   Accept:'application/vnd.github+json',
   'X-GitHub-Api-Version':'2022-11-28'
  }
 };
 if(body){
  opt.headers['Content-Type']='application/json';
  opt.body=JSON.stringify(body);
 }
 return fetch(apiUrl(path),opt);
}

async function fetchFile(path){
 const r=await req(path);
 let d={};
 try{d=await r.json()}catch{}
 return {ok:r.ok,status:r.status,data:d};
}

function setStatus(s){
 $('status').textContent=s;
}

function markDirty(){
 dirty=true;
 setStatus('Chưa lưu');
}

function confirmLose(){
 return !dirty||confirm('⚠️ Nội dung chưa lưu. Tiếp tục?');
}

function renderList(selected=cPath){
 const s=$('postSelect');
 s.innerHTML='<option value="">＋ Bài mới</option>';

 list.forEach((x,i)=>{
  const o=document.createElement('option');
  o.value=i;
  o.textContent=x.name||x.path;
  s.appendChild(o);
 });

 if(selected){
  const i=list.findIndex(x=>x.path===selected);
  s.value=i>=0?i:'';
 }else s.value='';
}

async function load(){
 if(!C.owner||!C.repo||!C.token){
  setStatus('Chưa cấu hình GitHub');
  return;
 }

 setStatus('Đang tải...');

 try{
  const r=await req('_posts');

  if(!r.ok){
   const e=await r.json().catch(()=>({}));
   throw Error(e.message||`HTTP ${r.status}`);
  }

  const d=await r.json();

  list=Array.isArray(d)
   ? d.filter(x=>/\.(html?|md)$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name))
   : [];

  renderList();
  setStatus(`${list.length} bài`);
 }catch(e){
  setStatus('Lỗi');
  alert(e.message);
 }
}

$('postSelect').onchange=async e=>{
 const v=e.target.value;

 if(!confirmLose()){
  const i=list.findIndex(x=>x.path===cPath);
  e.target.value=i>=0?i:'';
  return;
 }

 if(v===''){
  clearForm();
  return;
 }

 await edit(list[Number(v)].path);
};

function clearForm(){
 cSha=null;
 cPath=null;
 dirty=false;
 $('title').value='';
 $('content').value='';
 $('postSelect').value='';
 $('subBtn').textContent='🚀 Đăng';
 $('delBtn').disabled=true;
 setStatus('Bài mới');
 pv();
}

function resetForm(){
 if(!confirmLose())return;
 clearForm();
}

async function edit(path){
 if(!C.token){
  showAuth();
  return;
 }

 setStatus('Đang tải...');

 const r=await fetchFile(path);

 if(!r.ok){
  alert(r.data.message||`HTTP ${r.status}`);
  setStatus('Lỗi');
  return;
 }

 const d=r.data;

 cSha=d.sha;
 cPath=d.path||path;

 let text=base64ToUtf8(d.content||'');

 text=text.replace(/^---[\s\S]*?---\s*/,'');
 text=text.replace(/^```(?:html|markdown|md)?\s*/i,'').replace(/\s*```\s*$/,'');

 $('content').value=text;

 const m=text.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
 $('title').value=m?m[1].trim():path.split('/').pop().replace(/\.(html?|md)$/i,'');

 dirty=false;
 $('subBtn').textContent='💾 Lưu';
 $('delBtn').disabled=false;
 setStatus('Đã tải');
 pv();
}

async function delPost(){
 if(busy||!cPath)return;

 if(!confirmLose())return;

 if(!confirm(`Xóa "${cPath}"?`))return;

 busy=true;
 $('delBtn').disabled=true;
 $('subBtn').disabled=true;
 setStatus('Đang xóa...');

 try{
  let r=await req(cPath);

  if(!r.ok)throw Error((await r.json().catch(()=>({}))).message||`HTTP ${r.status}`);

  let d=await r.json();

  r=await req(cPath,'DELETE',{
   message:`Delete ${cPath}`,
   sha:d.sha
  });

  if(r.status===409){
   const latest=await fetchFile(cPath);
   if(!latest.ok)throw Error(latest.data.message||`HTTP ${latest.status}`);

   r=await req(cPath,'DELETE',{
    message:`Delete ${cPath}`,
    sha:latest.data.sha
   });
  }

  if(!r.ok){
   const e=await r.json().catch(()=>({}));
   throw Error(e.message||`HTTP ${r.status}`);
  }

  list=list.filter(x=>x.path!==cPath);

  clearForm();
  renderList();
  setStatus('Đã xóa');
 }catch(e){
  alert(e.message);
  setStatus('Lỗi');
 }finally{
  busy=false;
  $('subBtn').disabled=false;
  $('delBtn').disabled=!cPath;
 }
}

function slugify(s){
 return s.toString().normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'')
  .toLowerCase()
  .replace(/đ/g,'d')
  .replace(/[^a-z0-9]+/g,'-')
  .replace(/^-+|-+$/g,'')
  .slice(0,100);
}

async function subForm(){
 if(busy)return;

 if(!C.owner||!C.repo||!C.token){
  showAuth();
  return;
 }

 let text=$('content').value;
 let title=$('title').value.trim();

 if(!text.trim()){
  alert('Nội dung trống');
  return;
 }

 if(!title){
  const m=text.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  title=m?m[1].trim():'Bài viết';
  $('title').value=title;
 }

 const isNew=!cPath;
 const path=cPath||`_posts/${new Date().toISOString().slice(0,10)}-${slugify(title)||'post'}.html`;

 busy=true;
 $('subBtn').disabled=true;
 $('delBtn').disabled=true;
 setStatus('Đang lưu...');

 try{
  let sha=cSha;

  if(!isNew){
   const latest=await fetchFile(path);
   if(!latest.ok)throw Error(latest.data.message||`HTTP ${latest.status}`);
   sha=latest.data.sha;
  }

  const body={
   message:isNew?`Add ${path}`:`Update ${path}`,
   content:utf8ToBase64(text)
  };

  if(sha)body.sha=sha;

  let r=await req(path,'PUT',body);

  if(r.status===409&&!isNew){
   const latest=await fetchFile(path);
   if(!latest.ok)throw Error(latest.data.message||`HTTP ${latest.status}`);

   body.sha=latest.data.sha;
   r=await req(path,'PUT',body);
  }

  const d=await r.json().catch(()=>({}));

  if(!r.ok)throw Error(d.message||`HTTP ${r.status}`);

  cPath=path;
  cSha=d.content?.sha||d.commit?.sha||sha||null;
  dirty=false;

  const old=list.find(x=>x.path===path);

  if(old){
   old.name=path.split('/').pop();
   old.sha=cSha;
  }else{
   list.push({
    name:path.split('/').pop(),
    path,
    sha:cSha
   });
   list.sort((a,b)=>a.name.localeCompare(b.name));
  }

  renderList(cPath);
  $('subBtn').textContent='💾 Lưu';
  $('delBtn').disabled=false;
  setStatus('Đã lưu');
 }catch(e){
  alert(e.message);
  setStatus('Lỗi');
 }finally{
  busy=false;
  $('subBtn').disabled=false;
  $('delBtn').disabled=!cPath;
 }
}

function pv(){
 $('frame').srcdoc=$('content').value||'';
}

$('title').addEventListener('input',markDirty);
$('content').addEventListener('input',()=>{
 markDirty();
 pv();
});

$('fileInput').onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;

 if(!confirmLose()){
  e.target.value='';
  return;
 }

 const rd=new FileReader();

 rd.onload=()=>{
  $('content').value=rd.result;
  $('title').value=f.name.replace(/\.(html?|md|txt)$/i,'');
  cSha=null;
  cPath=null;
  dirty=true;
  $('subBtn').textContent='🚀 Đăng';
  $('delBtn').disabled=true;
  setStatus('File đã mở');
  pv();
 };

 rd.readAsText(f);
 e.target.value='';
};

function showAuth(){
 $('owner').value=C.owner||'longhai';
 $('repo').value=C.repo||'codes';
 $('token').value=C.token||'';
 $('auth').style.display='flex';
}

function hideAuth(){
 $('auth').style.display='none';
}

async function saveCfg(){
 const owner=$('owner').value.trim();
 const repo=$('repo').value.trim();
 const token=$('token').value.trim();

 if(!owner||!repo||!token){
  alert('Nhập đủ Owner, Repository và Token');
  return;
 }

 if(dirty&&!confirm('Nội dung hiện tại chưa lưu. Đổi cấu hình GitHub?'))return;

 C={owner,repo,token};
 localStorage.setItem(KEY,JSON.stringify(C));

 list=[];
 cSha=null;
 cPath=null;
 dirty=false;

 $('auth').style.display='none';
 clearForm();
 await load();
}

function clearKey(){
 if(!confirm('Xóa Owner / Repository / Token đã lưu?'))return;

 localStorage.removeItem(KEY);

 C={};
 list=[];
 cSha=null;
 cPath=null;
 dirty=false;

 $('owner').value='';
 $('repo').value='';
 $('token').value='';

 $('auth').style.display='none';

 clearForm();
 renderList();
 setStatus('Đã xóa Key');
}

function changePos(){
 currentPosIndex=(currentPosIndex+1)%positions.length;
 initSplit(positions[currentPosIndex]);
}

function initSplit(pos=positions[currentPosIndex]){
 if(window.innerWidth<=700)return;

 if(splitInstance){
  splitInstance.destroy();
  splitInstance=null;
 }

 const a=$('#editor'),b=$('#preview');

 a.style.cssText='';
 b.style.cssText='';

 if(pos==='right'){
  splitInstance=Split(['#editor','#preview'],{
   direction:'horizontal',
   sizes:[55,45],
   minSize:[260,200],
   gutterSize:6
  });
 }

 if(pos==='left'){
  splitInstance=Split(['#preview','#editor'],{
   direction:'horizontal',
   sizes:[45,55],
   minSize:[200,260],
   gutterSize:6
  });
 }

 if(pos==='bottom'){
  splitInstance=Split(['#editor','#preview'],{
   direction:'vertical',
   sizes:[55,45],
   minSize:[260,200],
   gutterSize:6
  });
 }

 if(pos==='top'){
  splitInstance=Split(['#preview','#editor'],{
   direction:'vertical',
   sizes:[45,55],
   minSize:[200,260],
   gutterSize:6
  });
 }
}

function toggleFull(){
 if(!document.fullscreenElement)
  document.documentElement.requestFullscreen?.();
 else
  document.exitFullscreen?.();
}

function mobileTab(n){
 if(n){
  document.body.classList.add('preview');
  $('tabPreview').classList.add('active');
  $('tabEdit').classList.remove('active');
 }else{
  document.body.classList.remove('preview');
  $('tabEdit').classList.add('active');
  $('tabPreview').classList.remove('active');
 }
}

window.addEventListener('resize',()=>{
 if(window.innerWidth>700&&!splitInstance)initSplit();
});

window.addEventListener('beforeunload',e=>{
 if(dirty){
  e.preventDefault();
  e.returnValue='';
 }
});

$('delBtn').disabled=true;

load();
pv();
initSplit();
</script>
</body>
</html>
