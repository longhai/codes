layout: null

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/split.js@1.6.5/dist/split.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:Arial,sans-serif}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex;flex-direction:column}
header{height:52px;display:flex;align-items:center;gap:7px;padding:7px 10px;background:#181818;border-bottom:1px solid #333}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
button,.btn,select{border:1px solid #444;background:#242424;color:#eee;border-radius:7px;padding:7px 10px}
button:hover{background:#303030}
button:disabled{opacity:.5;cursor:not-allowed}
.main{flex:1;min-height:0;display:flex}
.editor,.preview{min-width:0;min-height:0;overflow:hidden}
.editor{display:flex;flex-direction:column;padding:10px}
.preview{background:#0b0b0b}
#content{width:100%;height:100%;resize:none;border:1px solid #333;border-radius:7px;background:#0d0d0d;color:#ddd;padding:10px;outline:none}
#title{width:100%;margin-bottom:8px}
#postSelect{flex:1;min-width:80px}
#pv{width:100%;height:100%;border:0;background:#fff}
.form{display:flex;flex-direction:column;height:100%}
.tools{display:flex;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.bottom{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.bottom button{flex:1}
.status{font-size:12px;color:#999;display:flex;align-items:center;padding:0 5px;white-space:nowrap}
#authBox{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center;padding:15px}
#authBox.show{display:flex}
.auth{width:min(420px,100%);background:#191919;border:1px solid #444;border-radius:10px;padding:15px}
.auth h2{font-size:17px;margin:0 0 12px}
.auth input{width:100%;margin-bottom:8px}
.auth .row{display:flex;gap:7px}
.auth .row button{flex:1}
input{background:#101010;color:#eee;border:1px solid #444;border-radius:7px;padding:8px;outline:none}
.mobileTabs{display:none}
.gutter{background:#222}
.gutter.gutter-horizontal{cursor:col-resize}
.gutter.gutter-vertical{cursor:row-resize}
@media(max-width:700px){
header{height:auto;min-height:52px;flex-wrap:wrap}
header h1{width:100%}
.mobileTabs{display:flex;gap:6px;padding:7px;background:#181818;border-bottom:1px solid #333}
.mobileTabs button{flex:1}
.main{display:block}
.editor,.preview{height:calc(100vh - 110px)}
.preview{display:none}
.main.showPreview .editor{display:none}
.main.showPreview .preview{display:block}
}
</style>
</head>
<body>

<div class="app">
<header>
<h1>Admin</h1>
<button onclick="newPost()">＋ Mới</button>
<button onclick="fileInput.click()">📂 Mở</button>
<input id="fileInput" type="file" accept=".html,.htm,.txt,.md" hidden>
<select id="postSelect"></select>
<button onclick="openAuth()">⚙️</button>
<button onclick="changePos()">↔️</button>
<span class="status" id="status"></span>
</header>

<div class="mobileTabs">
<button onclick="showTab(0)">✏️ Edit</button>
<button onclick="showTab(1)">👁 Preview</button>
</div>

<div class="main" id="main">
<section class="editor" id="editor">
<div class="form">
<input id="title" placeholder="Tiêu đề">
<textarea id="content" placeholder="Nội dung..."></textarea>
<div class="bottom">
<button id="delBtn" onclick="delPost()">🗑 Xóa</button>
<button id="saveBtn" onclick="subForm()">🚀 Đăng</button>
</div>
</div>
</section>
<section class="preview">
<iframe id="pv" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
</section>
</div>
</div>

<div id="authBox">
<div class="auth">
<h2>GitHub</h2>
<input id="owner" placeholder="Owner">
<input id="repo" placeholder="Repository">
<input id="token" type="password" placeholder="GitHub Token">
<div class="row">
<button onclick="saveCfg()">💾 Lưu</button>
<button onclick="clearKey()">🗑 Xóa Key</button>
<button onclick="closeAuth()">Đóng</button>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);

let C=JSON.parse(localStorage.getItem('gh_cfg')||'{}'),
list=[],cSha=null,cPath=null,dirty=false,splitInstance=null;
const positions=['right','bottom','left','top'];
let currentPosIndex=0;

$('owner').value=C.owner||'longhai';
$('repo').value=C.repo||'codes';
$('token').value=C.token||'';

function utf8ToBase64(s){
 const b=new TextEncoder().encode(s);let x='',n=0x8000;
 for(let i=0;i<b.length;i+=n)x+=String.fromCharCode.apply(null,b.subarray(i,i+n));
 return btoa(x);
}
function base64ToUtf8(s){
 const b=atob(s.replace(/\s/g,'')),u=new Uint8Array(b.length);
 for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
 return new TextDecoder().decode(u);
}

function apiUrl(path){
 return 'https://api.github.com/repos/'+encodeURIComponent(C.owner)+'/'+encodeURIComponent(C.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
}
async function req(path,method='GET',body=null){
 const o={
  method,
  headers:{
   Authorization:`Bearer ${C.token}`,
   'Content-Type':'application/json',
   Accept:'application/vnd.github+json',
   'X-GitHub-Api-Version':'2022-11-28'
  }
 };
 if(body)o.body=JSON.stringify(body);
 return fetch(apiUrl(path),o);
}
async function fetchFile(path){
 const r=await req(path);
 let d=null;
 try{d=await r.json()}catch{}
 return {ok:r.ok,status:r.status,data:d};
}

function markDirty(){
 dirty=true;
}
$('title').addEventListener('input',markDirty);
$('content').addEventListener('input',()=>{dirty=true;pv()});

function guard(){
 return !dirty||confirm('⚠️ Nội dung chưa lưu. Bạn có muốn tiếp tục?');
}

function openAuth(){
 $('authBox').classList.add('show');
}
function closeAuth(){
 $('authBox').classList.remove('show');
}
function clearKey(){
 if(!confirm('Xóa toàn bộ key GitHub đã lưu?'))return;
 localStorage.removeItem('gh_cfg');
 C={};
 $('owner').value='';
 $('repo').value='';
 $('token').value='';
 list=[];
 cSha=cPath=null;
 $('postSelect').innerHTML='';
 $('title').value='';
 $('content').value='';
 dirty=false;
 closeAuth();
 alert('Đã xóa key.');
}

async function saveCfg(){
 const owner=$('owner').value.trim();
 const repo=$('repo').value.trim();
 const token=$('token').value.trim();
 if(!owner||!repo||!token)return alert('Vui lòng nhập đủ thông tin.');
 C={owner,repo,token};
 localStorage.setItem('gh_cfg',JSON.stringify(C));
 list=[];
 cSha=cPath=null;
 dirty=false;
 closeAuth();
 await load();
}

function renderList(selected=''){
 const s=$('postSelect');
 s.innerHTML='<option value="">-- Chọn bài --</option>';
 list.forEach((x,i)=>{
  const o=document.createElement('option');
  o.value=i;
  o.textContent=x.name||x.path.split('/').pop();
  o.dataset.path=x.path;
  s.appendChild(o);
 });
 if(selected){
  const i=list.findIndex(x=>x.path===selected);
  if(i>=0)s.value=i;
 }
}

async function load(){
 if(!C.owner||!C.repo||!C.token){
  openAuth();
  return;
 }
 $('status').textContent='⏳';
 try{
  const r=await req('_posts');
  if(!r.ok){
   let d={};try{d=await r.json()}catch{}
   throw Error(d.message||`HTTP ${r.status}`);
  }
  const d=await r.json();
  list=(Array.isArray(d)?d:[])
   .filter(x=>/\.html?$|\.md$/i.test(x.name))
   .map(x=>({name:x.name,path:x.path,sha:x.sha}));
  renderList(cPath);
  $('status').textContent=`${list.length} bài`;
 }catch(e){
  $('status').textContent='';
  alert('Lỗi tải: '+e.message);
 }
}

$('postSelect').onchange=async e=>{
 if(!guard()){
  const i=list.findIndex(x=>x.path===cPath);
  e.target.value=i>=0?i:'';
  return;
 }
 const v=e.target.value;
 if(v==='')newPost(true);
 else await edit(list[Number(v)].path);
};

async function edit(path){
 $('status').textContent='⏳';
 const r=await fetchFile(path);
 if(!r.ok){
  $('status').textContent='';
  return alert('Không tải được file.');
 }
 const d=r.data;
 let text=base64ToUtf8(d.content||'');
 text=text.replace(/^---[\s\S]*?---\s*/,'');
 text=text.replace(/^```(?:html|markdown|md)?\s*/i,'').replace(/\s*```$/,'');
 cSha=d.sha;
 cPath=d.path||path;
 $('title').value=cPath.split('/').pop().replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ');
 $('content').value=text;
 dirty=false;
 $('status').textContent='';
 renderList(cPath);
 pv();
}

function newPost(force=false){
 if(!force&&!guard())return;
 cSha=cPath=null;
 dirty=false;
 $('title').value='';
 $('content').value='';
 $('postSelect').value='';
 $('status').textContent='Bài mới';
 pv();
}

function slug(s){
 return s.toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/đ/g,'d')
  .replace(/[^a-z0-9]+/g,'-')
  .replace(/^-|-$/g,'');
}

async function delPost(){
 if(!cPath)return alert('Chưa chọn bài.');
 if(!confirm('Xóa bài này?'))return;

 const b=$('delBtn');
 b.disabled=true;
 b.textContent='⏳ Xóa...';

 try{
  let r=await fetchFile(cPath);
  if(!r.ok)throw Error(r.data?.message||`HTTP ${r.status}`);

  let sha=r.data.sha;
  let res=await req(cPath,'DELETE',{message:`Delete ${cPath}`,sha});

  if(res.status===409){
   r=await fetchFile(cPath);
   if(!r.ok)throw Error(r.data?.message||`HTTP ${r.status}`);
   res=await req(cPath,'DELETE',{message:`Delete ${cPath}`,sha:r.data.sha});
  }

  if(!res.ok){
   let d={};try{d=await res.json()}catch{}
   throw Error(d.message||`HTTP ${res.status}`);
  }

  list=list.filter(x=>x.path!==cPath);
  cSha=cPath=null;
  dirty=false;
  renderList();
  $('title').value='';
  $('content').value='';
  pv();
  $('status').textContent='Đã xóa';
 }catch(e){
  alert('Lỗi xóa: '+e.message);
 }finally{
  b.disabled=false;
  b.textContent='🗑 Xóa';
 }
}

async function subForm(){
 if(!C.token)return openAuth();

 let title=$('title').value.trim();
 const content=$('content').value;
 if(!title){
  const m=content.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  title=m?m[1].trim():'Bài viết';
 }

 const oldPath=cPath;
 const path=cPath||`_posts/${new Date().toISOString().slice(0,10)}-${slug(title)||'post'}.html`;

 const b=$('saveBtn');
 b.disabled=true;
 b.textContent=cPath?'⏳ Lưu...':'⏳ Đăng...';

 try{
  let sha=cSha;

  if(cPath){
   const r=await fetchFile(path);
   if(!r.ok)throw Error(r.data?.message||`HTTP ${r.status}`);
   sha=r.data.sha;
  }

  let res=await req(path,'PUT',{
   message:cPath?`Update ${path}`:`Add ${path}`,
   content:utf8ToBase64(content),
   ...(sha?{sha}:{})
  });

  if(res.status===409){
   const r=await fetchFile(path);
   if(!r.ok)throw Error(r.data?.message||`HTTP ${r.status}`);
   res=await req(path,'PUT',{
    message:cPath?`Update ${path}`:`Add ${path}`,
    content:utf8ToBase64(content),
    sha:r.data.sha
   });
  }

  if(!res.ok){
   let d={};try{d=await res.json()}catch{}
   throw Error(d.message||`HTTP ${res.status}`);
  }

  const d=await res.json();
  cSha=d.content?.sha||null;
  cPath=d.content?.path||path;
  dirty=false;

  const item={name:cPath.split('/').pop(),path:cPath,sha:cSha};
  const i=list.findIndex(x=>x.path===cPath);

  if(i>=0)list[i]=item;
  else list.unshift(item);

  renderList(cPath);
  $('status').textContent='✓ Đã lưu';
 }catch(e){
  alert('Lỗi lưu: '+e.message);
 }finally{
  b.disabled=false;
  b.textContent=cPath?'💾 Lưu':'🚀 Đăng';
 }
}

$('fileInput').onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;
 if(!guard()){
  e.target.value='';
  return;
 }
 const r=new FileReader();
 r.onload=()=>{
  const name=f.name.replace(/\.[^.]+$/,'');
  $('title').value=name;
  $('content').value=r.result;
  cSha=cPath=null;
  dirty=true;
  $('postSelect').value='';
  pv();
 };
 r.readAsText(f);
 e.target.value='';
};

function pv(){
 const src=$('content').value;
 $('pv').srcdoc=src;
}

function showTab(n){
 if(innerWidth>700)return;
 $('main').classList.toggle('showPreview',n===1);
 if(n===1)pv();
}

function initSplit(){
 if(innerWidth<=700)return;
 splitInstance=Split(['#editor','.preview'],{
  sizes:[50,50],
  minSize:[180,180],
  gutterSize:6,
  direction:'horizontal'
 });
}

function changePos(){
 if(innerWidth<=700)return;
 currentPosIndex=(currentPosIndex+1)%positions.length;
 const p=positions[currentPosIndex];

 if(splitInstance)splitInstance.destroy();

 const main=$('main');
 const editor=$('editor');
 const preview=document.querySelector('.preview');

 if(p==='right'||p==='left'){
  main.style.flexDirection='row';
  if(p==='left'){
   main.insertBefore(preview,editor);
  }else{
   main.insertBefore(editor,preview);
  }
  splitInstance=Split([editor,preview],{
   sizes:[50,50],
   minSize:[180,180],
   gutterSize:6,
   direction:'horizontal'
  });
 }else{
  main.style.flexDirection='column';
  if(p==='top'){
   main.insertBefore(preview,editor);
  }else{
   main.insertBefore(editor,preview);
  }
  splitInstance=Split([editor,preview],{
   sizes:[50,50],
   minSize:[180,180],
   gutterSize:6,
   direction:'vertical'
  });
 }
}

window.addEventListener('beforeunload',e=>{
 if(dirty){
  e.preventDefault();
  e.returnValue='';
 }
});

load();
pv();
initSplit();
</script>
</body>
</html>
