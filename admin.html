---
layout: default
title: Quản lý & Preview Bài viết
body_class: page-index
---

<style>
  /* Tối ưu không không gian - Tràn màn hình */
  .admin-wrapper {
    width: 100%;
    max-width: 100% !important;
    padding: 10px !important;
    box-sizing: border-box;
  }
  .admin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  .tab-btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  .tab-btn.active {
    background: var(--pri);
    color: #fff;
    border-color: var(--pri);
  }

  /* Responsive cho Điện thoại */
  @media (max-width: 768px) {
    .admin-grid {
      grid-template-columns: 1fr; /* Xếp dọc trên mobile */
    }
    .mobile-hide {
      display: none !important;
    }
    .mobile-show {
      display: block !important;
    }
  }
</style>

<div class="admin-wrapper">
  
  <!-- CẤU HÌNH GITHUB -->
  <details style="margin-bottom: 10px; background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
    <summary style="cursor: pointer; font-weight: bold; font-size: 13px;">⚙️ Cấu hình GitHub Token</summary>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;">
      <input type="text" id="cfgOwner" placeholder="Tài khoản GitHub" style="flex: 1; min-width: 120px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <input type="text" id="cfgRepo" placeholder="Repository" style="flex: 1; min-width: 120px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <input type="password" id="cfgToken" placeholder="GitHub Token (ghp_...)" style="flex: 2; min-width: 200px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <button type="button" onclick="saveConfig()" style="padding: 8px 15px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-weight: bold; cursor: pointer;">Lưu</button>
    </div>
  </details>

  <!-- KHU VỰC ĐỌC BÀI CŨ -->
  <div style="background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center;">
    <select id="postSelect" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px;">
      <option value="">-- Danh sách bài viết cũ --</option>
    </select>
    <button type="button" onclick="resetForm()" style="padding: 8px 12px; background: #22c55e; color: #fff; border: 0; border-radius: 6px; font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer;">➕ Bài mới</button>
  </div>

  <!-- BỘ CHUYỂN TAB TRÊN MOBILE -->
  <div style="display: flex; gap: 10px; margin-bottom: 10px;" class="mobile-show">
    <button type="button" class="tab-btn active" onclick="switchTab('edit')">✏️ Soạn thảo</button>
    <button type="button" class="tab-btn" onclick="switchTab('preview')">👁️ Xem trước</button>
  </div>

  <!-- LƯỚI CHÍNH: SOẠN THẢO & XEM TRƯỚC -->
  <div class="admin-grid">
    
    <!-- CỘT 1: FORM SOẠN THẢO -->
    <div id="colEdit" style="background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
      <input type="text" id="title" placeholder="Tiêu đề bài viết..." required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; box-sizing: border-box;">

      <div style="display: flex; gap: 15px; background: var(--bg); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);">
        <label style="font-size: 13px; cursor: pointer;"><input type="radio" name="postType" value="code" checked onchange="updatePreview()"> 💻 Mã Code</label>
        <label style="font-size: 13px; cursor: pointer;"><input type="radio" name="postType" value="text" onchange="updatePreview()"> 📝 Bài viết thường</label>
      </div>

      <textarea id="content" placeholder="Nhập nội dung mã HTML/JS hoặc văn bản..." rows="16" required oninput="updatePreview()" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: monospace; font-size: 13px; line-height: 1.4; box-sizing: border-box; resize: vertical;"></textarea>

      <button type="button" id="submitBtn" onclick="submitPost()" style="width: 100%; padding: 12px; background: var(--pri); color: #fff; border: 0; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;">🚀 Đăng bài ngay</button>
    </div>

    <!-- CỘT 2: KHUNG XEM TRƯỚC (PREVIEW) -->
    <div id="colPreview" class="mobile-hide" style="background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column;">
      <div style="font-size: 12px; font-weight: bold; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Giao diện hiển thị thực tế:</div>
      <div id="previewArea" style="flex: 1; min-height: 350px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-y: auto;">
        <!-- Nội dung sẽ render thực tế tại đây -->
      </div>
    </div>

  </div>

</div>

<script>
let GH_CONFIG = JSON.parse(localStorage.getItem('gh_cfg') || '{}');
let rawPostsList = [];
let currentSha = null, currentPath = null;

document.getElementById('cfgOwner').value = GH_CONFIG.owner || 'longhai';
document.getElementById('cfgRepo').value = GH_CONFIG.repo || 'codes';
document.getElementById('cfgToken').value = GH_CONFIG.token || '';

function saveConfig() {
  GH_CONFIG = {
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    token: document.getElementById('cfgToken').value.trim()
  };
  localStorage.setItem('gh_cfg', JSON.stringify(GH_CONFIG));
  alert('Đã lưu cấu hình!');
  loadPosts();
}

// 1. CẬP NHẬT XEM TRƯỚC (LIVE PREVIEW)
function updatePreview() {
  const content = document.getElementById('content').value;
  const isCode = document.querySelector('input[name="postType"]:checked').value === 'code';
  const previewEl = document.getElementById('previewArea');

  if (!content.trim()) {
    previewEl.innerHTML = '<span style="color: #666; font-style: italic;">Nội dung xem trước sẽ xuất hiện tại đây...</span>';
    return;
  }

  if (isCode) {
    // Nếu là mã Code HTML/JS: Render thực tế vào iframe hoặc div sandbox
    previewEl.innerHTML = content;
  } else {
    // Nếu là bài viết thường: Xuống dòng tự động
    previewEl.innerHTML = content.replace(/\n/g, '<br>');
  }
}

// 2. TẢI BÀI CŨ
async function loadPosts() {
  const selectEl = document.getElementById('postSelect');
  if (!GH_CONFIG.token) {
    selectEl.innerHTML = '<option value="">Chưa nhập Token!</option>';
    return;
  }

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/_posts`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    
    if (!res.ok) return selectEl.innerHTML = `<option value="">Lỗi ${res.status}: Sai Token/Repo</option>`;

    const files = await res.json();
    rawPostsList = files.filter(f => f.type === 'file' && (f.name.endsWith('.html') || f.name.endsWith('.md')));

    selectEl.innerHTML = '<option value="">-- Chọn bài viết để sửa (' + rawPostsList.length + ' bài) --</option>';
    
    rawPostsList.reverse().forEach((file, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = file.name.replace(/^\d{4}-\d{2}-\d{2}-/, '');
      selectEl.appendChild(opt);
    });
  } catch (err) {
    selectEl.innerHTML = '<option value="">Không tải được bài cũ!</option>';
  }
}

document.getElementById('postSelect').addEventListener('change', (e) => {
  const idx = e.target.value;
  if (idx !== "") {
    const selectedFile = rawPostsList[idx];
    editPost(selectedFile.path, selectedFile.sha);
  } else {
    resetForm();
  }
});

function resetForm() {
  currentSha = null; currentPath = null;
  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  document.getElementById('postSelect').value = "";
  document.getElementById('submitBtn').textContent = '🚀 Đăng bài ngay';
  document.getElementById('submitBtn').style.background = 'var(--pri)';
  updatePreview();
}

async function editPost(path, sha) {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${path}`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    const data = await res.json();
    const rawText = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));

    const titleMatch = rawText.match(/title:\s*["']?([^"'\n]+)["']?/);
    const typeMatch = rawText.match(/type:\s*(\w+)/);

    const contentParts = rawText.split(/^---$/m);
    let body = contentParts.length >= 3 ? contentParts.slice(2).join('---').trim() : rawText;

    document.getElementById('title').value = titleMatch ? titleMatch[1] : path.split('/').pop();
    
    const postType = typeMatch ? typeMatch[1] : (path.endsWith('.html') ? 'code' : 'text');
    document.querySelector(`input[name="postType"][value="${postType}"]`).checked = true;

    if (postType === 'code') {
      body = body.replace(/^```html\n?/, '').replace(/\n?```$/, '');
    }
    
    document.getElementById('content').value = body;

    currentSha = sha; currentPath = path;
    document.getElementById('submitBtn').textContent = '💾 Lưu thay đổi';
    document.getElementById('submitBtn').style.background = '#2563eb';
    updatePreview();
  } catch(e) {
    alert('Lỗi tải nội dung bài!');
  }
}

// 3. CHUYỂN TAB TRÊN DIỆN THOẠI
function switchTab(tab) {
  const colEdit = document.getElementById('colEdit');
  const colPreview = document.getElementById('colPreview');
  const btns = document.querySelectorAll('.tab-btn');

  if (tab === 'edit') {
    colEdit.classList.remove('mobile-hide');
    colPreview.classList.add('mobile-hide');
    btns[0].classList.add('active');
    btns[1].classList.remove('active');
  } else {
    colEdit.classList.add('mobile-hide');
    colPreview.classList.remove('mobile-hide');
    btns[0].classList.remove('active');
    btns[1].classList.add('active');
    updatePreview();
  }
}

// 4. XỬ LÝ GỬI BÀI
async function submitPost() {
  if (!GH_CONFIG.token) return alert('Chưa nhập Token!');

  const btn = document.getElementById('submitBtn');
  const title = document.getElementById('title').value.trim();
  const rawContent = document.getElementById('content').value;
  const isCode = document.querySelector('input[name="postType"][value="code"]').checked;

  if (!title || !rawContent) return alert('Vui lòng nhập đầy đủ tiêu đề và nội dung!');

  btn.disabled = true;

  const today = new Date().toISOString().split('T')[0];
  const slug = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
  
  const finalBody = isCode ? "```html\n" + rawContent + "\n```" : rawContent;
  const fileContent = `---\nlayout: post\ntitle: "${title}"\ndate: ${today}\ntype: ${isCode ? 'code' : 'text'}\n---\n\n${finalBody}`;
  
  const filePath = currentPath || `_posts/${today}-${slug}.html`;
  const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

  const payload = { message: `Update/Create: ${title}`, content: encodedContent };
  if (currentSha) payload.sha = currentSha;

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${filePath}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      alert(currentSha ? '✅ Đã lưu cập nhật!' : '✅ Đã đăng bài mới!');
      resetForm();
      loadPosts();
    } else {
      const err = await res.json();
      alert('❌ Lỗi: ' + err.message);
    }
  } catch (err) {
    alert('❌ Lỗi kết nối!');
  } finally {
    btn.disabled = false;
  }
}

loadPosts();
</script>
