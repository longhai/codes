---
layout: default
title: Quản lý Bài viết
body_class: page-index
---
<style>
  .admin-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
  .preview-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; min-height: 350px; overflow-y: auto; }
  .tab-btn { padding: 8px 16px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; cursor: pointer; font-weight: bold; }
  .tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }
  
  /* Tối ưu 2 cột cho màn hình lớn (PC) */
  @media (min-width: 992px) {
    .admin-container { max-width: 1200px !important; }
    .admin-grid { grid-template-columns: 1fr 1fr; }
    .mobile-tabs { display: none !important; }
    .view-panel { display: block !important; }
  }
</style>

<div class="container admin-container" style="max-width: 650px; padding: 15px; margin: 0 auto;">
  
  <!-- CẤU HÌNH GITHUB -->
  <details style="margin-bottom: 15px; background: var(--card); padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
    <summary style="cursor: pointer; font-weight: bold; font-size: 14px;">⚙️ Cấu hình Token</summary>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
      <input type="text" id="cfgOwner" placeholder="Tên tài khoản GitHub" style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <input type="text" id="cfgRepo" placeholder="Tên Repository" style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <input type="password" id="cfgToken" placeholder="GitHub Token (ghp_...)" style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <button type="button" onclick="saveConfig()" style="padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-weight: bold;">Lưu cấu hình</button>
    </div>
  </details>

  <!-- THANH CHỌN BÀI CŨ -->
  <div style="background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <label for="postSelect" style="font-size: 13px; font-weight: bold;">📂 Bài viết đã đăng:</label>
      <button type="button" onclick="resetForm()" style="padding: 4px 10px; background: #22c55e; color: #fff; border: 0; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer;">➕ Tạo mới</button>
    </div>
    <select id="postSelect" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px;">
      <option value="">-- Chọn bài viết để sửa --</option>
    </select>
  </div>

  <!-- THANH CHUYỂN TAB TRÊN MOBILE -->
  <div class="mobile-tabs" style="display: flex; gap: 10px; margin-bottom: 15px;">
    <button type="button" class="tab-btn active" id="tabEditBtn" onclick="switchTab('edit')">✏️ Soạn thảo</button>
    <button type="button" class="tab-btn" id="tabPrevBtn" onclick="switchTab('preview')">👁️ Xem thực tế</button>
  </div>

  <div class="admin-grid">
    
    <!-- CỘT 1: SOẠN THẢO -->
    <div id="editPanel" class="view-panel" style="background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px;">
      <h3 id="formTitle" style="margin-bottom: 12px; font-size: 16px;">✏️ Soạn bài mới</h3>
      
      <form id="postForm" style="display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="title" placeholder="Tiêu đề bài viết..." required style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px;">

        <div style="display: flex; gap: 15px; background: var(--bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);">
          <label style="font-size: 13px; cursor: pointer;"><input type="radio" name="postType" value="code" checked> 💻 Mã Code</label>
          <label style="font-size: 13px; cursor: pointer;"><input type="radio" name="postType" value="text"> 📝 Văn bản</label>
        </div>

        <textarea id="content" placeholder="Nhập nội dung bài viết hoặc dán mã HTML/JS..." rows="12" required style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: monospace; font-size: 13px; line-height: 1.4;"></textarea>

        <button type="submit" id="submitBtn" style="padding: 12px; background: var(--pri); color: #fff; border: 0; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;">🚀 Đăng bài ngay</button>
      </form>
    </div>

    <!-- CỘT 2: XEM TRƯỚC THỰC TẾ -->
    <div id="previewPanel" class="view-panel" style="display: none;">
      <div class="preview-box">
        <span style="font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">Xem trước thực tế</span>
        <h1 id="pvTitle" style="margin: 10px 0; font-size: 20px;"></h1>
        <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 15px;">
        <div id="pvBody"></div>
      </div>
    </div>

  </div>

</div>

<script>
let GH_CONFIG = JSON.parse(localStorage.getItem('gh_cfg') || '{}');
let rawPostsList = [];
let currentSha = null, currentPath = null;

document.getElementById('cfgOwner').value = GH_CONFIG.owner || 'longhai';
document.getElementById('cfgRepo').value = GH_CONFIG.repo || 'codes';
document.getElementById('cfgToken').value = GH_CONFIG.token || '';

function saveConfig() {
  GH_CONFIG = {
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    token: document.getElementById('cfgToken').value.trim()
  };
  localStorage.setItem('gh_cfg', JSON.stringify(GH_CONFIG));
  alert('Đã lưu cấu hình!');
  loadPosts();
}

// Xử lý chuyển Tab trên Điện thoại
function switchTab(tab) {
  const editPnl = document.getElementById('editPanel');
  const prevPnl = document.getElementById('previewPanel');
  const btnEdit = document.getElementById('tabEditBtn');
  const btnPrev = document.getElementById('tabPrevBtn');

  if (tab === 'edit') {
    editPnl.style.display = 'block';
    prevPnl.style.display = 'none';
    btnEdit.classList.add('active');
    btnPrev.classList.remove('active');
  } else {
    editPnl.style.display = 'none';
    prevPnl.style.display = 'block';
    btnEdit.classList.remove('active');
    btnPrev.classList.add('active');
    updatePreview();
  }
}

// Cập nhật nội dung Xem thực tế Real-time
function updatePreview() {
  const title = document.getElementById('title').value || 'Tiêu đề bài viết...';
  const content = document.getElementById('content').value || 'Nội dung sẽ hiển thị ở đây...';
  const isCode = document.querySelector('input[name="postType"]:checked').value === 'code';

  document.getElementById('pvTitle').textContent = title;
  const pvBody = document.getElementById('pvBody');

  if (isCode) {
    pvBody.innerHTML = `<pre style="background:var(--bg); padding:12px; border-radius:6px; overflow-x:auto; border:1px solid var(--border); font-family:monospace; font-size:13px;"><code>${escapeHtml(content)}</code></pre>`;
  } else {
    pvBody.innerHTML = content.replace(/\n/g, '<br>');
  }
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Lắng nghe gõ phím để Live Preview tự cập nhật
document.getElementById('title').addEventListener('input', updatePreview);
document.getElementById('content').addEventListener('input', updatePreview);
document.querySelectorAll('input[name="postType"]').forEach(r => r.addEventListener('change', updatePreview));

// Tải bài viết cũ
async function loadPosts() {
  const selectEl = document.getElementById('postSelect');
  if (!GH_CONFIG.token) {
    selectEl.innerHTML = '<option value="">Chưa nhập Token!</option>';
    return;
  }

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/_posts`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    
    if (!res.ok) {
      selectEl.innerHTML = `<option value="">Lỗi ${res.status}: Sai Token/Repo</option>`;
      return;
    }

    const files = await res.json();
    rawPostsList = files.filter(f => f.type === 'file' && (f.name.endsWith('.html') || f.name.endsWith('.md')));

    selectEl.innerHTML = '<option value="">-- Chọn bài viết để sửa (' + rawPostsList.length + ' bài) --</option>';
    
    rawPostsList.reverse().forEach((file, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = file.name.replace(/^\d{4}-\d{2}-\d{2}-/, '');
      selectEl.appendChild(opt);
    });
  } catch (err) {
    selectEl.innerHTML = '<option value="">Không tải được bài cũ!</option>';
  }
}

document.getElementById('postSelect').addEventListener('change', (e) => {
  const idx = e.target.value;
  if (idx !== "") {
    const selectedFile = rawPostsList[idx];
    editPost(selectedFile.path, selectedFile.sha);
  } else {
    resetForm();
  }
});

function resetForm() {
  currentSha = null; currentPath = null;
  document.getElementById('postForm').reset();
  document.getElementById('postSelect').value = "";
  document.getElementById('formTitle').textContent = '✏️ Soạn bài mới';
  document.getElementById('submitBtn').textContent = '🚀 Đăng bài ngay';
  document.getElementById('submitBtn').style.background = 'var(--pri)';
  updatePreview();
}

async function editPost(path, sha) {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${path}`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    const data = await res.json();
    const rawText = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));

    const titleMatch = rawText.match(/title:\s*["']?([^"'\n]+)["']?/);
    const typeMatch = rawText.match(/type:\s*(\w+)/);

    const contentParts = rawText.split(/^---$/m);
    let body = contentParts.length >= 3 ? contentParts.slice(2).join('---').trim() : rawText;

    document.getElementById('title').value = titleMatch ? titleMatch[1] : path.split('/').pop();
    
    const postType = typeMatch ? typeMatch[1] : (path.endsWith('.html') ? 'code' : 'text');
    document.querySelector(`input[name="postType"][value="${postType}"]`).checked = true;

    if (postType === 'code') {
      body = body.replace(/^```html\n?/, '').replace(/\n?```$/, '');
    }
    
    document.getElementById('content').value = body;

    currentSha = sha; currentPath = path;
    document.getElementById('formTitle').textContent = '✏️ Cập nhật bài viết';
    document.getElementById('submitBtn').textContent = '💾 Lưu thay đổi';
    document.getElementById('submitBtn').style.background = '#2563eb';
    updatePreview();
  } catch(e) {
    alert('Lỗi tải nội dung bài!');
  }
}

document.getElementById('postForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!GH_CONFIG.token) return alert('Chưa nhập Token!');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  const title = document.getElementById('title').value.trim();
  const rawContent = document.getElementById('content').value;
  const isCode = document.querySelector('input[name="postType"]:checked').value === 'code';

  const today = new Date().toISOString().split('T')[0];
  const slug = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
  
  const finalBody = isCode ? "```html\n" + rawContent + "\n```" : rawContent;
  const fileContent = `---\nlayout: post\ntitle: "${title}"\ndate: ${today}\ntype: ${isCode ? 'code' : 'text'}\n---\n\n${finalBody}`;
  
  const filePath = currentPath || `_posts/${today}-${slug}.html`;
  const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

  const payload = { message: `Update/Create: ${title}`, content: encodedContent };
  if (currentSha) payload.sha = currentSha;

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${filePath}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      alert(currentSha ? '✅ Đã lưu cập nhật!' : '✅ Đã đăng bài mới!');
      resetForm();
      loadPosts();
    } else {
      const err = await res.json();
      alert('❌ Lỗi: ' + err.message);
    }
  } catch (err) {
    alert('❌ Lỗi kết nối!');
  } finally {
    btn.disabled = false;
  }
});

loadPosts();
</script>
