---
layout: default
title: Quản lý & Xem trước Bài viết
body_class: page-index
---
<style>
  /* Reset & Full Width Layout */
  .admin-wrapper { width: 100%; max-width: 100% !important; padding: 10px 15px; box-sizing: border-box; }
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
  
  /* Mobile Tab Toggle */
  .view-tabs { display: none; margin-bottom: 10px; gap: 10px; }
  .tab-btn { flex: 1; padding: 10px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-weight: bold; cursor: pointer; }
  .tab-btn.active { background: var(--pri); color: #fff; border-color: var(--pri); }

  /* Responsive Adjustments */
  @media (max-width: 850px) {
    .view-tabs { display: flex; }
    .admin-grid { grid-template-columns: 1fr; }
    .pane-preview { display: none; } /* Mặc định ẩn preview trên mobile, bật qua Tab */
    .pane-preview.active-mobile { display: block !important; }
    .pane-editor.hide-mobile { display: none !important; }
  }

  /* Live Preview Box */
  .preview-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 15px; min-height: 350px; height: 100%; overflow-y: auto; color: var(--text); }
  .preview-box pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; overflow-x: auto; font-family: monospace; }
</style>

<div class="admin-wrapper">
  
  <!-- CẤU HÌNH GITHUB (Thu gọn) -->
  <details style="margin-bottom: 12px; background: var(--card); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border);">
    <summary style="cursor: pointer; font-weight: bold; font-size: 14px;">⚙️ Cấu hình GitHub Token & Repository</summary>
    <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
      <input type="text" id="cfgOwner" placeholder="Tên User (vd: longhai)" style="flex:1; min-width: 140px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <input type="text" id="cfgRepo" placeholder="Tên Repo (vd: codes)" style="flex:1; min-width: 140px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <input type="password" id="cfgToken" placeholder="GitHub Token (ghp_...)" style="flex:2; min-width: 200px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
      <button type="button" onclick="saveConfig()" style="padding: 8px 15px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-weight: bold; cursor: pointer;">Lưu</button>
    </div>
  </details>

  <!-- THANH CHỌN BÀI VIẾT (Tối ưu ngang) -->
  <div style="background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 15px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center;">
    <select id="postSelect" style="flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; text-overflow: ellipsis;">
      <option value="">-- Danh sách bài viết cũ --</option>
    </select>
    <button type="button" onclick="resetForm()" style="padding: 8px 15px; background: #22c55e; color: #fff; border: 0; border-radius: 6px; font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer;">➕ Bài mới</button>
  </div>

  <!-- NÚT CHUYỂN TAB TRÊN MOBILE -->
  <div class="view-tabs">
    <button type="button" class="tab-btn active" id="btnTabEdit" onclick="switchMobileTab('edit')">✏️ Soạn thảo</button>
    <button type="button" class="tab-btn" id="btnTabPreview" onclick="switchMobileTab('preview')">👁️ Xem trước thực tế</button>
  </div>

  <!-- KHU VỰC CHÍNH: SOẠN THẢO (TRÁI) & XEM TRƯỚC (PHẢI) -->
  <div class="admin-grid">
    
    <!-- CỘT SOẠN THẢO -->
    <div class="pane-editor" style="background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="formTitle" style="font-size: 15px; margin: 0;">✏️ Soạn thảo</h3>
        <div style="display: flex; gap: 15px;">
          <label style="font-size: 13px; cursor: pointer;"><input type="radio" name="postType" value="code" checked onchange="updatePreview()"> 💻 Mã Code</label>
          <label style="font-size: 13px; cursor: pointer;"><input type="radio" name="postType" value="text" onchange="updatePreview()"> 📝 Văn bản</label>
        </div>
      </div>

      <form id="postForm" style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
        <input type="text" id="title" placeholder="Tiêu đề bài viết..." required oninput="updatePreview()" style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; font-weight: bold;">

        <textarea id="content" placeholder="Nhập nội dung bài viết hoặc mã HTML/JS..." rows="16" required oninput="updatePreview()" style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: monospace; font-size: 13px; line-height: 1.4; flex: 1; resize: vertical;"></textarea>

        <button type="submit" id="submitBtn" style="padding: 12px; background: var(--pri); color: #fff; border: 0; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer;">🚀 Đăng bài ngay</button>
      </form>
    </div>

    <!-- CỘT XEM TRƯỚC (REALTIME PREVIEW) -->
    <div class="pane-preview" style="background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column;">
      <h3 style="font-size: 15px; margin: 0 0 12px 0;">👁️ Giao diện thực tế hiển thị trên Trang</h3>
      <div class="preview-box">
        <h1 id="pvTitle" style="margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 20px;"></h1>
        <div id="pvBody"></div>
      </div>
    </div>

  </div>
</div>

<script>
let GH_CONFIG = JSON.parse(localStorage.getItem('gh_cfg') || '{}');
let rawPostsList = [];
let currentSha = null, currentPath = null;

document.getElementById('cfgOwner').value = GH_CONFIG.owner || 'longhai';
document.getElementById('cfgRepo').value = GH_CONFIG.repo || 'codes';
document.getElementById('cfgToken').value = GH_CONFIG.token || '';

function saveConfig() {
  GH_CONFIG = {
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    token: document.getElementById('cfgToken').value.trim()
  };
  localStorage.setItem('gh_cfg', JSON.stringify(GH_CONFIG));
  alert('Đã lưu cấu hình!');
  loadPosts();
}

// Chuyển Tab xem trên Điện thoại
function switchMobileTab(tab) {
  const ed = document.querySelector('.pane-editor');
  const pv = document.querySelector('.pane-preview');
  const btnEd = document.getElementById('btnTabEdit');
  const btnPv = document.getElementById('btnTabPreview');

  if (tab === 'preview') {
    ed.classList.add('hide-mobile');
    pv.classList.add('active-mobile');
    btnPv.classList.add('active');
    btnEd.classList.remove('active');
  } else {
    ed.classList.remove('hide-mobile');
    pv.classList.remove('active-mobile');
    btnEd.classList.add('active');
    btnPv.classList.remove('active');
  }
}

// Xử lý Cập nhật Xem trước Thực tế (Live Preview)
function updatePreview() {
  const title = document.getElementById('title').value || 'Tiêu đề bài viết...';
  const content = document.getElementById('content').value || 'Nội dung sẽ hiển thị tại đây...';
  const isCode = document.querySelector('input[name="postType"]:checked').value === 'code';

  document.getElementById('pvTitle').textContent = title;
  
  const pvBody = document.getElementById('pvBody');
  if (isCode) {
    // Trình diễn dạng Mã Code
    pvBody.innerHTML = `<pre><code>${escapeHtml(content)}</code></pre>`;
  } else {
    // Trình diễn dạng HTML / Văn bản thực tế
    pvBody.innerHTML = content;
  }
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// Nạp danh sách bài viết
async function loadPosts() {
  const selectEl = document.getElementById('postSelect');
  if (!GH_CONFIG.token) {
    selectEl.innerHTML = '<option value="">Chưa có Token! Mở cấu hình để nhập.</option>';
    return;
  }

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/_posts`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    
    if (!res.ok) {
      selectEl.innerHTML = `<option value="">Lỗi ${res.status}: Sai Token hoặc Repo</option>`;
      return;
    }

    const files = await res.json();
    rawPostsList = files.filter(f => f.type === 'file' && (f.name.endsWith('.html') || f.name.endsWith('.md')));

    selectEl.innerHTML = `<option value="">-- Bài viết cũ (${rawPostsList.length} bài) --</option>`;
    
    rawPostsList.reverse().forEach((file, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = file.name.replace(/^\d{4}-\d{2}-\d{2}-/, '');
      selectEl.appendChild(opt);
    });
  } catch (err) {
    selectEl.innerHTML = '<option value="">Lỗi kết nối API!</option>';
  }
}

document.getElementById('postSelect').addEventListener('change', (e) => {
  const idx = e.target.value;
  if (idx !== "") {
    const selectedFile = rawPostsList[idx];
    editPost(selectedFile.path, selectedFile.sha);
  } else {
    resetForm();
  }
});

function resetForm() {
  currentSha = null; currentPath = null;
  document.getElementById('postForm').reset();
  document.getElementById('postSelect').value = "";
  document.getElementById('formTitle').textContent = '✏️ Soạn bài mới';
  document.getElementById('submitBtn').textContent = '🚀 Đăng bài ngay';
  document.getElementById('submitBtn').style.background = 'var(--pri)';
  updatePreview();
}

async function editPost(path, sha) {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${path}`, {
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}` }
    });
    const data = await res.json();
    const rawText = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));

    const titleMatch = rawText.match(/title:\s*["']?([^"'\n]+)["']?/);
    const typeMatch = rawText.match(/type:\s*(\w+)/);

    const contentParts = rawText.split(/^---$/m);
    let body = contentParts.length >= 3 ? contentParts.slice(2).join('---').trim() : rawText;

    document.getElementById('title').value = titleMatch ? titleMatch[1] : path.split('/').pop();
    
    const postType = typeMatch ? typeMatch[1] : (path.endsWith('.html') ? 'code' : 'text');
    document.querySelector(`input[name="postType"][value="${postType}"]`).checked = true;

    if (postType === 'code') {
      body = body.replace(/^```html\n?/, '').replace(/\n?```$/, '');
    }
    
    document.getElementById('content').value = body;

    currentSha = sha; currentPath = path;
    document.getElementById('formTitle').textContent = '✏️ Cập nhật bài viết';
    document.getElementById('submitBtn').textContent = '💾 Lưu thay đổi';
    document.getElementById('submitBtn').style.background = '#2563eb';
    
    updatePreview();
  } catch(e) {
    alert('Không nạp được bài viết!');
  }
}

document.getElementById('postForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!GH_CONFIG.token) return alert('Chưa có Token!');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  const title = document.getElementById('title').value.trim();
  const rawContent = document.getElementById('content').value;
  const isCode = document.querySelector('input[name="postType"]:checked').value === 'code';

  const today = new Date().toISOString().split('T')[0];
  const slug = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
  
  const finalBody = isCode ? "```html\n" + rawContent + "\n```" : rawContent;
  const fileContent = `---\nlayout: post\ntitle: "${title}"\ndate: ${today}\ntype: ${isCode ? 'code' : 'text'}\n---\n\n${finalBody}`;
  
  const filePath = currentPath || `_posts/${today}-${slug}.html`;
  const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

  const payload = { message: `Update/Create: ${title}`, content: encodedContent };
  if (currentSha) payload.sha = currentSha;

  try {
    const res = await fetch(`https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${filePath}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${GH_CONFIG.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      alert(currentSha ? '✅ Đã lưu thay đổi!' : '✅ Đã đăng bài mới!');
      resetForm();
      loadPosts();
    } else {
      const err = await res.json();
      alert('❌ Lỗi: ' + err.message);
    }
  } catch (err) {
    alert('❌ Lỗi kết nối!');
  } finally {
    btn.disabled = false;
  }
});

loadPosts();
updatePreview();
</script>
