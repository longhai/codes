layout: null

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/split.js@1.6.5/dist/split.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#111;color:#eee}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{height:100%;display:flex;flex-direction:column}
header{height:52px;display:flex;align-items:center;gap:7px;padding:7px 10px;background:#181818;border-bottom:1px solid #333}
header button,.bar button{background:#292929;color:#eee;border-radius:6px;padding:7px 11px}
header button:hover,.bar button:hover{background:#383838}
select{background:#202020;color:#eee;border:1px solid #444;border-radius:6px;padding:7px;min-width:180px}
main{flex:1;min-height:0}
#edit,#preview{min-width:0;min-height:0;overflow:hidden}
#edit{display:flex;flex-direction:column}
#preview{background:#080808}
.bar{display:flex;align-items:center;gap:7px;padding:7px;background:#181818;border-bottom:1px solid #333}
.bar input{flex:1;min-width:0;background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:8px}
#content{flex:1;width:100%;resize:none;border:0;outline:0;background:#101010;color:#eee;padding:12px;font-family:Consolas,monospace;font-size:14px;line-height:1.5}
iframe{width:100%;height:100%;border:0;background:#fff}
.auth{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}
.auth.show{display:flex}
.box{width:min(430px,100%);background:#1c1c1c;border:1px solid #444;border-radius:10px;padding:16px;box-shadow:0 10px 40px #000}
.box h3{margin:0 0 12px}
.box input{display:block;width:100%;margin:8px 0;background:#111;color:#fff;border:1px solid #444;border-radius:6px;padding:9px}
.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.primary{background:#1769aa!important}
.danger{background:#8e2222!important}
.green{background:#176b38!important}
.mobile-tabs{display:none}
@media(max-width:700px){
 header{height:auto;flex-wrap:wrap}
 header select{order:10;width:100%}
 main{position:relative}
 #edit,#preview{position:absolute;inset:0}
 #preview{display:none}
 .mobile-tabs{display:flex}
}
</style>
</head>
<body>

<div class="app">
<header>
<button onclick="newPost()">＋ Mới</button>
<button onclick="fileInput.click()">📂 Mở file</button>
<select id="postSelect">
<option value="">-- Chọn bài viết --</option>
</select>
<button onclick="openAuth()">⚙️ Auth</button>
<button onclick="resetForm()">🧹 Xóa form</button>
</header>

<div class="mobile-tabs">
<button onclick="showTab('edit')">✏️ Edit</button>
<button onclick="showTab('preview')">👁 Preview</button>
</div>

<main id="main">
<section id="edit">
<div class="bar">
<input id="title" placeholder="Tiêu đề">
<button onclick="subForm()" id="saveBtn" class="green">💾 Lưu</button>
<button onclick="delPost()" id="delBtn" class="danger">🗑 Xóa</button>
<button onclick="cycleSplit()" id="layoutBtn">➡️ Phải</button>
</div>
<textarea id="content" spellcheck="false" placeholder="Nội dung..."></textarea>
</section>

<section id="preview">
<iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
</section>
</main>
</div>

<input id="fileInput" type="file" accept=".html,.htm,.txt,.md" hidden>

<div class="auth" id="auth">
<div class="box">
<h3>GitHub API</h3>
<input id="owner" placeholder="Owner">
<input id="repo" placeholder="Repository">
<input id="token" type="password" placeholder="GitHub Token">
<div class="actions">
<button class="primary" onclick="saveCfg()">💾 Lưu</button>
<button onclick="closeAuth()">Đóng</button>
<button class="danger" onclick="clearKey()">🗑 Xóa Key</button>
</div>
</div>
</div>

<script>
let C=JSON.parse(localStorage.getItem('gh_cfg')||'{}');
let list=[],cSha=null,cPath=null,dirty=false;
let splitInstance=null,currentPosIndex=0;
const positions=['right','bottom','left','top'];
const posIcons={right:'➡️ Phải',bottom:'⬇️ Dưới',left:'⬅️ Trái',top:'⬆️ Trên'};

const $=id=>document.getElementById(id);
const title=$('title'),content=$('content'),postSelect=$('postSelect');
const fileInput=$('fileInput');

function utf8ToBase64(str){
 const bytes=new TextEncoder().encode(str);
 let bin='',n=0x8000;
 for(let i=0;i<bytes.length;i+=n)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+n));
 return btoa(bin);
}

function base64ToUtf8(str){
 const bin=atob(str.replace(/\s/g,''));
 const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new TextDecoder().decode(bytes);
}

function apiUrl(path){
 const p=path.split('/').map(encodeURIComponent).join('/');
 return `https://api.github.com/repos/${encodeURIComponent(C.owner)}/${encodeURIComponent(C.repo)}/contents/${p}`;
}

async function req(path,method='GET',body=null){
 const o={
  method,
  headers:{
   Authorization:`Bearer ${C.token}`,
   'Content-Type':'application/json',
   Accept:'application/vnd.github+json',
   'X-GitHub-Api-Version':'2022-11-28'
  }
 };
 if(body)o.body=JSON.stringify(body);
 return fetch(apiUrl(path),o);
}

async function fetchFile(path){
 const r=await req(path);
 let d=null;
 try{d=await r.json()}catch{}
 return {ok:r.ok,status:r.status,data:d};
}

function openAuth(){
 $('owner').value=C.owner||'longhai';
 $('repo').value=C.repo||'codes';
 $('token').value=C.token||'';
 $('auth').classList.add('show');
}

function closeAuth(){
 $('auth').classList.remove('show');
}

async function saveCfg(){
 const owner=$('owner').value.trim();
 const repo=$('repo').value.trim();
 const token=$('token').value.trim();
 if(!owner||!repo||!token)return alert('Nhập đầy đủ Owner, Repository và Token');
 C={owner,repo,token};
 localStorage.setItem('gh_cfg',JSON.stringify(C));
 closeAuth();
 list=[];
 cSha=null;
 cPath=null;
 dirty=false;
 postSelect.innerHTML='<option value="">-- Chọn bài viết --</option>';
 await load();
}

function clearKey(){
 if(!confirm('Xóa Owner, Repository và GitHub Key đã lưu trên máy?'))return;
 localStorage.removeItem('gh_cfg');
 C={};
 list=[];
 cSha=null;
 cPath=null;
 dirty=false;
 postSelect.innerHTML='<option value="">-- Chọn bài viết --</option>';
 title.value='';
 content.value='';
 pv();
 closeAuth();
 alert('Đã xóa Key');
}

function markDirty(){
 dirty=true;
}

title.addEventListener('input',markDirty);
content.addEventListener('input',()=>{dirty=true;pv()});

function renderList(selectedPath=''){
 postSelect.innerHTML='<option value="">-- Chọn bài viết --</option>';
 list.forEach((x,i)=>{
  const o=document.createElement('option');
  o.value=i;
  o.textContent=x.name||x.path;
  postSelect.appendChild(o);
 });
 if(selectedPath){
  const i=list.findIndex(x=>x.path===selectedPath);
  if(i>=0)postSelect.value=i;
 }
}

async function load(){
 if(!C.owner||!C.repo||!C.token){
  openAuth();
  return;
 }
 const r=await req('_posts');
 if(!r.ok){
  let m='Không thể tải _posts';
  try{
   const d=await r.json();
   if(d.message)m+=`: ${d.message}`;
  }catch{}
  alert(m);
  return;
 }
 const data=await r.json();
 list=(Array.isArray(data)?data:[])
  .filter(x=>x.type==='file'&&/\.(html?|md)$/i.test(x.name))
  .sort((a,b)=>a.name.localeCompare(b.name));
 renderList(cPath||'');
}

postSelect.onchange=async()=>{
 const value=postSelect.value;
 if(dirty&&!confirm('Nội dung chưa lưu. Chuyển bài viết?')){
  const i=list.findIndex(x=>x.path===cPath);
  postSelect.value=i>=0?i:'';
  return;
 }
 if(value===''){
  clearForm();
  return;
 }
 await edit(list[Number(value)].path);
};

function clearForm(){
 title.value='';
 content.value='';
 cSha=null;
 cPath=null;
 dirty=false;
 postSelect.value='';
 pv();
}

function resetForm(){
 if(dirty&&!confirm('Nội dung chưa lưu. Xóa form?'))return;
 clearForm();
}

function newPost(){
 resetForm();
}

async function edit(path){
 const r=await fetchFile(path);
 if(!r.ok)return alert('Không đọc được file');
 const d=r.data;
 let text='';
 try{text=base64ToUtf8(d.content||'')}catch(e){return alert('Không giải mã được file')}

 text=text.replace(/^---[\s\S]*?---\s*/,'');
 text=text.replace(/^```(?:html)?\s*/i,'').replace(/\s*```$/,'');

 title.value=path.split('/').pop().replace(/\.(html?|md)$/i,'').replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/[-_]+/g,' ');
 content.value=text;
 cSha=d.sha;
 cPath=d.path||path;
 dirty=false;
 postSelect.value=list.findIndex(x=>x.path===cPath);
 pv();
}

function slug(s){
 return s.toLowerCase()
 .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
 .replace(/đ/g,'d')
 .replace(/[^a-z0-9]+/g,'-')
 .replace(/^-+|-+$/g,'');
}

async function delPost(){
 if(!cPath)return alert('Chưa chọn bài viết');
 if(!C.token)return openAuth();
 if(!confirm(`Xóa "${cPath}"?`))return;

 const btn=$('delBtn');
 const old=btn.textContent;
 btn.disabled=true;
 btn.textContent='⏳ Đang xóa...';

 try{
  let r=await req(cPath);
  if(!r.ok)throw new Error('Không lấy được SHA');
  let d=await r.json();

  let res=await req(cPath,'DELETE',{
   message:`Delete ${cPath}`,
   sha:d.sha
  });

  if(res.status===409){
   r=await req(cPath);
   if(!r.ok)throw new Error('Không lấy được SHA mới');
   d=await r.json();
   res=await req(cPath,'DELETE',{
    message:`Delete ${cPath}`,
    sha:d.sha
   });
  }

  if(!res.ok){
   let d2={};
   try{d2=await res.json()}catch{}
   throw new Error(d2.message||`HTTP ${res.status}`);
  }

  list=list.filter(x=>x.path!==cPath);
  clearForm();
  renderList();
  alert('Đã xóa');
 }catch(e){
  alert('Lỗi: '+e.message);
 }finally{
  btn.disabled=false;
  btn.textContent=old;
 }
}

async function subForm(){
 if(!C.token)return openAuth();

 let name=title.value.trim();
 let text=content.value;

 if(!text.trim())return alert('Nội dung đang trống');

 if(!name){
  const m=text.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  name=m?m[1].trim():'Bài viết';
 }

 let path=cPath;
 const isNew=!path;

 if(!path){
  const s=slug(name)||`post-${Date.now()}`;
  path=`_posts/${new Date().toISOString().slice(0,10)}-${s}.html`;
 }

 const btn=$('saveBtn');
 const old=btn.textContent;
 btn.disabled=true;
 btn.textContent='⏳ Đang lưu...';

 try{
  let sha=cSha;

  if(!isNew){
   const r=await req(path);
   if(!r.ok)throw new Error('Không lấy được SHA mới');
   const d=await r.json();
   sha=d.sha;
  }

  const body={
   message:isNew?`Add ${path}`:`Update ${path}`,
   content:utf8ToBase64(text)
  };

  if(sha)body.sha=sha;

  let r=await req(path,'PUT',body);

  if(r.status===409){
   const r2=await req(path);
   if(!r2.ok)throw new Error('Không lấy được SHA mới');
   const d2=await r2.json();
   body.sha=d2.sha;
   r=await req(path,'PUT',body);
  }

  let d={};
  try{d=await r.json()}catch{}

  if(!r.ok)throw new Error(d.message||`HTTP ${r.status}`);

  cSha=d.content?.sha||d.sha||body.sha;
  cPath=path;
  dirty=false;

  const item={
   name:path.split('/').pop(),
   path
  };

  if(isNew){
   list.push(item);
   list.sort((a,b)=>a.name.localeCompare(b.name));
  }else{
   const i=list.findIndex(x=>x.path===path);
   if(i>=0)list[i]={...list[i],...item};
  }

  renderList(path);
  alert(isNew?'Đã đăng bài':'Đã lưu');
 }catch(e){
  alert('Lỗi: '+e.message);
 }finally{
  btn.disabled=false;
  btn.textContent=cPath?'💾 Lưu':'🚀 Đăng';
 }
}

fileInput.onchange=()=>{
 const f=fileInput.files[0];
 if(!f)return;

 if(dirty&&!confirm('Nội dung hiện tại chưa lưu. Mở file mới?')){
  fileInput.value='';
  return;
 }

 const rd=new FileReader();
 rd.onload=()=>{
  title.value=f.name.replace(/\.(html?|md|txt)$/i,'');
  content.value=rd.result;
  cSha=null;
  cPath=null;
  dirty=true;
  postSelect.value='';
  pv();
 };
 rd.readAsText(f);
 fileInput.value='';
};

function pv(){
 let html=content.value;
 $('frame').srcdoc=html;
}

function initSplit(){
 splitInstance=Split(['#edit','#preview'],{
  direction:'horizontal',
  sizes:[55,45],
  minSize:[150,150],
  gutterSize:7,
  cursor:'col-resize'
 });
}

function cycleSplit(){
 currentPosIndex=(currentPosIndex+1)%positions.length;
 const p=positions[currentPosIndex];
 if(splitInstance){
  splitInstance.destroy();
  splitInstance=null;
 }

 if(p==='right'||p==='left'){
  main.style.flexDirection='row';
  initSplit();
  if(p==='left'){
   splitInstance.setSizes([45,55]);
   main.insertBefore($('preview'),$('edit'));
  }else{
   main.insertBefore($('edit'),$('preview'));
   splitInstance.setSizes([55,45]);
  }
 }else{
  main.style.flexDirection='column';
  splitInstance=Split(['#edit','#preview'],{
   direction:'vertical',
   sizes:p==='top'?[55,45]:[45,55],
   minSize:[150,150],
   gutterSize:7,
   cursor:'row-resize'
  });
  if(p==='top'){
   main.insertBefore($('edit'),$('preview'));
  }else{
   main.insertBefore($('preview'),$('edit'));
  }
 }

 $('layoutBtn').textContent=posIcons[p];
}

function showTab(tab){
 if(innerWidth>700)return;
 $('edit').style.display=tab==='edit'?'flex':'none';
 $('preview').style.display=tab==='preview'?'block':'none';
}

window.addEventListener('beforeunload',e=>{
 if(dirty){
  e.preventDefault();
  e.returnValue='';
 }
});

if(C.owner&&C.repo&&C.token)load();
else openAuth();

pv();
initSplit();
</script>
</body>
</html>
