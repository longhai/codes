---
layout: default
---
<div class="toolbar">
  <span class="pen-title">{{ page.title | default: "Untitled Pen" }}</span>
  <div class="actions">
    <button id="btn-copy" class="btn">📋 Copy Code</button>
    <button id="btn-fork" class="btn btn-primary">🍴 Fork</button>
  </div>
</div>

<div class="codepen-container">
  <div class="editors">
    <div class="editor-box">
      <h3>HTML</h3>
      <textarea id="html-code">{{ page.html_initial }}</textarea>
    </div>
    <div class="editor-box">
      <h3>CSS</h3>
      <textarea id="css-code">{{ page.css_initial }}</textarea>
    </div>
    <div class="editor-box">
      <h3>JS</h3>
      <textarea id="js-code">{{ page.js_initial }}</textarea>
    </div>
  </div>
  <div class="preview">
    <iframe id="output-frame"></iframe>
  </div>
</div>

<!-- CodeMirror Scripts... -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

<script>
  // 1. Khởi tạo Editors
  const htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-code'), { mode: 'xml', htmlMode: true, lineNumbers: true });
  const cssEditor = CodeMirror.fromTextArea(document.getElementById('css-code'), { mode: 'css', lineNumbers: true });
  const jsEditor = CodeMirror.fromTextArea(document.getElementById('js-code'), { mode: 'javascript', lineNumbers: true });

  // 2. Kiểm tra nếu đây là bản Fork được tải từ LocalStorage
  const urlParams = new URLSearchParams(window.location.search);
  const forkId = urlParams.get('fork');
  if (forkId) {
    const savedFork = localStorage.getItem('fork_' + forkId);
    if (savedFork) {
      const data = JSON.parse(savedFork);
      htmlEditor.setValue(data.html);
      cssEditor.setValue(data.css);
      jsEditor.setValue(data.js);
    }
  }

  // 3. Render Preview Live
  function updatePreview() {
    const html = htmlEditor.getValue();
    const css = `<style>${cssEditor.getValue()}</style>`;
    const js = `<script>${jsEditor.getValue()}<\/script>`;
    
    const iframe = document.getElementById('output-frame').contentWindow.document;
    iframe.open();
    iframe.write(html + css + js);
    iframe.close();
  }

  htmlEditor.on('change', updatePreview);
  cssEditor.on('change', updatePreview);
  jsEditor.on('change', updatePreview);
  updatePreview();

  // 4. Nút Copy Code
  document.getElementById('btn-copy').addEventListener('click', () => {
    const fullCode = `<!-- HTML -->\n${htmlEditor.getValue()}\n\n/* CSS */\n${cssEditor.getValue()}\n\n// JS\n${jsEditor.getValue()}`;
    navigator.clipboard.writeText(fullCode).then(() => {
      const btn = document.getElementById('btn-copy');
      btn.innerText = '✅ Copied!';
      setTimeout(() => btn.innerText = '📋 Copy Code', 2000);
    });
  });

  // 5. Nút Fork
  document.getElementById('btn-fork').addEventListener('click', () => {
    const forkData = {
      html: htmlEditor.getValue(),
      css: cssEditor.getValue(),
      js: jsEditor.getValue(),
      timestamp: new Date().getTime()
    };
    
    // Tạo ID ngẫu nhiên cho bản Fork
    const newForkId = 'fork_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('fork_' + newForkId, JSON.stringify(forkData));

    // Chuyển hướng tới URL bản Fork mới
    const currentUrl = window.location.pathname;
    window.location.href = `${currentUrl}?fork=${newForkId}`;
  });
</script>
