layout: null
---
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Pens - CodePen Grid</title>
  <style>
    /* Reset CSS cơ bản */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #131417; /* Màu nền tối CodePen */
      color: #ffffff;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Bố cục Lưới Card Responsive */
    .pen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* Thẻ Card Bài Viết */
    .pen-card {
      background-color: #1e1f26;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .pen-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    /* Khung Ảnh Thumbnail */
    .preview-box {
      width: 100%;
      height: 200px;
      background-color: #2c2d30;
      position: relative;
      overflow: hidden;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .pen-card:hover .preview-box img {
      transform: scale(1.05);
    }

    /* Phần Nội Dung Card */
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pen-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .more-btn {
      color: #717790;
      font-size: 18px;
    }

    /* Nút Tương Tác Chân Trang */
    .card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-btn {
      background-color: #2c2d30;
      border: none;
      color: #9b9dad;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .stat-btn:hover {
      background-color: #3b3d45;
      color: #ffffff;
    }

    /* Responsive cho màn hình nhỏ dưới 480px */
    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }
      .pen-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="pen-grid">

      <!-- Vòng lặp tự động lấy tất cả bài viết trong thư mục _posts -->
      {% for post in site.posts %}
      <a href="{{ site.baseurl }}/viewer.html?post={{ post.url | relative_url }}" class="pen-card">
        
        <!-- Ảnh Chụp Màn Hình Tự Động (Auto-Screenshot CDN) -->
        <div class="preview-box">
          <img 
            src="https://s0.wp.com/mshots/v1/{{ site.url | append: site.baseurl | append: post.url | encode_uri }}?w=800&h=500" 
            alt="{{ post.title }}"
            loading="lazy"
          >
        </div>

        <!-- Thông Tin Tiêu Đề & Chỉ Số -->
        <div class="card-body">
          <div class="card-header">
            <h3 class="pen-title">{{ post.title }}</h3>
            <span class="more-btn">•••</span>
          </div>
        </div>

      </a>
      {% endfor %}

    </div>
  </div>

</body>
</html>
