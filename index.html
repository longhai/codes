---
layout: default
title: "Jekyll Playground - Danh sách bài viết"
---
<div style="padding: 20px; max-width: 800px; margin: 0 auto; color: #fff;">
  <h1>🚀 Jekyll Playground</h1>
  <ul>
    {% for post in site.posts %}
      <li style="margin-bottom: 10px;">
        <a href="{{ post.url | relative_url }}" style="color: #4caf50; font-size: 18px; text-decoration: none;">
          {{ post.title }}
        </a>
        <small style="color: #888;">- {{ post.date | date: "%Y-%m-%d" }}</small>
      </li>
    {% endfor %}
  </ul>
</div>
