---
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Pens - CodePen Grid</title>
  <!-- Nhúng file CSS Tailwind tĩnh đã build -->
  <link rel="stylesheet" href="{{ site.baseurl }}/output.css">
</head>
<body class="bg-[#131417] text-white p-5 md:p-10 font-sans">

  <div class="max-w-[1200px] mx-auto">
    <div class="grid grid-cols-[repeat(auto-fill,minmax(320px,1fr))] gap-6">

      {% for post in site.posts %}
      <a href="{{ site.baseurl }}/viewer.html?post={{ post.url | relative_url }}" class="bg-[#1e1f26] rounded-lg overflow-hidden flex flex-col transition-all duration-200 hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(0,0,0,0.4)] no-underline text-inherit group">
        
        <!-- Khung xem trước dạng Ảnh chụp màn hình tự động -->
        <div class="w-full h-[200px] bg-[#2c2d30] relative overflow-hidden">
          <img 
            src="https://s0.wp.com/mshots/v1/{{ site.url | append: site.baseurl | append: post.url | encode_uri }}?w=800&h=500" 
            alt="{{ post.title }}"
            loading="lazy"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
          >
        </div>

        <!-- Thông tin bài viết -->
        <div class="p-4 flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold text-white truncate max-w-[240px]">{{ post.title }}</h3>
            <span class="text-[#717790] text-lg">•••</span>
          </div>

          <div class="flex items-center gap-2">
            <button type="button" class="bg-[#2c2d30] hover:bg-[#3b3d45] text-[#9b9dad] hover:text-white border-0 px-3 py-1.5 rounded text-xs flex items-center gap-1.5 cursor-pointer">❤️ 0</button>
            <button type="button" class="bg-[#2c2d30] hover:bg-[#3b3d45] text-[#9b9dad] hover:text-white border-0 px-3 py-1.5 rounded text-xs flex items-center gap-1.5 cursor-pointer">💬 0</button>
            <button type="button" class="bg-[#2c2d30] hover:bg-[#3b3d45] text-[#9b9dad] hover:text-white border-0 px-3 py-1.5 rounded text-xs flex items-center gap-1.5 cursor-pointer">👁️ 0</button>
          </div>
        </div>

      </a>
      {% endfor %}

    </div>
  </div>

</body>
</html>
