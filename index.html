<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách bài viết</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 40px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 24px; color: #333; }
    .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-decoration: none; color: inherit; display: block; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card h3 { margin: 0 0 10px 0; color: #007bff; }
    .card p { margin: 0; color: #666; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Danh sách demo HTML</h1>
    
    <div class="post-grid">
      <!-- Link bài viết được dẫn thông qua viewer.html -->
      <a href="viewer.html?post=posts/bai-viet-1.html" class="card">
        <h3>Bài viết 01: VnExpress Demo</h3>
        <p>Xem giao diện bài viết tích hợp menu ẩn hiện trên PC & Mobile.</p>
      </a>

      <a href="viewer.html?post=posts/bai-viet-2.html" class="card">
        <h3>Bài viết 02: Mẫu giao diện khác</h3>
        <p>Mô tả ngắn gọn về bài viết số 2.</p>
      </a>
    </div>
  </div>

</body>
</html>
