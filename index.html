---
layout: null
---
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Pens - CodePen Grid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #131417;
      color: #ffffff;
      padding: 40px 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .pen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .pen-card {
      background-color: #1e1f26;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .pen-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    .preview-box {
      width: 100%;
      height: 200px;
      background-color: #2c2d30;
      position: relative;
      overflow: hidden;
    }
    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .pen-card:hover .preview-box img { transform: scale(1.05); }
    .card-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; }
    
    /* Hiệu ứng skeleton chờ tải tiêu đề */
    .pen-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
      min-height: 22px;
    }
    .pen-title.loading {
      background-color: #2c2d30;
      border-radius: 4px;
      color: transparent;
      width: 140px;
    }
    
    .more-btn { color: #717790; font-size: 18px; }
    .card-footer { display: flex; align-items: center; gap: 8px; }
    .stat-btn {
      background-color: #2c2d30;
      border: none;
      color: #9b9dad;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="pen-grid">

      {% for post in site.posts %}
      <a href="{{ site.baseurl }}/viewer.html?post={{ post.url | relative_url }}" class="pen-card">
        
        <!-- Ảnh Chụp Màn Hình Tự Động -->
        <div class="preview-box">
          <img 
            src="https://s0.wp.com/mshots/v1/{{ site.url | append: site.baseurl | append: post.url | encode_uri }}?w=800&h=500" 
            alt="Preview"
            loading="lazy"
          >
        </div>

        <!-- Thông tin tiêu đề -->
        <div class="card-body">
          <div class="card-header">
            <!-- Thẻ h3 chứa URL trong data-url để JS tải tiêu đề -->
            <h3 class="pen-title loading" data-post-url="{{ post.url | relative_url }}">Loading...</h3>
            <span class="more-btn">•••</span>
          </div>

          <div class="card-footer">
            <button type="button" class="stat-btn">❤️ 0</button>
            <button type="button" class="stat-btn">💬 0</button>
            <button type="button" class="stat-btn">👁️ 0</button>
          </div>
        </div>

      </a>
      {% endfor %}

    </div>
  </div>

  <script>
    // JS tự động quét các thẻ h3 và fetch lấy thẻ <title> trong file HTML thật
    document.addEventListener("DOMContentLoaded", () => {
      const titleElements = document.querySelectorAll(".pen-title[data-post-url]");

      titleElements.forEach(el => {
        const url = el.getAttribute("data-post-url");

        fetch(url)
          .then(response => response.text())
          .then(htmlText => {
            // Dùng DOMParser để bóc tách thẻ <title> từ chuỗi HTML
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, "text/html");
            const pageTitle = doc.querySelector("title") ? doc.querySelector("title").innerText : "Untilled Pen";
            
            // Cập nhật tiêu đề vào Card
            el.textContent = pageTitle;
            el.classList.remove("loading");
          })
          .catch(() => {
            // Nếu lỗi thì lấy tên file làm tiêu đề thay thế
            const fallbackTitle = url.split('/').pop().replace('.html', '');
            el.textContent = fallbackTitle;
            el.classList.remove("loading");
          });
      });
    });
  </script>

</body>
</html>
