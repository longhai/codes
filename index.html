---
layout: default
title: "Jekyll Playground"
---

<style>
  body {
    background-color: #131417;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  .card {
    background: #1e1f26;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2c2d38;
    transition: transform 0.2s;
  }
  .card:hover {
    transform: translateY(-4px);
  }
  .card-preview {
    width: 100%;
    height: 180px;
    background: #000;
    object-fit: cover;
    display: block;
  }
  .card-body {
    padding: 12px 16px;
  }
  .card-title {
    margin: 0;
    font-size: 16px;
    color: #fff;
    text-decoration: none;
  }
  .card-title:hover {
    color: #4caf50;
  }
  .card-date {
    font-size: 12px;
    color: #76daff;
    margin-top: 4px;
    display: block;
  }
</style>

<div class="container">
  <h1>🚀 Jekyll Playground</h1>

  <div class="grid">
    {% for post in site.posts %}
      <div class="card">
        <a href="{{ post.url | relative_url }}">
          <img class="card-preview" src="{{ post.thumbnail | default: '/assets/images/default-demo.png' | relative_url }}" alt="{{ post.title }}">
        </a>
        <div class="card-body">
          <a class="card-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
          <span class="card-date">{{ post.date | date: "%Y-%m-%d" }}</span>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
