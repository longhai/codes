---
layout: null
---
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Bài viết</title>
  <style>
    :root {
      /* Bảng màu Tối (Soft Dark) - Sang trọng & Dễ chịu */
      --bg-color: #0f1115;
      --card-bg: #181b21;
      --preview-bg: #22262e;
      --text-color: #e4e6eb;
      --btn-bg: #22262e;
      --btn-text: #e4e6eb;
      --shadow: rgba(0, 0, 0, 0.3);
      --card-border: rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] {
      /* Bảng màu Sáng (Light) */
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --preview-bg: #edf2f7;
      --text-color: #2d3436;
      --btn-bg: #ffffff;
      --btn-text: #2d3436;
      --shadow: rgba(0, 0, 0, 0.08);
      --card-border: rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
      transition: background-color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      min-height: calc(100vh - 80px);
    }

    .header { display: flex; justify-content: flex-end; margin-bottom: 30px; }

    .theme-toggle {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 6px var(--shadow);
      transition: all 0.2s;
    }

    .theme-toggle:hover { filter: brightness(1.2); }

    .pen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .pen-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
    }

    .pen-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 30px var(--shadow);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .preview-box { width: 100%; height: 170px; background-color: var(--preview-bg); }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }

    .card-body { padding: 16px; }
    .pen-title { font-size: 15px; font-weight: 600; }

    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 15px; margin-top: 50px;
    }

    .page-btn {
      background: var(--btn-bg); color: var(--btn-text);
      border: 1px solid var(--card-border);
      padding: 8px 16px; border-radius: 8px;
      text-decoration: none; font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <button class="theme-toggle" id="theme-btn" onclick="cycleTheme()">🌐 Auto</button>
    </div>

    <div class="pen-grid">
      {% for post in paginator.posts %}
      <a href="{{ site.baseurl }}/viewer.html?post={{ post.url | relative_url }}" class="pen-card">
        <div class="preview-box">
          <img src="https://s0.wp.com/mshots/v1/{{ site.url | append: site.baseurl | append: post.url | encode_uri }}?w=800&h=500" loading="lazy">
        </div>
        <div class="card-body">
          <h3 class="pen-title" data-post-url="{{ post.url | relative_url }}">Loading...</h3>
        </div>
      </a>
      {% endfor %}
    </div>

    {% if paginator.total_pages > 1 %}
    <div class="pagination">
      {% if paginator.previous_page %}<a href="{{ paginator.previous_page_path | relative_url }}" class="page-btn">←</a>{% endif %}
      <span>{{ paginator.page }} / {{ paginator.total_pages }}</span>
      {% if paginator.next_page %}<a href="{{ paginator.next_page_path | relative_url }}" class="page-btn">→</a>{% endif %}
    </div>
    {% endif %}
  </div>

  <script>
    const modes = ['auto', 'light', 'dark']; // Loại bỏ chế độ 'time'

    function applyTheme() {
      const mode = localStorage.getItem('theme_mode') || 'auto';
      let activeTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      let btnText = '🌐 Auto';

      if (mode === 'light') {
        activeTheme = 'light';
        btnText = '☀️ Sáng';
      } else if (mode === 'dark') {
        activeTheme = 'dark';
        btnText = '🌙 Tối';
      }

      document.documentElement.setAttribute('data-theme', activeTheme);
      document.getElementById('theme-btn').textContent = btnText;
    }

    function cycleTheme() {
      const currentMode = localStorage.getItem('theme_mode') || 'auto';
      const currentIndex = modes.indexOf(currentMode);
      const nextMode = modes[(currentIndex + 1) % modes.length];
      localStorage.setItem('theme_mode', nextMode);
      applyTheme();
    }

    applyTheme();

    // Load tiêu đề
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".pen-title").forEach(el => {
        fetch(el.dataset.postUrl)
          .then(res => res.text())
          .then(html => {
            const doc = new DOMParser().parseFromString(html, "text/html");
            el.textContent = doc.querySelector("title")?.innerText || "Untitled";
          });
      });
    });
  </script>
</body>
</html>
