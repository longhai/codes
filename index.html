---
layout: default
title: "Jekyll CodePen Dashboard"
---

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background-color: #131417;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: #1e1f26;
    padding: 15px 30px;
    border-bottom: 1px solid #2c2d38;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 20px; color: #4caf50; }
  
  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    padding: 30px;
    max-width: 1400px;
    margin: 0 auto;
  }
  
  .pen-card {
    background: #1e1f26;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2c2d38;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .pen-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    border-color: #444857;
  }

  /* Khung Live Preview nhỏ của từng bài */
  .pen-preview {
    height: 200px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    pointer-events: none; /* Khóa tương tác chuột ở xem trước */
  }
  .pen-preview iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .pen-info {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e1f26;
  }
  .pen-title {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
  }
  .pen-title:hover { color: #4caf50; }
  .pen-date { font-size: 12px; color: #868996; }
</style>

<header>
  <h1>🚀 My CodePen Gallery</h1>
</header>

<div class="grid-container">
  {% for post in site.posts %}
    <div class="pen-card">
      <!-- Khung hiển thị Live Preview thu nhỏ -->
      <div class="pen-preview">
        <iframe srcdoc="
          <!DOCTYPE html>
          <html>
            <head><style>{{ post.css_initial | escape }}</style></head>
            <body>
              {{ post.html_initial | escape }}
              <script>{{ post.js_initial | escape }}<\/script>
            </body>
          </html>
        "></iframe>
      </div>

      <!-- Thông tin bài viết -->
      <div class="pen-info">
        <a href="{{ post.url | relative_url }}" class="pen-title">{{ post.title }}</a>
        <span class="pen-date">{{ post.date | date: "%b %d, %Y" }}</span>
      </div>
    </div>
  {% endfor %}
</div>
