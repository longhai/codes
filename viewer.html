<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem Bài Viết</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #131417; font-family: sans-serif; }

    .viewport-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }

    #content-frame {
      background-color: white;
      border: none;
      display: block;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* Hiệu ứng mượt khi chuyển PC/Mobile */
      transform-origin: center;
    }

    /* PC: Tràn 100% */
    .view-pc { width: 100% !important; height: 100% !important; }

    /* Mobile: Giới hạn chiều rộng */
    .view-mobile { width: 412px !important; height: 100% !important; box-shadow: 0 0 24px rgba(0,0,0,0.5); }

    /* Menu điều khiển */
    .floating-menu {
      position: fixed; top: 16px; right: 16px;
      display: flex; align-items: center; gap: 8px;
      background: rgba(30, 31, 38, 0.85); backdrop-filter: blur(10px);
      padding: 6px 12px; border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 9999; cursor: move; touch-action: none; /* Quan trọng cho di động */
      user-select: none;
    }
    
    .float-btn { color: #fff; background: rgba(255,255,255,0.1); border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="viewport-container">
    <iframe id="content-frame" class="view-pc" src="" scrolling="yes"></iframe>
  </div>

  <div class="floating-menu" id="drag-menu">
    <a href="index.html" class="float-btn">🏠</a>
    <button id="toggle-btn" class="float-btn" onclick="toggleDevice()">📱</button>
  </div>

  <script>
    const frame = document.getElementById('content-frame');
    const toggleBtn = document.getElementById('toggle-btn');
    const dragMenu = document.getElementById('drag-menu');

    // 1. Tải bài viết
    const urlParams = new URLSearchParams(window.location.search);
    frame.src = urlParams.get('post') || '';

    // 2. Chuyển đổi chế độ
    function toggleDevice() {
      if (frame.classList.contains('view-pc')) {
        frame.className = 'view-mobile';
        toggleBtn.textContent = '💻';
      } else {
        frame.className = 'view-pc';
        toggleBtn.textContent = '📱';
      }
    }

    // 3. Logic Kéo thả (Hỗ trợ cả Chuột và Cảm ứng)
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    function startDrag(e) {
      isDragging = true;
      const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      
      startX = clientX;
      startY = clientY;
      initialLeft = dragMenu.offsetLeft;
      initialTop = dragMenu.offsetTop;
    }

    function doDrag(e) {
      if (!isDragging) return;
      e.preventDefault(); // Ngăn cuộn trang khi đang kéo
      const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      
      dragMenu.style.left = (initialLeft + (clientX - startX)) + 'px';
      dragMenu.style.top = (initialTop + (clientY - startY)) + 'px';
      dragMenu.style.right = 'auto'; // Hủy bỏ quyền ưu tiên của right
    }

    function stopDrag() { isDragging = false; }

    // Gán sự kiện Mouse
    dragMenu.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', doDrag);
    document.addEventListener('mouseup', stopDrag);

    // Gán sự kiện Touch (Quan trọng cho điện thoại)
    dragMenu.addEventListener('touchstart', startDrag);
    document.addEventListener('touchmove', doDrag, {passive: false});
    document.addEventListener('touchend', stopDrag);

  </script>
</body>
</html>
