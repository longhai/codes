<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khung Xem Bài Viết</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #131417;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Loại bỏ hoàn toàn thanh cuộn trang chính */
    }

    /* Thanh điều khiển */
    .toolbar {
      height: 50px;
      background-color: #1e1f26;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #2c2d30;
      z-index: 10;
      flex-shrink: 0;
    }

    .back-btn {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 12px;
      background: #2c2d30;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .back-btn:hover {
      background: #3b3d45;
      color: #fff;
    }

    .device-switcher {
      display: flex;
      background: #2c2d30;
      padding: 3px;
      border-radius: 6px;
      gap: 2px;
    }

    .device-btn {
      background: transparent;
      border: none;
      color: #aaa;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }

    .device-btn.active {
      background: #444857;
      color: #fff;
    }

    /* Khu vực chứa Iframe xem trước */
    .viewport-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #131417;
      overflow: hidden;
      position: relative;
    }

    #content-frame {
      background-color: white;
      border: none;
      transition: transform 0.2s ease, width 0.2s ease, height 0.2s ease;
    }

    /* Chế độ PC: Tự động tràn 100% không gian hiển thị */
    .view-pc {
      width: 100% !important;
      height: 100% !important;
    }

    /* Chế độ Mobile: Kích thước khung chuẩn di động */
    .view-mobile {
      width: 375px !important;
      height: 667px !important;
      border-radius: 16px;
      border: 8px solid #2c2d30 !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <a href="index.html" class="back-btn">← Trang chủ</a>
    <div class="device-switcher">
      <button id="btn-pc" class="device-btn" onclick="setDevice('pc')">💻 Máy tính (PC)</button>
      <button id="btn-mobile" class="device-btn" onclick="setDevice('mobile')">📱 Điện thoại (Mobile)</button>
    </div>
  </div>

  <div class="viewport-container" id="container">
    <iframe id="content-frame" class="view-pc" src=""></iframe>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const postUrl = urlParams.get('post') || '';
    const frame = document.getElementById('content-frame');
    const container = document.getElementById('container');

    if (postUrl) {
      frame.src = postUrl;
    }

    // Kiểm tra thiết bị truy cập thực tế
    function isMobileDevice() {
      return window.innerWidth < 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // Phóng to / Thu nhỏ khung di động nếu màn hình nhỏ
    function scaleFrame() {
      if (frame.classList.contains('view-mobile')) {
        const containerWidth = container.clientWidth - 30;
        const containerHeight = container.clientHeight - 30;
        const mobileWidth = 375;
        const mobileHeight = 667;

        let scale = 1;
        if (containerWidth < mobileWidth || containerHeight < mobileHeight) {
          scale = Math.min(containerWidth / mobileWidth, containerHeight / mobileHeight);
        }
        frame.style.transform = `scale(${scale})`;
      } else {
        frame.style.transform = 'none';
      }
    }

    // Chuyển đổi qua lại giữa chế độ PC và Mobile
    function setDevice(device) {
      const btnPc = document.getElementById('btn-pc');
      const btnMobile = document.getElementById('btn-mobile');

      if (device === 'mobile') {
        frame.className = 'view-mobile';
        btnMobile.classList.add('active');
        btnPc.classList.remove('active');
      } else {
        frame.className = 'view-pc';
        btnPc.classList.add('active');
        btnMobile.classList.remove('active');
      }
      scaleFrame();
    }

    // Tự động bật chế độ phù hợp ngay khi truy cập
    if (isMobileDevice()) {
      setDevice('mobile');
    } else {
      setDevice('pc');
    }

    window.addEventListener('resize', scaleFrame);
    frame.addEventListener('load', scaleFrame);
  </script>

</body>
</html>
