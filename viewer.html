<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem Bài Viết</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --menu-bg: rgba(255, 255, 255, 0.9);
      --menu-border: rgba(0, 0, 0, 0.1);
      --btn-bg: rgba(0, 0, 0, 0.05);
      --btn-color: #334155;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #161920;
        --menu-bg: rgba(30, 36, 46, 0.9);
        --menu-border: rgba(255, 255, 255, 0.1);
        --btn-bg: rgba(255, 255, 255, 0.1);
        --btn-color: #fff;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
      width: 100%; 
      height: 100vh; 
      background-color: var(--bg-color); 
      font-family: sans-serif; 
      transition: background-color 0.3s ease;
      overflow: auto; /* Cho phép cuộn khi ở chế độ PC */
    }
    
    .viewport-container { 
      width: 100%; 
      height: 100%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    #content-frame { 
      background-color: white; 
      border: none; 
      transition: width 0.3s ease; 
    }
    
    /* Giao diện PC: Cố định độ rộng chuẩn PC (1280px) để tràn out màn hình điện thoại */
    .view-pc { 
      width: 1280px !important; 
      height: 100% !important; 
    }

    /* Giao diện Mobile: Vừa vặn màn hình điện thoại */
    .view-mobile { 
      width: 412px !important; 
      max-width: 100% !important;
      height: 100% !important; 
      box-shadow: 0 0 24px rgba(0,0,0,0.3); 
    }
    
    .floating-menu {
      position: fixed; top: 16px; right: 16px; display: flex; align-items: center; gap: 8px;
      background: var(--menu-bg); backdrop-filter: blur(10px);
      padding: 6px 12px; border-radius: 25px; border: 1px solid var(--menu-border);
      z-index: 9999; cursor: move; touch-action: none; user-select: none;
    }
    .float-btn { color: var(--btn-color); background: var(--btn-bg); border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
  <div class="viewport-container">
    <iframe id="content-frame" class="view-pc" src=""></iframe>
  </div>
  
  <div class="floating-menu" id="drag-menu">
    <a href="index.html" class="float-btn">🏠</a>
    <button id="toggle-btn" class="float-btn" onclick="toggleDevice()">📱</button>
  </div>

  <script>
    const frame = document.getElementById('content-frame');
    const toggleBtn = document.getElementById('toggle-btn');
    const dragMenu = document.getElementById('drag-menu');
    const viewportMeta = document.getElementById('viewport-meta');
    
    frame.src = new URLSearchParams(window.location.search).get('post') || '';

    function toggleDevice() {
      if (frame.classList.contains('view-pc')) {
        // Chuyển sang Mobile
        frame.className = 'view-mobile'; 
        toggleBtn.textContent = '💻';
        viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0');
      } else {
        // Chuyển sang PC (Cố định khung nhìn ở 1280px để giao diện PC hiển thị đúng kích thước thật)
        frame.className = 'view-pc'; 
        toggleBtn.textContent = '📱';
        viewportMeta.setAttribute('content', 'width=1280');
      }
    }

    // Thiết lập mặc định khi mở trang
    if (window.innerWidth <= 768) {
      toggleDevice(); // Nếu là màn hình nhỏ thì khởi chạy ở chế độ Mobile
    } else {
      viewportMeta.setAttribute('content', 'width=1280');
    }

    // Kéo thả nút bằng tay/chuột
    let isDragging = false, startX, startY, initialLeft, initialTop;
    function startDrag(e) { 
      isDragging = true; 
      const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      startX = clientX; startY = clientY;
      initialLeft = dragMenu.offsetLeft; initialTop = dragMenu.offsetTop;
    }
    function doDrag(e) {
      if (!isDragging) return; e.preventDefault();
      const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      dragMenu.style.left = (initialLeft + (clientX - startX)) + 'px';
      dragMenu.style.top = (initialTop + (clientY - startY)) + 'px';
      dragMenu.style.right = 'auto';
    }
    function stopDrag() { isDragging = false; }

    dragMenu.addEventListener('mousedown', startDrag);
    dragMenu.addEventListener('touchstart', startDrag, {passive: false});
    document.addEventListener('mousemove', doDrag);
    document.addEventListener('touchmove', doDrag, {passive: false});
    document.addEventListener('mouseup', stopDrag);
    document.addEventListener('touchend', stopDrag);
  </script>
</body>
</html>
